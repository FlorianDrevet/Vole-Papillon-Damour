name: Scan - deploy

# Manual only: the public scanner is released deliberately after its API is
# available and the infrastructure what-if has been reviewed. The custom host
# is the canonical browser origin and must stay aligned with Entra.
on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Image tag to build and deploy (default - the commit sha)
        type: string
        default: ''

permissions:
  id-token: write
  contents: read

env:
  RESOURCE_GROUP: rg-vpd-dev
  REGISTRY_NAME: vpdacrdev
  CONTAINER_APP: vpd-scan-ca-dev
  API_CONTAINER_APP: vpd-api-ca-dev
  APPLICATION_INSIGHTS: vpd-scan-appi-dev
  IMAGE_NAME: vpd-scan
  DOCKERFILE: src/Scan/Dockerfile
  BUILD_CONTEXT: src
  SCAN_PUBLIC_URL: https://scan.volepapillondamour.fr

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: development
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Configure Azure CLI
        run: az config set extension.use_dynamic_install=yes_without_prompt

      - name: Resolve image, API and telemetry addresses
        run: |
          set -euo pipefail
          TAG="${{ inputs.image_tag }}"
          if [ -z "$TAG" ]; then TAG="${GITHUB_SHA::7}"; fi
          LOGIN_SERVER=$(az acr show --name "$REGISTRY_NAME" --query loginServer --output tsv)
          API_FQDN=$(az containerapp show --name "$API_CONTAINER_APP" --resource-group "$RESOURCE_GROUP" \
            --query properties.configuration.ingress.fqdn --output tsv)
          SCAN_FQDN=$(az containerapp show --name "$CONTAINER_APP" --resource-group "$RESOURCE_GROUP" \
            --query properties.configuration.ingress.fqdn --output tsv)
          APPINSIGHTS=$(az monitor app-insights component show --app "$APPLICATION_INSIGHTS" \
            --resource-group "$RESOURCE_GROUP" --query connectionString --output tsv)
          {
            echo "IMAGE=$LOGIN_SERVER/$IMAGE_NAME:$TAG"
            echo "API_URL=https://$API_FQDN"
            echo "SCAN_REDIRECT_URI=$SCAN_PUBLIC_URL"
            echo "APPINSIGHTS_CONNECTION_STRING=$APPINSIGHTS"
          } >> "$GITHUB_ENV"

      - name: Build and push the image
        run: |
          set -euo pipefail
          az acr login --name "$REGISTRY_NAME"
          docker build \
            --file "$DOCKERFILE" \
            --build-arg "API_URL=$API_URL" \
            --build-arg "SCAN_REDIRECT_URI=$SCAN_REDIRECT_URI" \
            --build-arg "APPINSIGHTS_CONNECTION_STRING=$APPINSIGHTS_CONNECTION_STRING" \
            --tag "$IMAGE" \
            "$BUILD_CONTEXT"
          docker push "$IMAGE"

      - name: Roll the Container App onto the new image
        run: |
          set -euo pipefail
          az containerapp update \
            --name "$CONTAINER_APP" \
            --resource-group "$RESOURCE_GROUP" \
            --image "$IMAGE" \
            --output none

      - name: Report the deployed scanner
        run: |
          set -euo pipefail
          FQDN=$(az containerapp show --name "$CONTAINER_APP" --resource-group "$RESOURCE_GROUP" \
            --query properties.configuration.ingress.fqdn --output tsv)
          {
            echo "### Scan deployed"
            echo ""
            echo "- Image: \`$IMAGE\`"
            echo "- API baked into the bundle: $API_URL"
            echo "- Canonical URL: $SCAN_PUBLIC_URL"
            echo "- Temporary ACA URL: https://$FQDN"
          } >> "$GITHUB_STEP_SUMMARY"
