name: Storage - migrate blobs

# Manual only. Incrementally copies missing or source-newer blobs into the new
# account, preserves newer destination blobs and never deletes destination data.
# Database URL rewriting is separately selectable and defaults to skip.
on:
  workflow_dispatch:
    inputs:
      source_account:
        description: Storage account to copy the blobs from
        type: string
        default: vpdstdev
      target_account:
        description: Storage account to receive the blobs
        type: string
        default: vpdstdevfc
      rewrite_mode:
        description: Preview matching database URLs, apply the rewrite, or skip it
        type: choice
        options:
          - skip
          - preview
          - apply
        default: skip

permissions:
  id-token: write
  contents: read

env:
  RESOURCE_GROUP: rg-vpd-dev
  SQL_SERVER: vpd-sql-dev
  SQL_DATABASE: vole-papillon-damour-db

jobs:
  migrate:
    runs-on: ubuntu-latest
    environment: development
    env:
      TARGET_ACCOUNT: ${{ inputs.target_account }}
      REWRITE_MODE: ${{ inputs.rewrite_mode }}
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Copy missing or source-newer blobs
        run: |
          set -euo pipefail
          SOURCE="${{ inputs.source_account }}"
          SOURCE_RG=$(az storage account show --name "$SOURCE" --query resourceGroup --output tsv)
          SOURCE_KEY=$(az storage account keys list --account-name "$SOURCE" --resource-group "$SOURCE_RG" \
            --query "[0].value" --output tsv)
          TARGET_KEY=$(az storage account keys list --account-name "$TARGET_ACCOUNT" --resource-group "$RESOURCE_GROUP" \
            --query "[0].value" --output tsv)
          echo "::add-mask::$SOURCE_KEY"
          echo "::add-mask::$TARGET_KEY"

          containers=$(az storage container list --account-name "$SOURCE" --account-key "$SOURCE_KEY" \
            --query "[].name" --output tsv)

          for container in $containers; do
            echo "::group::$container"
            access=$(az storage container show --name "$container" --account-name "$SOURCE" \
              --account-key "$SOURCE_KEY" --query "properties.publicAccess" --output tsv)
            if [ -z "$access" ] || [ "$access" = "None" ]; then access=off; fi

            # The target needs read/list to compare destination timestamps when
            # AzCopy applies --overwrite=ifSourceNewer. Keep both SAS tokens short-lived.
            SAS_START=$(date -u -d "5 minutes ago" '+%Y-%m-%dT%H:%MZ')
            SAS_EXPIRY=$(date -u -d "2 hours" '+%Y-%m-%dT%H:%MZ')
            SOURCE_SAS=$(az storage container generate-sas --name "$container" \
              --account-name "$SOURCE" --account-key "$SOURCE_KEY" \
              --permissions rl --start "$SAS_START" --expiry "$SAS_EXPIRY" --https-only --output tsv)
            TARGET_SAS=$(az storage container generate-sas --name "$container" \
              --account-name "$TARGET_ACCOUNT" --account-key "$TARGET_KEY" \
              --permissions racwl --start "$SAS_START" --expiry "$SAS_EXPIRY" --https-only --output tsv)
            echo "::add-mask::$SOURCE_SAS"
            echo "::add-mask::$TARGET_SAS"

            # Preserve each source container's ACL. In particular, the Azure
            # Functions host and secrets containers must remain private.
            az storage container create --name "$container" \
              --account-name "$TARGET_ACCOUNT" --account-key "$TARGET_KEY" --output none
            az storage container set-permission --name "$container" \
              --account-name "$TARGET_ACCOUNT" --account-key "$TARGET_KEY" \
              --public-access "$access" --output none

            az storage copy \
              --source "https://$SOURCE.blob.core.windows.net/$container" \
              --destination "https://$TARGET_ACCOUNT.blob.core.windows.net/$container" \
              --recursive \
              --source-account-name "$SOURCE" --source-sas "$SOURCE_SAS" \
              --account-name "$TARGET_ACCOUNT" --sas-token "$TARGET_SAS" \
              -- --overwrite=ifSourceNewer

            echo "::endgroup::"
          done

          echo "CONTAINERS<<EOF" >> "$GITHUB_ENV"
          echo "$containers" >> "$GITHUB_ENV"
          echo "EOF" >> "$GITHUB_ENV"
          echo "TARGET_KEY=$TARGET_KEY" >> "$GITHUB_ENV"

      - name: Report the blob counts
        run: |
          set -euo pipefail
          SOURCE="${{ inputs.source_account }}"
          SOURCE_RG=$(az storage account show --name "$SOURCE" --query resourceGroup --output tsv)
          SOURCE_KEY=$(az storage account keys list --account-name "$SOURCE" --resource-group "$SOURCE_RG" \
            --query "[0].value" --output tsv)
          echo "::add-mask::$SOURCE_KEY"
          {
            echo "### Blobs"
            echo ""
            echo "| Container | $SOURCE source blobs | $TARGET_ACCOUNT target blobs | Source blobs missing at target |"
            echo "| --- | ---: | ---: | ---: |"
            for container in $CONTAINERS; do
              source_names=$(mktemp)
              target_names=$(mktemp)
              az storage blob list --container-name "$container" --account-name "$SOURCE" \
                --account-key "$SOURCE_KEY" --query "[].name" --output json > "$source_names"
              az storage blob list --container-name "$container" --account-name "$TARGET_ACCOUNT" \
                --account-key "$TARGET_KEY" --query "[].name" --output json > "$target_names"
              missing=$(python3 - "$source_names" "$target_names" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as source_file:
              source = set(json.load(source_file))
          with open(sys.argv[2], encoding="utf-8") as target_file:
              target = set(json.load(target_file))
          print(len(source - target))
          PY
              )
              a=$(python3 -c 'import json,sys; print(len(json.load(open(sys.argv[1], encoding="utf-8"))))' "$source_names")
              b=$(python3 -c 'import json,sys; print(len(json.load(open(sys.argv[1], encoding="utf-8"))))' "$target_names")
              rm -f "$source_names" "$target_names"
              echo "| $container | $a | $b | $missing |"
              if [ "$missing" -ne 0 ]; then
                echo "$missing source blobs are missing from target container $container" >&2
                exit 1
              fi
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Open the database to this runner
        if: inputs.rewrite_mode != 'skip'
        run: |
          set -euo pipefail
          RUNNER_IP=$(curl -fsS https://api.ipify.org)
          az sql server firewall-rule create \
            --resource-group "$RESOURCE_GROUP" --server "$SQL_SERVER" \
            --name "gh-rewrite-${{ github.run_id }}" \
            --start-ip-address "$RUNNER_IP" --end-ip-address "$RUNNER_IP" --output none

      - name: Rewrite the stored URLs
        if: inputs.rewrite_mode != 'skip'
        env:
          SQL_ADMIN_LOGIN: ${{ secrets.SQL_ADMIN_LOGIN }}
          SQL_ADMIN_PASSWORD: ${{ secrets.SQL_ADMIN_PASSWORD }}
        run: |
          set -euo pipefail
          SQL_FQDN=$(az sql server show --resource-group "$RESOURCE_GROUP" --name "$SQL_SERVER" \
            --query fullyQualifiedDomainName --output tsv)
          CONNECTION="Server=tcp:$SQL_FQDN,1433;Initial Catalog=$SQL_DATABASE;User ID=$SQL_ADMIN_LOGIN;Password=$SQL_ADMIN_PASSWORD;Encrypt=True;TrustServerCertificate=False;Connection Timeout=60;"
          OLD="https://${{ inputs.source_account }}.blob.core.windows.net/"
          NEW="https://$TARGET_ACCOUNT.blob.core.windows.net/"
          APPLY_ARGS=()
          if [ "$REWRITE_MODE" = "apply" ]; then APPLY_ARGS+=(--apply); fi
          dotnet run --project tools/DbRewriteUrls --configuration Release -- \
            "$CONNECTION" "$OLD" "$NEW" "${APPLY_ARGS[@]}" | tee rewrite.log

      - name: Close the database to this runner
        if: always() && inputs.rewrite_mode != 'skip'
        run: |
          az sql server firewall-rule delete \
            --resource-group "$RESOURCE_GROUP" --server "$SQL_SERVER" \
            --name "gh-rewrite-${{ github.run_id }}" --output none || true

      - name: Report the rewrite
        if: always() && inputs.rewrite_mode != 'skip'
        run: |
          {
            echo "### URLs"
            echo ""
            echo '```'
            cat rewrite.log 2>/dev/null || echo "no output captured"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
