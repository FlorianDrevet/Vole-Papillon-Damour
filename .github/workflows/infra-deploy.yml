name: Infra - deploy

# Manual only: nothing reaches Azure unless someone starts this run.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Preview the changes (what-if) or apply them (deploy)
        type: choice
        options:
          - what-if
          - deploy
        default: what-if

permissions:
  id-token: write
  contents: read

env:
  AZURE_LOCATION: westeurope
  PARAMETERS_FILE: infra/parameters/main.dev.bicepparam
  RESOURCE_GROUP: rg-vpd-dev
  API_CONTAINER_APP: vpd-api-ca-dev
  WEBSITE_CONTAINER_APP: vpd-web-ca-dev
  BACKOFFICE_CONTAINER_APP: vpd-bo-ca-dev

jobs:
  deploy:
    name: ${{ inputs.mode }}
    runs-on: ubuntu-latest
    environment: development
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Configure Azure CLI
        run: az config set extension.use_dynamic_install=yes_without_prompt

      # The application pipelines own the image tags. Without this, an infra
      # deployment would reset every app back to the placeholder image.
      - name: Read the images currently running
        run: |
          set -euo pipefail
          read_image () {
            az containerapp show --name "$1" --resource-group "$RESOURCE_GROUP" \
              --query "properties.template.containers[0].image" --output tsv 2>/dev/null || true
          }
          {
            echo "API_IMAGE=$(read_image "$API_CONTAINER_APP")"
            echo "WEBSITE_IMAGE=$(read_image "$WEBSITE_CONTAINER_APP")"
            echo "BACKOFFICE_IMAGE=$(read_image "$BACKOFFICE_CONTAINER_APP")"
          } >> "$GITHUB_ENV"

      - name: Preview the changes
        if: inputs.mode == 'what-if'
        env:
          SQL_ADMIN_LOGIN: ${{ secrets.SQL_ADMIN_LOGIN }}
          SQL_ADMIN_PASSWORD: ${{ secrets.SQL_ADMIN_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          ENTRA_GRAPH_CLIENT_ID: ${{ secrets.ENTRA_GRAPH_CLIENT_ID }}
          ENTRA_GRAPH_CLIENT_SECRET: ${{ secrets.ENTRA_GRAPH_CLIENT_SECRET }}
        run: |
          az deployment sub what-if \
            --name "vpd-infra-${{ github.run_number }}" \
            --location "$AZURE_LOCATION" \
            --parameters "$PARAMETERS_FILE"

      - name: Deploy
        id: deploy
        if: inputs.mode == 'deploy'
        env:
          SQL_ADMIN_LOGIN: ${{ secrets.SQL_ADMIN_LOGIN }}
          SQL_ADMIN_PASSWORD: ${{ secrets.SQL_ADMIN_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          ENTRA_GRAPH_CLIENT_ID: ${{ secrets.ENTRA_GRAPH_CLIENT_ID }}
          ENTRA_GRAPH_CLIENT_SECRET: ${{ secrets.ENTRA_GRAPH_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          az deployment sub create \
            --name "vpd-infra-${{ github.run_number }}" \
            --location "$AZURE_LOCATION" \
            --parameters "$PARAMETERS_FILE" \
            --query properties.outputs \
            --output json > outputs.json
          cat outputs.json

      - name: Report the deployed endpoints
        if: inputs.mode == 'deploy'
        run: |
          set -euo pipefail
          {
            echo "### Environment"
            echo ""
            echo "| Resource | Value |"
            echo "| --- | --- |"
            echo "| Resource group | \`$(jq -r .resourceGroupName.value outputs.json)\` |"
            echo "| Container registry | \`$(jq -r .containerRegistryLoginServer.value outputs.json)\` |"
            echo "| API | $(jq -r .apiUrl.value outputs.json) |"
            echo "| Website | $(jq -r .websiteUrl.value outputs.json) |"
            echo "| BackOffice | $(jq -r .backOfficeUrl.value outputs.json) |"
            echo "| SQL server | \`$(jq -r .sqlServerFqdn.value outputs.json)\` |"
            echo "| Storage account | \`$(jq -r .storageAccountName.value outputs.json)\` |"
            echo "| Key Vault | \`$(jq -r .keyVaultName.value outputs.json)\` |"
            echo "| ACS Email service | \`$(jq -r .communicationEmailServiceName.value outputs.json)\` |"
            echo "| ACS sending domain | \`$(jq -r .communicationEmailSendingDomain.value outputs.json)\` |"
          } >> "$GITHUB_STEP_SUMMARY"
