name: Infra - deploy

# Manual only: nothing reaches Azure unless someone starts this run.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Preview the changes (what-if) or apply them (deploy)
        type: choice
        options:
          - what-if
          - deploy
        default: what-if
      recommendations_enabled:
        description: Enable similar-book and personalized recommendations in the API and Worker
        type: boolean
        default: true

permissions:
  id-token: write
  contents: read

env:
  AZURE_LOCATION: francecentral
  PARAMETERS_FILE: infra/parameters/main.dev.bicepparam
  RESOURCE_GROUP: rg-vpd-dev
  API_CONTAINER_APP: vpd-api-ca-dev-fc
  WEBSITE_CONTAINER_APP: vpd-web-ca-dev-fc
  BACKOFFICE_CONTAINER_APP: vpd-bo-ca-dev-fc
  SCAN_CONTAINER_APP: vpd-scan-ca-dev-fc
  CATALOG_CONTAINER_APP: vpd-catalog-ca-dev-fc
  WORKER_CONTAINER_APP: vpd-worker-ca-dev-fc
  ACR_NAME: ${{ vars.ACR_NAME }}
  ACR_RESOURCE_GROUP: ${{ vars.ACR_RESOURCE_GROUP }}
  ACR_SUBSCRIPTION_ID: ${{ vars.ACR_SUBSCRIPTION_ID }}
  ACR_CI_PRINCIPAL_ID: ${{ vars.ACR_CI_PRINCIPAL_ID }}

jobs:
  deploy:
    name: ${{ inputs.mode }}
    runs-on: ubuntu-latest
    environment: development
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Configure Azure CLI
        run: |
          set -euo pipefail
          az config set extension.use_dynamic_install=yes_without_prompt
          for provider in Microsoft.Communication Microsoft.EventGrid Microsoft.ContainerInstance; do
            az provider register --namespace "$provider" --wait
          done

      - name: Validate infrastructure secrets
        env:
          ACS_EMAIL_WEBHOOK_SECRET: ${{ secrets.ACS_EMAIL_WEBHOOK_SECRET }}
          BOOK_ALERTS_UNSUBSCRIBE_SIGNING_KEY: ${{ secrets.BOOK_ALERTS_UNSUBSCRIBE_SIGNING_KEY }}
          MEMBER_CARD_SIGNING_KEY: ${{ secrets.MEMBER_CARD_SIGNING_KEY }}
          RECOMMENDATIONS_ENABLED: ${{ inputs.recommendations_enabled }}
          TITLE_GENERATION_ENABLED: ${{ secrets.TITLE_GENERATION_ENABLED }}
          TITLE_GENERATION_ACCOUNT_NAME: ${{ secrets.TITLE_GENERATION_ACCOUNT_NAME }}
          TITLE_GENERATION_DEPLOYMENT_NAME: ${{ secrets.TITLE_GENERATION_DEPLOYMENT_NAME }}
        run: |
          set -euo pipefail
          if [ -z "${ACS_EMAIL_WEBHOOK_SECRET:-}" ]; then
            echo "The development secret ACS_EMAIL_WEBHOOK_SECRET is not configured." >&2
            exit 1
          fi
          if [ -z "${BOOK_ALERTS_UNSUBSCRIBE_SIGNING_KEY:-}" ]; then
            echo "The development secret BOOK_ALERTS_UNSUBSCRIBE_SIGNING_KEY is not configured." >&2
            exit 1
          fi
          if [ -z "${MEMBER_CARD_SIGNING_KEY:-}" ]; then
            echo "The development secret MEMBER_CARD_SIGNING_KEY is not configured." >&2
            exit 1
          fi
          if [ "${RECOMMENDATIONS_ENABLED:-false}" = "true" ] || [ "${TITLE_GENERATION_ENABLED:-false}" = "true" ]; then
            if [ -z "${TITLE_GENERATION_ACCOUNT_NAME:-}" ]; then
              echo "The development secret TITLE_GENERATION_ACCOUNT_NAME is required for Worker Azure OpenAI access." >&2
              exit 1
            fi
          fi
          if [ "${TITLE_GENERATION_ENABLED:-false}" = "true" ] && [ -z "${TITLE_GENERATION_DEPLOYMENT_NAME:-}" ]; then
            echo "The development secret TITLE_GENERATION_DEPLOYMENT_NAME is required when title generation is enabled." >&2
            exit 1
          fi

      # The application pipelines own the image tags. Without this, an infra
      # deployment would reset every app back to the placeholder image.
      - name: Read the images currently running
        run: |
          set -euo pipefail
          read_image () {
            target_app="$1"
            image=$(az containerapp show --name "$target_app" --resource-group "$RESOURCE_GROUP" \
              --query "properties.template.containers[0].image" --output tsv 2>/dev/null || true)
            if [ "$image" = "mcr.microsoft.com/azuredocs/containerapps-helloworld:latest" ]; then
              image=""
            fi
            echo "$image"
          }
          {
            echo "API_IMAGE=$(read_image "$API_CONTAINER_APP")"
            echo "WEBSITE_IMAGE=$(read_image "$WEBSITE_CONTAINER_APP")"
            echo "BACKOFFICE_IMAGE=$(read_image "$BACKOFFICE_CONTAINER_APP")"
            echo "SCAN_IMAGE=$(read_image "$SCAN_CONTAINER_APP")"
            echo "CATALOG_IMAGE=$(read_image "$CATALOG_CONTAINER_APP")"
            echo "WORKER_IMAGE=$(read_image "$WORKER_CONTAINER_APP")"
          } >> "$GITHUB_ENV"

      - name: Preview the changes
        if: inputs.mode == 'what-if'
        env:
          SQL_ADMIN_LOGIN: ${{ secrets.SQL_ADMIN_LOGIN }}
          SQL_ADMIN_PASSWORD: ${{ secrets.SQL_ADMIN_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          ENTRA_GRAPH_CLIENT_ID: ${{ secrets.ENTRA_GRAPH_CLIENT_ID }}
          ENTRA_GRAPH_CLIENT_SECRET: ${{ secrets.ENTRA_GRAPH_CLIENT_SECRET }}
          ACS_EMAIL_WEBHOOK_SECRET: ${{ secrets.ACS_EMAIL_WEBHOOK_SECRET }}
          BOOK_ALERTS_UNSUBSCRIBE_SIGNING_KEY: ${{ secrets.BOOK_ALERTS_UNSUBSCRIBE_SIGNING_KEY }}
          MEMBER_CARD_SIGNING_KEY: ${{ secrets.MEMBER_CARD_SIGNING_KEY }}
          GOOGLE_BOOKS_API_KEY: ${{ secrets.GOOGLE_BOOKS_API_KEY }}
          ISBNDB_API_KEY: ${{ secrets.ISBNDB_API_KEY }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          INSTAGRAM_IMPORT_FLOOR_DATE: ${{ secrets.INSTAGRAM_IMPORT_FLOOR_DATE }}
          INSTAGRAM_ACCESS_TOKEN_ISSUED_AT: ${{ secrets.INSTAGRAM_ACCESS_TOKEN_ISSUED_AT }}
          TITLE_GENERATION_ENABLED: ${{ secrets.TITLE_GENERATION_ENABLED }}
          TITLE_GENERATION_ACCOUNT_NAME: ${{ secrets.TITLE_GENERATION_ACCOUNT_NAME }}
          TITLE_GENERATION_DEPLOYMENT_NAME: ${{ secrets.TITLE_GENERATION_DEPLOYMENT_NAME }}
          RECOMMENDATIONS_ENABLED: ${{ inputs.recommendations_enabled }}
        run: |
          set -euo pipefail
          az deployment sub what-if \
            --name "vpd-infra-${{ github.run_number }}" \
            --location "$AZURE_LOCATION" \
            --parameters "$PARAMETERS_FILE"

      - name: Deploy
        id: deploy
        if: inputs.mode == 'deploy'
        env:
          SQL_ADMIN_LOGIN: ${{ secrets.SQL_ADMIN_LOGIN }}
          SQL_ADMIN_PASSWORD: ${{ secrets.SQL_ADMIN_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          ENTRA_GRAPH_CLIENT_ID: ${{ secrets.ENTRA_GRAPH_CLIENT_ID }}
          ENTRA_GRAPH_CLIENT_SECRET: ${{ secrets.ENTRA_GRAPH_CLIENT_SECRET }}
          ACS_EMAIL_WEBHOOK_SECRET: ${{ secrets.ACS_EMAIL_WEBHOOK_SECRET }}
          BOOK_ALERTS_UNSUBSCRIBE_SIGNING_KEY: ${{ secrets.BOOK_ALERTS_UNSUBSCRIBE_SIGNING_KEY }}
          MEMBER_CARD_SIGNING_KEY: ${{ secrets.MEMBER_CARD_SIGNING_KEY }}
          GOOGLE_BOOKS_API_KEY: ${{ secrets.GOOGLE_BOOKS_API_KEY }}
          ISBNDB_API_KEY: ${{ secrets.ISBNDB_API_KEY }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          INSTAGRAM_IMPORT_FLOOR_DATE: ${{ secrets.INSTAGRAM_IMPORT_FLOOR_DATE }}
          INSTAGRAM_ACCESS_TOKEN_ISSUED_AT: ${{ secrets.INSTAGRAM_ACCESS_TOKEN_ISSUED_AT }}
          TITLE_GENERATION_ENABLED: ${{ secrets.TITLE_GENERATION_ENABLED }}
          TITLE_GENERATION_ACCOUNT_NAME: ${{ secrets.TITLE_GENERATION_ACCOUNT_NAME }}
          TITLE_GENERATION_DEPLOYMENT_NAME: ${{ secrets.TITLE_GENERATION_DEPLOYMENT_NAME }}
          RECOMMENDATIONS_ENABLED: ${{ inputs.recommendations_enabled }}
        run: |
          set -euo pipefail
          az deployment sub create \
            --name "vpd-infra-${{ github.run_number }}" \
            --location "$AZURE_LOCATION" \
            --parameters "$PARAMETERS_FILE" \
            --query properties.outputs \
            --output json > outputs.json
          cat outputs.json

      - name: Report the deployed endpoints
        if: inputs.mode == 'deploy'
        run: |
          set -euo pipefail
          {
            echo "### Environment"
            echo ""
            echo "| Resource | Value |"
            echo "| --- | --- |"
            echo "| Resource group | \`$(jq -r .resourceGroupName.value outputs.json)\` |"
            echo "| Container registry | \`$(jq -r .containerRegistryLoginServer.value outputs.json)\` |"
            echo "| API | $(jq -r .apiUrl.value outputs.json) |"
            echo "| Website | $(jq -r .websiteUrl.value outputs.json) |"
            echo "| BackOffice | $(jq -r .backOfficeUrl.value outputs.json) |"
            echo "| Scan | $(jq -r .scanUrl.value outputs.json) |"
            echo "| Catalog | $(jq -r .catalogUrl.value outputs.json) |"
            echo "| Worker | \`$(jq -r .workerContainerAppName.value outputs.json)\` (Functions queue and timers) |"
            echo "| Recommendations | \`${{ inputs.recommendations_enabled }}\` (API and Worker) |"
            echo "| SQL server | \`$(jq -r .sqlServerFqdn.value outputs.json)\` |"
            echo "| Storage account | \`$(jq -r .storageAccountName.value outputs.json)\` |"
            echo "| Key Vault | \`$(jq -r .keyVaultName.value outputs.json)\` |"
            echo "| ACS Email service | \`$(jq -r .communicationEmailServiceName.value outputs.json)\` |"
            echo "| ACS sending domain | \`$(jq -r .communicationEmailSendingDomain.value outputs.json)\` |"
          } >> "$GITHUB_STEP_SUMMARY"
