name: Database - import data

# Manual only. Brings the production data into the database the API points at,
# reading from vpd-sql-import — the copy of production that already sits on the
# same server. The production database itself is never connected to.
on:
  workflow_dispatch:
    inputs:
      source_database:
        description: Database to read the rows from
        type: string
        default: vpd-sql-import
      target_database:
        description: Database to write the rows into
        type: string
        default: vole-papillon-damour-db
      force:
        description: Overwrite tables that already hold rows (appends, does not clear)
        type: boolean
        default: false

permissions:
  id-token: write
  contents: read

env:
  RESOURCE_GROUP: rg-vpd-dev
  SQL_SERVER: vpd-sql-dev

jobs:
  import:
    runs-on: ubuntu-latest
    environment: development
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Azure SQL only accepts Azure egress by default, so the runner opens a
      # rule for its own address and closes it again whatever happens.
      - name: Open the database to this runner
        run: |
          set -euo pipefail
          RUNNER_IP=$(curl -fsS https://api.ipify.org)
          az sql server firewall-rule create \
            --resource-group "$RESOURCE_GROUP" \
            --server "$SQL_SERVER" \
            --name "gh-import-${{ github.run_id }}" \
            --start-ip-address "$RUNNER_IP" \
            --end-ip-address "$RUNNER_IP" \
            --output none

      - name: Import the rows
        env:
          SQL_ADMIN_LOGIN: ${{ secrets.SQL_ADMIN_LOGIN }}
          SQL_ADMIN_PASSWORD: ${{ secrets.SQL_ADMIN_PASSWORD }}
        run: |
          set -euo pipefail
          SQL_FQDN=$(az sql server show --resource-group "$RESOURCE_GROUP" --name "$SQL_SERVER" \
            --query fullyQualifiedDomainName --output tsv)
          base="Server=tcp:$SQL_FQDN,1433;User ID=$SQL_ADMIN_LOGIN;Password=$SQL_ADMIN_PASSWORD;Encrypt=True;TrustServerCertificate=False;Connection Timeout=60;"
          SOURCE="${base}Initial Catalog=${{ inputs.source_database }};"
          TARGET="${base}Initial Catalog=${{ inputs.target_database }};"
          FORCE=""
          if [ "${{ inputs.force }}" = "true" ]; then FORCE="--force"; fi
          dotnet run --project tools/DbImport --configuration Release -- "$SOURCE" "$TARGET" $FORCE | tee import.log

      - name: Close the database to this runner
        if: always()
        run: |
          az sql server firewall-rule delete \
            --resource-group "$RESOURCE_GROUP" \
            --server "$SQL_SERVER" \
            --name "gh-import-${{ github.run_id }}" \
            --output none || true

      - name: Report what was imported
        if: always()
        run: |
          {
            echo "### Import ${{ inputs.source_database }} -> ${{ inputs.target_database }}"
            echo ""
            echo '```'
            cat import.log 2>/dev/null || echo "no output captured"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
