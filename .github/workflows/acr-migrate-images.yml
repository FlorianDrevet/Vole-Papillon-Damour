name: ACR - migrate images

# Manual and repeatable: copy tagged images into the shared registry without
# deleting source images or overwriting a different image with the same tag.
on:
  workflow_dispatch:
    inputs:
      source_registry:
        description: Registry that currently contains the application images
        type: string
        required: true
        default: vpdacrdev

permissions:
  id-token: write
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    environment: development
    env:
      SOURCE_REGISTRY: ${{ inputs.source_registry }}
      TARGET_REGISTRY: ${{ vars.ACR_NAME }}
    steps:
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Validate registries and copy every tag
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$TARGET_REGISTRY" ]; then
            echo "The repository variable ACR_NAME is not configured." >&2
            exit 1
          fi
          if [ "$SOURCE_REGISTRY" = "$TARGET_REGISTRY" ]; then
            echo "Source and target registries must be different." >&2
            exit 1
          fi

          az acr show --name "$SOURCE_REGISTRY" --only-show-errors --output none
          az acr show --name "$TARGET_REGISTRY" --only-show-errors --output none
          repos=$(az acr repository list --name "$SOURCE_REGISTRY" --only-show-errors --output tsv | LC_ALL=C sort)
          if [ -z "$repos" ]; then
            echo "The source registry contains no repositories." >&2
            exit 1
          fi

          total_tags=0
          {
            echo "### ACR image migration"
            echo ""
            echo "Source: `$SOURCE_REGISTRY`; target: `$TARGET_REGISTRY`."
            echo ""
            echo "| Repository | Tags copied |"
            echo "| --- | ---: |"
          } >> "$GITHUB_STEP_SUMMARY"

          while IFS= read -r repository; do
            [ -n "$repository" ] || continue
            mapfile -t source_tags < <(az acr repository show-tags \
              --name "$SOURCE_REGISTRY" --repository "$repository" --only-show-errors --output tsv | LC_ALL=C sort)
            if [ "${#source_tags[@]}" -eq 0 ]; then
              echo "Skipping untagged repository: $repository"
              continue
            fi

            for tag in "${source_tags[@]}"; do
              source_digest=$(az acr manifest show-metadata --registry "$SOURCE_REGISTRY" \
                --name "$repository:$tag" --query digest --only-show-errors --output tsv)
              target_digest=$(az acr manifest show-metadata --registry "$TARGET_REGISTRY" \
                --name "$repository:$tag" --query digest --only-show-errors --output tsv 2>/dev/null || true)
              if [ "$target_digest" = "None" ]; then target_digest=""; fi
              if [ -n "$target_digest" ]; then
                if [ "$source_digest" != "$target_digest" ]; then
                  echo "Tag collision: $repository:$tag already points to a different image in $TARGET_REGISTRY." >&2
                  exit 1
                fi
                continue
              fi

              az acr import --name "$TARGET_REGISTRY" \
                --source "$SOURCE_REGISTRY.azurecr.io/$repository:$tag" \
                --image "$repository:$tag" --only-show-errors --output none
            done

            mapfile -t target_tags < <(az acr repository show-tags \
              --name "$TARGET_REGISTRY" --repository "$repository" --only-show-errors --output tsv | LC_ALL=C sort)
            for tag in "${source_tags[@]}"; do
              if ! printf '%s\n' "${target_tags[@]}" | grep -Fxq "$tag"; then
                echo "Tag verification failed for $repository:$tag." >&2
                exit 1
              fi
              source_digest=$(az acr manifest show-metadata --registry "$SOURCE_REGISTRY" \
                --name "$repository:$tag" --query digest --only-show-errors --output tsv)
              target_digest=$(az acr manifest show-metadata --registry "$TARGET_REGISTRY" \
                --name "$repository:$tag" --query digest --only-show-errors --output tsv)
              if [ "$source_digest" != "$target_digest" ]; then
                echo "Digest verification failed for $repository:$tag." >&2
                exit 1
              fi
            done

            total_tags=$((total_tags + ${#source_tags[@]}))
            echo "| $repository | ${#source_tags[@]} |" >> "$GITHUB_STEP_SUMMARY"
          done <<< "$repos"

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Verified $total_tags tags across the source repositories." >> "$GITHUB_STEP_SUMMARY"
