name: Worker - deploy

# Manual only: the worker is deployed separately from the API so migrations
# and the long-running Functions host can be verified independently.
on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Image tag to build and deploy (default - the commit sha)
        type: string
        default: ''

permissions:
  id-token: write
  contents: read

env:
  RESOURCE_GROUP: rg-vpd-dev
  REGISTRY_NAME: vpdacrdev
  CONTAINER_APP: vpd-worker-ca-dev
  IMAGE_NAME: vpd-worker
  DOCKERFILE: src/Backend/Vole_Papillon_Damour.Worker/Dockerfile
  BUILD_CONTEXT: src/Backend

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: development
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Configure Azure CLI
        run: az config set extension.use_dynamic_install=yes_without_prompt

      - name: Resolve the image reference
        run: |
          set -euo pipefail
          TAG="${{ inputs.image_tag }}"
          if [ -z "$TAG" ]; then TAG="${GITHUB_SHA::7}"; fi
          LOGIN_SERVER=$(az acr show --name "$REGISTRY_NAME" --query loginServer --output tsv)
          echo "IMAGE=$LOGIN_SERVER/$IMAGE_NAME:$TAG" >> "$GITHUB_ENV"

      - name: Build and push the image
        run: |
          set -euo pipefail
          az acr login --name "$REGISTRY_NAME"
          docker build \
            --file "$DOCKERFILE" \
            --tag "$IMAGE" \
            "$BUILD_CONTEXT"
          docker push "$IMAGE"

      - name: Roll the Functions Container App onto the new image
        run: |
          set -euo pipefail
          az containerapp update \
            --name "$CONTAINER_APP" \
            --resource-group "$RESOURCE_GROUP" \
            --image "$IMAGE" \
            --output none

      - name: Report the deployed worker
        run: |
          set -euo pipefail
          STATUS=$(az containerapp show --name "$CONTAINER_APP" --resource-group "$RESOURCE_GROUP" \
            --query '{provisioningState:properties.provisioningState,runningStatus:properties.runningStatus,latestRevision:properties.latestRevisionName}' \
            --output json)
          {
            echo "### Worker deployed"
            echo ""
            echo "- Image: \`$IMAGE\`"
            echo "- Container App: \`$CONTAINER_APP\`"
            echo "- Status: \`$STATUS\`"
          } >> "$GITHUB_STEP_SUMMARY"
