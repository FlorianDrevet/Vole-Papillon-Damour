<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>E12 · Confirmer le retrait — desktop</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Libre+Franklin:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400;1,6..72,500&display=swap">
  <style>
    body { margin: 0; background: #f7fbfe; -webkit-font-smoothing: antialiased; }
    a { text-decoration: none; }
    a:focus-visible, button:focus-visible { outline: 2px solid #0c6ea6; outline-offset: 2px; }
  </style>
</head>
<body>
<div style="position: relative; width: 1440px; height: 760px; overflow: hidden; background: #f7fbfe; font-family: 'Libre Franklin', system-ui, sans-serif; color: #072b45;">

  <div aria-hidden="true" style="position: absolute; inset: 0; padding: 80px; background: #f7fbfe;">
    <div style="height: 56px; width: 60%; background: #e9f4fb; margin-bottom: 28px;"></div>
    <div style="height: 320px; width: 100%; background: #e9f4fb;"></div>
  </div>

  <div style="position: absolute; inset: 0; background: rgba(4, 29, 48, .55);"></div>

  <div role="dialog" aria-modal="true" aria-labelledby="e12-title" aria-describedby="e12-texte" data-zone="E12-fenetre" style="position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 540px; box-sizing: border-box; padding: 32px; background: #ffffff; border: 1px solid #d9e9f4; box-shadow: 0 18px 48px rgba(4, 29, 48, .28);">

    <button data-zone="E12-fermer" type="button" aria-label="Fermer" style="position: absolute; top: 14px; right: 14px; width: 44px; height: 44px; border: 0; background: transparent; font-size: 24px; line-height: 1; color: #4e6c84;">×</button>

    <span style="display: block; width: 56px; height: 3px; border-radius: 999px; background: linear-gradient(90deg, #1497d6, #7fd8f5 50%, #f0801c);"></span>
    <span style="display: block; margin-top: 16px; font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: .16em; text-transform: uppercase; color: #dc6412;">Mes coups de cœur</span>
    <h2 id="e12-title" data-zone="E12-titre" style="margin: 10px 0 0; font-family: 'Newsreader', Georgia, serif; font-size: 28px; font-weight: 500; line-height: 1.15;">Retirer ce coup de cœur ?</h2>

    <div style="display: flex; gap: 14px; align-items: center; margin-top: 20px; padding: 14px; border: 1px solid #d9e9f4; background: #f7fbfe;">
      <div aria-hidden="true" style="flex: none; width: 46px; height: 68px; border: 1px solid #d9e9f4; background-image: repeating-linear-gradient(135deg, #dceffa 0 8px, #f2fafd 8px 16px);"></div>
      <div style="display: flex; flex-direction: column; gap: 3px;">
        <span data-zone="E12-livre" style="font-family: 'Newsreader', Georgia, serif; font-size: 18px; font-weight: 500;">Dune</span>
        <span style="font-size: 13px; color: #4e6c84;">Frank Herbert</span>
      </div>
    </div>

    <p id="e12-texte" data-zone="E12-texte" style="margin: 18px 0 0; font-size: 14.5px; line-height: 1.55; color: #33536e;">Le retrait est enregistré dès que vous confirmez. Les suggestions qui ne reposaient que sur ce livre disparaîtront de la page.</p>

    <div style="display: flex; justify-content: flex-end; gap: 12px; margin-top: 28px;">
      <a data-zone="E12-annuler" href="E2-Desktop.html" style="display: inline-flex; align-items: center; min-height: 44px; padding: 0 22px; border: 1px solid #072b45; border-radius: 999px; background: #ffffff; font-size: 14.5px; font-weight: 600; color: #072b45;">Annuler</a>
      <a data-zone="E12-retirer" href="E2-Desktop.html" style="display: inline-flex; align-items: center; min-height: 44px; padding: 0 22px; border: 1px solid #a3263e; border-radius: 999px; background: #a3263e; font-size: 14.5px; font-weight: 600; color: #ffffff;">Retirer</a>
    </div>
  </div>
</div>
</body>
</html>
