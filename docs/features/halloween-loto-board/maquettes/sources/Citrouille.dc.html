<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Citrouille</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
.pk svg{display:block;width:100%;height:100%;overflow:visible}
.pk .body{transform-origin:80px 140px;animation:pk-breathe 4.2s ease-in-out infinite}
@keyframes pk-breathe{50%{transform:scale(1.018,.985)}}
.pk .eye{transform-box:fill-box;transform-origin:center;animation:pk-blink 5.6s infinite}
.pk .eye-r{animation-delay:.04s}
@keyframes pk-blink{0%,91%,100%{transform:scaleY(1)}94%{transform:scaleY(.08)}97%{transform:scaleY(1)}}
.pk .pupil{animation:pk-glance 9s ease-in-out infinite}
@keyframes pk-glance{0%,28%{transform:translate(0,0)}34%,50%{transform:translate(-3.5px,.5px)}56%,72%{transform:translate(3.5px,.5px)}78%,100%{transform:translate(0,0)}}
.pk .fire,.pk .halo{animation:pk-flicker 2.4s linear infinite}
@keyframes pk-flicker{0%,100%{opacity:1}11%{opacity:.84}19%{opacity:.97}33%{opacity:.8}46%{opacity:1}58%{opacity:.88}71%{opacity:.98}84%{opacity:.82}}
.pk .halo{opacity:.22}
.pk .mouth{transform-box:fill-box;transform-origin:50% 0}
.pk-sourire .mouth{animation:pk-smile 1.3s cubic-bezier(.3,1.4,.5,1) both}
@keyframes pk-smile{0%{transform:scale(1,1)}30%{transform:scale(1.12,1.3)}100%{transform:scale(1,1)}}
.pk-sourire .eye{animation:pk-happy 1.3s both}
@keyframes pk-happy{0%,100%{transform:scaleY(1)}30%,70%{transform:scaleY(.55)}}
.pk-rire .mouth{animation:pk-laugh .3s ease-in-out infinite alternate}
@keyframes pk-laugh{from{transform:scale(1,1)}to{transform:scale(1.08,1.5)}}
.pk-rire .eye{animation:none;transform:scaleY(.42)}
.pk-rire .body{animation:pk-shake .3s ease-in-out infinite alternate}
@keyframes pk-shake{from{transform:rotate(-2.5deg)}to{transform:rotate(2.5deg) translateY(-2px)}}
.pk .eyes-shut,.pk .zz{display:none}
.pk-dort .eyes-open{display:none}
.pk-dort .eyes-shut,.pk-dort .zz{display:inline}
.pk-dort .fire{opacity:.6;animation-duration:4.5s}
.pk-dort .body{animation-duration:5.5s}
.pk-dort .mouth{transform:scale(.5,.38)}
.pk .zz text{transform-box:fill-box;opacity:0;animation:z-rise 4.5s ease-out infinite}
.pk .zz text:nth-child(2){animation-delay:1.5s}
.pk .zz text:nth-child(3){animation-delay:3s}
@keyframes z-rise{0%{opacity:0;transform:translate(0,0) scale(.6)}20%{opacity:1}100%{opacity:0;transform:translate(16px,-42px) scale(1.25)}}
.pk-salut .body{animation:pk-hop 1.1s infinite}
@keyframes pk-hop{0%,60%,100%{transform:translateY(0) scale(1)}20%{transform:translateY(-12px) scale(.97,1.04);animation-timing-function:ease-in}40%{transform:translateY(0) scale(1.05,.95)}}
</style>
</helmet>
<div class="{{cls}}" style="position: relative; width: {{w}}px; height: {{h}}px;">
  <svg viewBox="0 0 160 146" aria-hidden="true">
    <defs>
      <radialGradient id="pkSkin" cx="42%" cy="34%" r="70%"><stop offset="0" stop-color="#ffab5c"></stop><stop offset=".55" stop-color="#ff7b1c"></stop><stop offset="1" stop-color="#b9440a"></stop></radialGradient>
      <radialGradient id="pkSkinBack" cx="50%" cy="40%" r="70%"><stop offset="0" stop-color="#e2620f"></stop><stop offset="1" stop-color="#8f3306"></stop></radialGradient>
      <radialGradient id="pkFire" cx="50%" cy="45%" r="65%"><stop offset="0" stop-color="#fff6c4"></stop><stop offset=".5" stop-color="#ffcf5a"></stop><stop offset="1" stop-color="#ff8a1c"></stop></radialGradient>
    </defs>
    <ellipse class="halo" cx="80" cy="140" rx="56" ry="6" fill="#ff9a2e"></ellipse>
    <g class="body">
      <ellipse cx="40" cy="88" rx="36" ry="48" fill="url(#pkSkinBack)"></ellipse>
      <ellipse cx="120" cy="88" rx="36" ry="48" fill="url(#pkSkinBack)"></ellipse>
      <ellipse cx="57" cy="88" rx="34" ry="52" fill="url(#pkSkin)"></ellipse>
      <ellipse cx="103" cy="88" rx="34" ry="52" fill="url(#pkSkin)"></ellipse>
      <ellipse cx="80" cy="88" rx="33" ry="54" fill="url(#pkSkin)"></ellipse>
      <path d="M64 40 C55 66 55 112 64 138" stroke="#b5450b" stroke-opacity=".45" stroke-width="2" fill="none"></path>
      <path d="M96 40 C105 66 105 112 96 138" stroke="#b5450b" stroke-opacity=".45" stroke-width="2" fill="none"></path>
      <path d="M72 42 C66 54 64 68 66 80 C69 66 72 54 78 44 Z" fill="#ffe0b5" opacity=".35"></path>
      <path d="M74 38 C72 26 75 16 84 10 L90 14 C84 19 82 27 84 38 Z" fill="#56652a"></path>
      <path d="M84 10 L90 14 L88 16 L83 12 Z" fill="#3e4a1c"></path>
      <path d="M88 15 C98 8 108 14 104 21 C101 26 95 22 98 18" stroke="#7d963a" stroke-width="2.4" fill="none" stroke-linecap="round"></path>
      <g class="fire">
        <g class="eyes-open">
          <g class="eye eye-l"><path d="M44 76 Q56 56 70 72 Q58 80 44 76 Z" fill="url(#pkFire)"></path><circle class="pupil" cx="59" cy="72" r="3.6" fill="#4a1a05"></circle></g>
          <g class="eye eye-r"><path d="M116 76 Q104 56 90 72 Q102 80 116 76 Z" fill="url(#pkFire)"></path><circle class="pupil" cx="101" cy="72" r="3.6" fill="#4a1a05"></circle></g>
        </g>
        <g class="eyes-shut"><path d="M46 72 Q57 79 68 72" stroke="#ffcf5a" stroke-width="3.4" fill="none" stroke-linecap="round"></path><path d="M92 72 Q103 79 114 72" stroke="#ffcf5a" stroke-width="3.4" fill="none" stroke-linecap="round"></path></g>
        <path d="M75 90 L80 81 L85 90 Z" fill="url(#pkFire)"></path>
        <g class="mouth">
          <path d="M42 98 L52 104 L58 99 L66 106 L74 100 L80 107 L86 100 L94 106 L102 99 L108 104 L118 98 Q112 124 80 126 Q48 124 42 98 Z" fill="url(#pkFire)"></path>
          <path d="M75 126 L80 117 L85 126 Z" fill="#e8660f"></path>
        </g>
      </g>
    </g>
    <g class="zz" font-family="Fraunces, Georgia, serif" font-style="italic" font-weight="700" fill="#b8a5cf">
      <text x="116" y="42" font-size="15">z</text>
      <text x="116" y="42" font-size="18">z</text>
      <text x="116" y="42" font-size="21">z</text>
    </g>
  </svg>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"size":{"editor":"int","default":220,"min":40,"max":400},"mood":{"editor":"enum","default":"idle","options":["idle","sourire","rire","dort","salut"]},"$preview":{"width":220,"height":200}}'>
class Component extends DCLogic {
  renderVals() {
    var size = Number(this.props.size ?? 220);
    var mood = this.props.mood ?? "idle";
    return { cls: "pk pk-" + mood, w: size, h: Math.round(size * 146 / 160) };
  }
}
</script>
</body>
</html>
