<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Réglage du thème du tableau</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500&amp;family=Libre+Franklin:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
.bo{font-family:"Libre Franklin",system-ui,sans-serif;color:#041d30}
.field{position:relative;display:flex;flex-direction:column;justify-content:flex-end;height:56px;padding:0 16px 8px;border-radius:6px 6px 0 0;background:#e9f4fb;box-shadow:inset 0 -1px 0 #7d97ab;box-sizing:border-box}
.field label{position:absolute;top:8px;left:16px;font-size:12px;color:#4d6a80}
.field span{font-size:16px}
.field svg{position:absolute;right:14px;top:22px}
.field-on{box-shadow:inset 0 -2px 0 #0c6ea6}
.field-on label{color:#0c6ea6}
.hint{font-size:12px;line-height:1.4;color:#4d6a80;padding:4px 16px 0}
.opt{display:flex;align-items:center;gap:12px;height:48px;padding:0 16px;font-size:15px}
.opt-on{background:#e9f4fb}
.dot{width:18px;height:18px;border-radius:5px}
</style>
</helmet>
<div class="bo" style="width: 760px; height: 560px; box-sizing: border-box; padding: 40px; background: #c7d6e2; display: flex; gap: 32px; align-items: flex-start;">
  <div style="width: 440px; box-sizing: border-box; padding: 24px; border-radius: 16px; background: #f7fbfe; box-shadow: 0 18px 40px rgba(4,29,48,.25); display: flex; flex-direction: column; gap: 18px;">
    <div style="display: flex; flex-direction: column; gap: 8px;">
      <h1 style="margin: 0; font-family: Newsreader, Georgia, serif; font-weight: 500; font-size: 24px; color: #072b45;">Modifier un évènement</h1>
      <div style="height: 1px; background: #e2eef7;"></div>
    </div>
    <div class="field"><label>Type d'évènement</label><span>Loto</span><svg width="10" height="6" viewBox="0 0 10 6" aria-hidden="true"><path d="M0 0 L5 6 L10 0 Z" fill="#4d6a80"></path></svg></div>
    <div class="field"><label>Titre</label><span>Loto de test</span></div>
    <div data-zone="E1-champ-theme">
      <div class="field field-on"><label>Thème du tableau en direct</label><span>Halloween</span><svg width="10" height="6" viewBox="0 0 10 6" aria-hidden="true"><path d="M0 0 L5 6 L10 0 Z" fill="#0c6ea6"></path></svg></div>
      <p class="hint" style="margin: 0;" data-zone="E1-aide-theme">Halloween s'affiche sur les téléphones des joueurs. La projection ne change pas.</p>
    </div>
    <div style="display: flex; justify-content: flex-end; gap: 10px; padding-top: 8px;">
      <button type="button" style="height: 40px; padding: 0 18px; border: 0; border-radius: 999px; background: transparent; color: #0c6ea6; font: 600 14px 'Libre Franklin', sans-serif;">Annuler</button>
      <button type="button" style="height: 40px; padding: 0 20px; border: 0; border-radius: 999px; background: #0c6ea6; color: #ffffff; font: 600 14px 'Libre Franklin', sans-serif;">Enregistrer</button>
    </div>
  </div>
  <div style="display: flex; flex-direction: column; gap: 12px; width: 208px; padding-top: 236px;">
    <div style="border-radius: 6px; background: #ffffff; box-shadow: 0 8px 24px rgba(4,29,48,.2); padding: 6px 0;" data-zone="E1-options-theme">
      <div class="opt"><span class="dot" style="background: #041d30; box-shadow: inset 0 0 0 5px #f0801c;"></span>Classique</div>
      <div class="opt opt-on"><span class="dot" style="background: #120a1c; box-shadow: inset 0 0 0 5px #ff8c2e;"></span>Halloween</div>
    </div>
    <p style="margin: 0; font-size: 13px; line-height: 1.45; color: #072b45;">Liste ouverte. Le champ n'apparaît que pour un loto. Classique par défaut (RG-25).</p>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":760,"height":560}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
