<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chauve-souris</title>
<style>
body{margin:0}
.bt svg{display:block;width:100%;height:100%;overflow:visible}
.bt .wl{transform-origin:56px 27px;animation:bt-flap-l .22s ease-in-out infinite alternate}
.bt .wr{transform-origin:64px 27px;animation:bt-flap-r .22s ease-in-out infinite alternate}
@keyframes bt-flap-l{from{transform:rotate(16deg) scaleY(1)}to{transform:rotate(-26deg) scaleY(.5)}}
@keyframes bt-flap-r{from{transform:rotate(-16deg) scaleY(1)}to{transform:rotate(26deg) scaleY(.5)}}
.bt .torso{animation:bt-bob .22s ease-in-out infinite alternate}
@keyframes bt-bob{from{transform:translateY(-1.5px)}to{transform:translateY(1.5px)}}
.bt .hang{transform-origin:30px 4px;animation:bt-sway 4.8s ease-in-out infinite}
@keyframes bt-sway{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
.bt .wrap{transform-box:fill-box;transform-origin:50% 30%;animation:bt-breathe 3.2s ease-in-out infinite}
@keyframes bt-breathe{50%{transform:scale(1.05,.97)}}
.bt .zz text{transform-box:fill-box;opacity:0;animation:bt-z 4.2s ease-out infinite}
.bt .zz text:nth-child(2){animation-delay:1.4s}
.bt .zz text:nth-child(3){animation-delay:2.8s}
@keyframes bt-z{0%{opacity:0;transform:translate(0,0) scale(.6)}20%{opacity:1}100%{opacity:0;transform:translate(14px,-30px) scale(1.2)}}
</style>
</head>
<body>
<div class="bt" style="position: relative; width: {{w}}px; height: {{h}}px;">
  <sc-if value="{{flying}}" hint-placeholder-val="{{ true }}">
    <svg viewBox="0 0 120 60" aria-hidden="true">
      <g class="torso">
        <path class="wl" d="M56 24 C46 10 30 8 14 14 C20 18 22 22 20 28 C26 25 30 27 32 32 C36 28 42 28 46 33 C48 28 52 27 56 30 Z" fill="#140a1e" stroke="#4b2d63" stroke-width=".8"></path>
        <path class="wr" d="M64 24 C74 10 90 8 106 14 C100 18 98 22 100 28 C94 25 90 27 88 32 C84 28 78 28 74 33 C72 28 68 27 64 30 Z" fill="#140a1e" stroke="#4b2d63" stroke-width=".8"></path>
        <ellipse cx="60" cy="31" rx="7" ry="10" fill="#1d1029"></ellipse>
        <circle cx="60" cy="20" r="6" fill="#1d1029"></circle>
        <path d="M55 17 L53.5 8 L58.5 14 Z" fill="#1d1029"></path>
        <path d="M65 17 L66.5 8 L61.5 14 Z" fill="#1d1029"></path>
        <circle cx="57.6" cy="20" r="1.3" fill="#ffb347"></circle>
        <circle cx="62.4" cy="20" r="1.3" fill="#ffb347"></circle>
        <path d="M58.6 23.4 L59.2 25 L59.8 23.6 M60.2 23.6 L60.8 25 L61.4 23.4" stroke="#f4e8cf" stroke-width=".6" fill="none"></path>
      </g>
    </svg>
  </sc-if>
  <sc-if value="{{sleeping}}" hint-placeholder-val="{{ false }}">
    <svg viewBox="0 0 60 90" aria-hidden="true">
      <path d="M0 4 L60 4" stroke="#3a2950" stroke-width="3" stroke-linecap="round"></path>
      <g class="hang">
        <path d="M26 4 L27 12 M34 4 L33 12" stroke="#1d1029" stroke-width="2" stroke-linecap="round"></path>
        <path class="wrap" d="M30 10 C44 12 46 34 42 50 C40 58 36 62 30 64 C24 62 20 58 18 50 C14 34 16 12 30 10 Z" fill="#140a1e" stroke="#4b2d63" stroke-width="1"></path>
        <path d="M30 14 L30 58" stroke="#2a1c3a" stroke-width="1.2"></path>
        <circle cx="30" cy="68" r="7" fill="#1d1029"></circle>
        <path d="M25 72 L23 81 L28 75 Z" fill="#1d1029"></path>
        <path d="M35 72 L37 81 L32 75 Z" fill="#1d1029"></path>
        <path d="M26 66.5 Q27.5 65 29 66.5 M31 66.5 Q32.5 65 34 66.5" stroke="#ffb347" stroke-width="1" fill="none" stroke-linecap="round"></path>
      </g>
      <g class="zz" font-family="Fraunces, Georgia, serif" font-style="italic" font-weight="700" fill="#b8a5cf">
        <text x="42" y="70" font-size="9">z</text>
        <text x="42" y="70" font-size="11">z</text>
        <text x="42" y="70" font-size="13">z</text>
      </g>
    </svg>
  </sc-if>
</div>
</body>
</html>
