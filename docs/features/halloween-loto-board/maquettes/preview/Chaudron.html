<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chaudron</title>
<style>
body{margin:0}
.cd svg{display:block;width:100%;height:100%;overflow:visible}
.cd .bub{transform-box:fill-box;transform-origin:center;opacity:0;animation:cd-bub 2.6s ease-in infinite}
.cd .b2{animation-delay:.7s}.cd .b3{animation-delay:1.3s}.cd .b4{animation-delay:1.9s}.cd .b5{animation-delay:.35s}
@keyframes cd-bub{0%{opacity:0;transform:translateY(6px) scale(.4)}15%{opacity:1}80%{opacity:1;transform:translateY(-34px) scale(1)}100%{opacity:0;transform:translateY(-40px) scale(1.5)}}
.cd .surface{transform-box:fill-box;transform-origin:center;animation:cd-boil 1.4s ease-in-out infinite alternate}
@keyframes cd-boil{from{transform:scaleY(1)}to{transform:scaleY(1.35)}}
.cd .steam{transform-box:fill-box;transform-origin:50% 100%;opacity:0;animation:cd-steam 5s ease-out infinite}
.cd .s2{animation-delay:1.7s}.cd .s3{animation-delay:3.3s}
@keyframes cd-steam{0%{opacity:0;transform:translateY(0) scale(.7)}25%{opacity:.5}100%{opacity:0;transform:translateY(-46px) scale(1.4) skewX(12deg)}}
.cd .flames{transform-box:fill-box;transform-origin:50% 100%;animation:cd-fire .9s ease-in-out infinite alternate}
@keyframes cd-fire{from{transform:scale(1,1)}to{transform:scale(1.06,.82)}}
.cd .pot{transform-origin:80px 120px;animation:cd-rock 3.6s ease-in-out infinite}
@keyframes cd-rock{0%,100%{transform:rotate(-1deg)}50%{transform:rotate(1deg)}}
</style>
</head>
<body>
<div class="cd" style="position: relative; width: {{w}}px; height: {{h}}px;">
  <svg viewBox="0 0 160 152" aria-hidden="true">
    <defs>
      <radialGradient id="cdBrew" cx="50%" cy="40%" r="60%"><stop offset="0" stop-color="#d9f7a6"></stop><stop offset=".6" stop-color="#9bd85a"></stop><stop offset="1" stop-color="#5f9a2a"></stop></radialGradient>
      <linearGradient id="cdIron" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#1a1220"></stop><stop offset=".35" stop-color="#2e2338"></stop><stop offset="1" stop-color="#0e0912"></stop></linearGradient>
    </defs>
    <g class="steam s1"><path d="M66 46 C60 36 70 30 64 20" stroke="#cdeea0" stroke-width="5" stroke-linecap="round" fill="none" opacity=".6"></path></g>
    <g class="steam s2"><path d="M86 44 C80 34 92 28 86 16" stroke="#cdeea0" stroke-width="6" stroke-linecap="round" fill="none" opacity=".55"></path></g>
    <g class="steam s3"><path d="M104 48 C98 40 108 34 104 26" stroke="#cdeea0" stroke-width="4" stroke-linecap="round" fill="none" opacity=".5"></path></g>
    <g class="flames">
      <path d="M52 150 C48 140 56 134 54 124 C62 132 64 140 62 150 Z" fill="#ff8c2e"></path>
      <path d="M72 150 C66 136 78 128 76 116 C88 128 90 140 86 150 Z" fill="#ffb347"></path>
      <path d="M96 150 C92 140 100 132 100 122 C108 132 110 142 106 150 Z" fill="#ff8c2e"></path>
      <path d="M78 150 C76 142 80 138 80 132 C85 138 86 144 84 150 Z" fill="#fff1b8"></path>
    </g>
    <g class="pot">
      <path d="M38 132 L32 146 M122 132 L128 146" stroke="#140c18" stroke-width="5" stroke-linecap="round"></path>
      <path d="M22 62 C16 104 40 134 80 134 C120 134 144 104 138 62 Z" fill="url(#cdIron)"></path>
      <path d="M36 74 C36 96 46 112 60 120" stroke="#4a3a58" stroke-width="3" fill="none" stroke-linecap="round" opacity=".7"></path>
      <ellipse cx="80" cy="62" rx="62" ry="13" fill="#2a1c3a"></ellipse>
      <ellipse class="surface" cx="80" cy="62" rx="53" ry="8" fill="url(#cdBrew)"></ellipse>
      <circle class="bub b1" cx="62" cy="60" r="5" fill="#c8f08a"></circle>
      <circle class="bub b2" cx="88" cy="62" r="6.5" fill="#b8e878"></circle>
      <circle class="bub b3" cx="104" cy="60" r="4" fill="#d9f7a6"></circle>
      <circle class="bub b4" cx="74" cy="63" r="3.5" fill="#c8f08a"></circle>
      <circle class="bub b5" cx="96" cy="59" r="3" fill="#e6fbc4"></circle>
    </g>
  </svg>
</div>
</body>
</html>
