<!doctype html>
<html lang="fr">
<head>

<title>E5 · Fiche livre mobile — bouton Coup de cœur</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Libre+Franklin:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400;1,6..72,500&display=swap">

<body>
<div style="width: 390px; height: 950px; overflow: hidden; background: #f7fbfe; font-family: 'Libre Franklin', system-ui, sans-serif; color: #072b45;">
  <header style="display: flex; align-items: center; justify-content: space-between; padding: 14px 16px; border-bottom: 1px solid #d9e9f4;">
    <span style="font-family: 'Newsreader', Georgia, serif; font-size: 17px;">Vole Papillon d'Amour</span>
    <button type="button" aria-label="Ouvrir le menu" style="width: 44px; height: 44px; border: 1px solid #d9e9f4; border-radius: 999px; background: #ffffff;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#072b45" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"></path></svg></button>
  </header>
  <div style="padding: 20px 16px; display: flex; flex-direction: column;">
    <div style="align-self: center; width: 200px; height: 296px; border: 1px solid #d9e9f4; background-image: repeating-linear-gradient(135deg, #dceffa 0 8px, #f2fafd 8px 16px);"></div>
    <span style="margin-top: 20px; font-family: 'Newsreader', Georgia, serif; font-size: 32px; font-weight: 500; line-height: 1.08;">Hypérion</span>
    <span style="margin-top: 6px; font-size: 16px; color: #33536e;">Dan Simmons</span>
    <span style="margin-top: 4px; font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 11.5px; color: #6d8ba2;">Pocket · 1995 · Poche</span>
    <div style="display: flex; align-items: center; gap: 10px; margin-top: 18px; padding: 14px 16px; border: 1px solid #d9e9f4; background: #ffffff;"><span style="width: 9px; height: 9px; border-radius: 999px; background: #18703a;"></span><span style="font-size: 17px; font-weight: 600; color: #18703a;">2 exemplaires disponibles</span></div>
    <div data-zone="E5-actions" style="display: flex; flex-direction: column; gap: 10px; margin-top: 18px;">
      <button type="button" style="min-height: 50px; border: 0; border-radius: 999px; background: #072b45; color: #ffffff; font-size: 15px; font-weight: 600;">Ajouter à Ma sélection</button>
      <button data-zone="E5-bouton-coup-de-coeur" type="button" aria-pressed="true" style="display: flex; align-items: center; justify-content: center; gap: 9px; min-height: 50px; border: 1px solid #c8364e; border-radius: 999px; background: #c8364e; color: #ffffff; font-size: 15px; font-weight: 600;"><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20.5s-7.6-4.7-7.6-10.3A4.3 4.3 0 0 1 12 7.4a4.3 4.3 0 0 1 7.6 2.8c0 5.6-7.6 10.3-7.6 10.3z" fill="#ffffff"></path></svg>Dans vos coups de cœur</button>
      <button type="button" style="min-height: 50px; border: 1px solid #9dc2da; border-radius: 999px; background: #ffffff; color: #0c6ea6; font-size: 15px; font-weight: 600;">Suivre ce livre</button>
    </div>
    <p data-zone="E5-confirmation" role="status" style="margin: 14px 0 0; font-size: 13.5px; color: #33536e;">Ajouté à vos coups de cœur. <a href="Main.html">Voir mes suggestions</a></p>
  </div>
