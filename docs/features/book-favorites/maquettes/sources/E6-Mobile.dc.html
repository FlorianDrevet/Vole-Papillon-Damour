<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>E6 · Mes achats mobile — J'ai aimé</title>
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Libre+Franklin:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400;1,6..72,500&display=swap">
  <style>
    body { margin: 0; background: #f7fbfe; -webkit-font-smoothing: antialiased; }
    a { color: #0c6ea6; text-decoration: none; }
    button { font-family: inherit; cursor: pointer; }
  </style>
</helmet>
<div style="width: 390px; height: 1100px; overflow: hidden; background: #f7fbfe; font-family: 'Libre Franklin', system-ui, sans-serif; color: #072b45;">
  <header style="display: flex; align-items: center; justify-content: space-between; padding: 14px 16px; border-bottom: 1px solid #d9e9f4;">
    <span style="font-family: 'Newsreader', Georgia, serif; font-size: 17px;">Vole Papillon d'Amour</span>
    <button type="button" aria-label="Ouvrir le menu" style="width: 44px; height: 44px; border: 1px solid #d9e9f4; border-radius: 999px; background: #ffffff;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#072b45" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"></path></svg></button>
  </header>
  <div style="padding: 24px 16px 0;">
    <h1 style="margin: 0; font-family: 'Newsreader', Georgia, serif; font-size: 30px; font-weight: 500;">Mes achats</h1>
    <p data-zone="E6-explication" style="margin: 8px 0 0; font-size: 14px; line-height: 1.5; color: #33536e;">Vous avez aimé un de ces livres&nbsp;? Dites-le d'un clic&nbsp;: il rejoint vos coups de cœur.</p>
    <h2 style="margin: 22px 0 0; font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 10.5px; font-weight: 500; letter-spacing: .14em; text-transform: uppercase; color: #6d8ba2;">Bourse du 8 novembre 2026</h2>
    <ul style="list-style: none; margin: 10px 0 0; padding: 0; border-top: 1px solid #d9e9f4;">
      <sc-for list="{{lines}}" as="l" hint-placeholder-count="4">
        <li data-zone="E6-ligne-achat" style="display: flex; gap: 12px; align-items: center; padding: 12px 0; border-bottom: 1px solid #d9e9f4;">
          <div style="flex: none; width: 44px; height: 64px; border: 1px solid #d9e9f4; background-image: repeating-linear-gradient(135deg, #dceffa 0 8px, #f2fafd 8px 16px);"></div>
          <div style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 2px;">
            <span style="font-family: 'Newsreader', Georgia, serif; font-size: 16.5px; font-weight: 500; line-height: 1.2;">{{l.title}}</span>
            <span style="font-size: 12.5px; color: #4e6c84;">{{l.author}}</span>
          </div>
          <button data-zone="E6-bouton-jai-aime" type="button" aria-pressed="{{l.pressed}}" aria-label="J'ai aimé {{l.title}}" style="{{l.style}}"><svg width="19" height="19" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20.5s-7.6-4.7-7.6-10.3A4.3 4.3 0 0 1 12 7.4a4.3 4.3 0 0 1 7.6 2.8c0 5.6-7.6 10.3-7.6 10.3z" fill="{{l.fill}}" stroke="{{l.stroke}}" stroke-width="1.8"></path></svg></button>
        </li>
      </sc-for>
    </ul>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1100}}'>
class Component extends DCLogic {
  renderVals() {
    const base = 'flex: none; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border: 1px solid #c8364e; border-radius: 999px; ';
    const on = { pressed: 'true', style: base + 'background: #c8364e;', fill: '#ffffff', stroke: '#ffffff' };
    const off = { pressed: 'false', style: base + 'background: #ffffff;', fill: 'none', stroke: '#c8364e' };
    return {
      lines: [
        { title: "Les hommes qui n'aimaient pas les femmes", author: 'Stieg Larsson', ...on },
        { title: 'Dune', author: 'Frank Herbert', ...on },
        { title: 'Guide du Routard Bretagne', author: 'Collectif', ...off },
        { title: 'Le Petit Prince', author: 'Antoine de Saint-Exupéry', ...off }
      ]
    };
  }
}
</script>
</body>
</html>
