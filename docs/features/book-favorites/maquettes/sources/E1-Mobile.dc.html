<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>E1 · Accueil mobile — Pour vous en premier</title>
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Libre+Franklin:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400;1,6..72,500&display=swap">
  <style>
    body { margin: 0; background: #f7fbfe; -webkit-font-smoothing: antialiased; }
    a { color: #0c6ea6; text-decoration: none; }
    button { font-family: inherit; cursor: pointer; }
  </style>
</helmet>
<div style="width: 390px; height: 1250px; overflow: hidden; background: #f7fbfe; font-family: 'Libre Franklin', system-ui, sans-serif; color: #072b45;">
  <header style="display: flex; align-items: center; justify-content: space-between; padding: 14px 16px; border-bottom: 1px solid #d9e9f4;">
    <div style="display: flex; align-items: center; gap: 10px;">
      <div style="width: 36px; height: 36px; border-radius: 999px; display: flex; align-items: center; justify-content: center; background-image: linear-gradient(205deg, #7fd8f5 0%, #1497d6 26%, #0c6ea6 52%, #062a44 100%);"><span style="font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 10px; font-weight: 600; color: #ffffff;">VPD</span></div>
      <span style="font-family: 'Newsreader', Georgia, serif; font-size: 17px;">Vole Papillon d'Amour</span>
    </div>
    <button type="button" aria-label="Ouvrir le menu" style="width: 44px; height: 44px; border: 1px solid #d9e9f4; border-radius: 999px; background: #ffffff;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#072b45" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"></path></svg></button>
  </header>
  <section style="padding: 28px 16px 26px; background: #072b45;">
    <h1 style="margin: 0; font-family: 'Newsreader', Georgia, serif; font-size: 31px; font-weight: 500; line-height: 1.08; color: #ffffff;">Est-ce que ce livre sera <em style="color: #f9a93c;">à la bourse&nbsp;?</em></h1>
    <label for="m-search" style="position: absolute; width: 1px; height: 1px; overflow: hidden;">Titre, auteur ou ISBN</label>
    <input id="m-search" type="search" placeholder="Titre, auteur ou ISBN" style="box-sizing: border-box; width: 100%; margin-top: 18px; min-height: 50px; padding: 0 18px; border: 1px solid #33536e; border-radius: 999px; background: #ffffff; font-family: inherit; font-size: 16px;">
  </section>

  <section data-zone="E1-section-pour-vous" aria-labelledby="m-for-you" style="padding: 30px 0 30px 16px;">
    <div style="display: flex; flex-direction: column; gap: 10px; padding-right: 16px;">
      <span style="width: 48px; height: 3px; border-radius: 999px; background: linear-gradient(90deg, #1497d6, #7fd8f5 50%, #f0801c);"></span>
      <span style="font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 10.5px; font-weight: 500; letter-spacing: .16em; text-transform: uppercase; color: #dc6412;">Pour vous, Camille</span>
      <h2 id="m-for-you" style="margin: 0; font-family: 'Newsreader', Georgia, serif; font-size: 26px; font-weight: 500; line-height: 1.12;">D'après vos coups de cœur.</h2>
    </div>
    <div data-zone="E1-defilement" style="display: flex; gap: 12px; margin-top: 18px; overflow-x: auto; padding-right: 16px;">
      <sc-for list="{{cards}}" as="s" hint-placeholder-count="3">
        <a data-zone="E1-carte" href="E5-Mobile.dc.html" style="flex: none; width: 156px; display: flex; flex-direction: column; border: 1px solid #d9e9f4; background: #ffffff; color: #072b45;">
          <div style="height: 200px; background-image: repeating-linear-gradient(135deg, #dceffa 0 8px, #f2fafd 8px 16px);"></div>
          <div style="display: flex; flex-direction: column; gap: 5px; padding: 10px 11px 12px;">
            <span data-zone="E1-coeurs" role="img" aria-label="{{s.heartsLabel}}" style="display: flex; gap: 2px;"><sc-for list="{{s.hearts}}" as="h" hint-placeholder-count="5"><svg width="14" height="14" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20.5s-7.6-4.7-7.6-10.3A4.3 4.3 0 0 1 12 7.4a4.3 4.3 0 0 1 7.6 2.8c0 5.6-7.6 10.3-7.6 10.3z" fill="{{h.fill}}" stroke="{{h.stroke}}" stroke-width="1.6"></path></svg></sc-for></span>
            <span style="font-family: 'Newsreader', Georgia, serif; font-size: 16px; font-weight: 500; line-height: 1.15;">{{s.title}}</span>
            <span style="font-size: 12px; color: #4e6c84;">{{s.author}}</span>
            <span data-zone="E1-raison" style="font-size: 11.5px; line-height: 1.4; color: #33536e;">{{s.reason}}</span>
          </div>
        </a>
      </sc-for>
    </div>
    <a data-zone="E1-lien-toutes" href="Main.dc.html" style="display: inline-flex; align-items: center; min-height: 44px; margin-top: 8px; font-size: 14.5px; font-weight: 500;">Voir toutes mes suggestions →</a>
  </section>

  <section style="padding: 28px 16px; background: #ffffff; border-top: 1px solid #e2eef7;">
    <span style="font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 10.5px; letter-spacing: .14em; text-transform: uppercase; color: #6d8ba2;">Sections existantes, décalées</span>
    <div style="height: 140px; margin-top: 14px; border: 1px solid #d9e9f4; background-image: repeating-linear-gradient(135deg, #dceffa 0 8px, #f2fafd 8px 16px);"></div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1250}}'>
class Component extends DCLogic {
  renderVals() {
    const hearts = (n) => [1,2,3,4,5].map((i) => i <= n ? { fill: '#c8364e', stroke: '#c8364e' } : { fill: 'none', stroke: '#c9d6e1' });
    const cards = [
      { title: "La fille qui rêvait d'un bidon d'essence…", author: 'Stieg Larsson', n: 5, reason: "La suite de Les hommes qui n'aimaient pas les femmes" },
      { title: 'Hypérion', author: 'Dan Simmons', n: 5, reason: 'Parce que vous avez aimé Dune' },
      { title: 'La Horde du Contrevent', author: 'Alain Damasio', n: 4, reason: 'Parce que vous avez aimé Dune' },
      { title: 'Fondation', author: 'Isaac Asimov', n: 4, reason: 'Parce que vous avez aimé Dune' }
    ].map((c) => ({ ...c, hearts: hearts(c.n), heartsLabel: c.n + ' cœurs sur 5' }));
    return { cards };
  }
}
</script>
</body>
</html>
