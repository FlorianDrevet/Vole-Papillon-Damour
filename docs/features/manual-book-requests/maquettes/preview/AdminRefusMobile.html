<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Refus — feuille mobile</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Libre+Franklin:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&display=swap">
  <style>
    body { margin: 0; background: #f7fbfe; -webkit-font-smoothing: antialiased; }
    a { color: #0c6ea6; text-decoration: none; }
    a:hover { color: #072b45; }
  </style>
</head>
<body>
<div style="position: relative; width: 390px; height: 900px; overflow: hidden; background: #f7fbfe; font-family: 'Libre Franklin', system-ui, sans-serif; color: #072b45;">
  <div style="padding: 26px 16px;">
    <h1 style="margin: 0; font-family: 'Newsreader', Georgia, serif; font-size: 32px; font-weight: 500; color: #072b45;">Demandes manuelles.</h1>
  </div>
  <div style="position: absolute; inset: 0; background: rgba(4, 29, 48, .46);"></div>

  <section role="dialog" aria-modal="true" aria-labelledby="refuse-m-title" style="position: absolute; left: 0; right: 0; bottom: 0; box-sizing: border-box; padding: 10px 18px 24px; border-radius: 14px 14px 0 0; background: #ffffff; box-shadow: 0 -18px 40px rgba(4, 29, 48, .24); display: flex; flex-direction: column; gap: 14px;">
    <span style="align-self: center; width: 44px; height: 5px; border-radius: 999px; background: #d9e9f4;"></span>
    <span style="font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 10px; letter-spacing: .18em; text-transform: uppercase; color: #dc6412;">Refus</span>
    <h2 id="refuse-m-title" style="margin: -6px 0 0; font-family: 'Newsreader', Georgia, serif; font-size: 23px; font-weight: 500; line-height: 1.15;">Jeanne MARTIN ne prend pas Le Petit Prince</h2>
    <div style="display: flex; gap: 10px; align-items: flex-start; padding: 12px; border-radius: 4px; background: #fff6ec; font-size: 14px; line-height: 1.45;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#dc6412" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; margin-top: 2px;"><path d="M4 6.5h16v11H4z"></path><path d="m4.5 7 7.5 6 7.5-6"></path></svg><span>Le livre rejoint le stock. <strong>3 membres</strong> seront prévenus <strong>dès maintenant</strong>.</span></div>
    <div style="display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 12px; border: 1px solid #d9e9f4; border-radius: 4px;">
      <span style="font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: #6d8ba2;">Mise à disposition</span>
      <span style="padding: 4px 10px; border-radius: 999px; background: #072b45; font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 10.5px; font-weight: 600; text-transform: uppercase; color: #ffffff;">Disponible</span>
    </div>
    <fieldset style="margin: 0; padding: 0; border: 0; display: flex; flex-direction: column; gap: 8px;">
      <legend style="margin-bottom: 8px; font-size: 14.5px; font-weight: 600;">Et ensuite ?</legend>
      <label style="display: flex; align-items: center; gap: 10px; min-height: 48px; padding: 0 12px; border: 1.5px solid #0c6ea6; border-radius: 4px; background: #e9f4fb; font-size: 14.5px; font-weight: 600;"><input type="radio" name="n" checked style="margin: 0; width: 18px; height: 18px; accent-color: #0c6ea6;">Clore la demande</label>
      <label style="display: flex; align-items: center; gap: 10px; min-height: 48px; padding: 0 12px; border: 1px solid #d9e9f4; border-radius: 4px; font-size: 14.5px; color: #33536e;"><input type="radio" name="n" style="margin: 0; width: 18px; height: 18px; accent-color: #0c6ea6;">Continuer à chercher pour elle</label>
    </fieldset>
    <div style="display: flex; gap: 10px; margin-top: 4px;">
      <button type="button" style="flex: 1 1 0; margin: 0; font-family: inherit; cursor: pointer; min-height: 48px; border: 1.5px solid #9dc2da; border-radius: 999px; background: #ffffff; font-size: 15px; font-weight: 600; color: #072b45;">Annuler</button>
      <button type="button" style="flex: 1.4 1 0; margin: 0; font-family: inherit; cursor: pointer; min-height: 48px; border: 0; border-radius: 999px; background: #f0801c; font-size: 15px; font-weight: 600; color: #ffffff;">Confirmer le refus</button>
    </div>
  </section>
</div>
</body>
</html>
