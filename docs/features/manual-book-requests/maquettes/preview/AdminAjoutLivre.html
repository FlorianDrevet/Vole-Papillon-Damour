<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ajouter un livre à un demandeur</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Libre+Franklin:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&display=swap">
  <style>
    body { margin: 0; background: #f7fbfe; -webkit-font-smoothing: antialiased; }
    a { color: #0c6ea6; text-decoration: none; }
    a:hover { color: #072b45; }
  </style>
</head>
<body>
<div style="position: relative; width: 1440px; height: 1260px; overflow: hidden; background: #f7fbfe; font-family: 'Libre Franklin', system-ui, sans-serif; color: #072b45;">

  <div style="display: flex; align-items: center; justify-content: space-between; padding: 20px 32px; border-bottom: 1px solid #d9e9f4;">
    <div style="display: flex; align-items: center; gap: 12px;">
      <div style="width: 42px; height: 42px; border-radius: 999px; display: flex; align-items: center; justify-content: center; background-image: linear-gradient(205deg, #7fd8f5 0%, #1497d6 26%, #0c6ea6 52%, #062a44 100%);">
        <span style="font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 11px; font-weight: 600; letter-spacing: .06em; color: #ffffff;">VPD</span>
      </div>
      <span style="font-family: 'Newsreader', Georgia, serif; font-size: 18px; color: #072b45;">Vole Papillon d'Amour</span>
      <span style="margin-left: 8px; padding: 6px 12px; border-radius: 999px; background: #072b45; font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 9.5px; font-weight: 600; letter-spacing: .18em; text-transform: uppercase; color: #7fd8f5;">Administration</span>
    </div>
  </div>
  <div style="display: flex; align-items: stretch;">
    <div style="flex: none; width: 244px; min-height: 1177px; background: #072b45;"></div>
    <main style="flex: 1 1 auto; padding: 40px 44px;">
      <span style="font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: .18em; text-transform: uppercase; color: #dc6412;">Demandeur</span>
      <h1 style="margin: 10px 0 0; font-family: 'Newsreader', Georgia, serif; font-size: 40px; font-weight: 500; color: #072b45;">Jeanne MARTIN</h1>
    </main>
  </div>
  <div style="position: absolute; inset: 0; background: rgba(4, 29, 48, .46);"></div>

  <section role="dialog" aria-modal="true" aria-labelledby="add-title" data-zone="E4-dialogue-ajout" style="position: absolute; left: 410px; top: 70px; width: 680px; box-sizing: border-box; padding: 30px 32px 28px; border-radius: 6px; background: #ffffff; box-shadow: 0 24px 60px rgba(4, 29, 48, .28); display: flex; flex-direction: column; gap: 20px;">
    <span style="font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 10.5px; font-weight: 500; letter-spacing: .18em; text-transform: uppercase; color: #dc6412;">Nouvelle demande</span>
    <h2 id="add-title" style="margin: -8px 0 0; font-family: 'Newsreader', Georgia, serif; font-size: 28px; font-weight: 500; line-height: 1.1; color: #072b45;">Ajouter un livre pour Jeanne MARTIN</h2>

    <div data-zone="E4-recherche-referentiel" style="display: flex; gap: 10px;">
      <label style="flex: 1 1 auto; display: flex; flex-direction: column; gap: 7px; font-size: 14px; font-weight: 600; color: #072b45;">Rechercher un livre
        <input type="search" value="petit prince saint-exupéry" placeholder="Titre, auteur ou ISBN" style="box-sizing: border-box; width: 100%; height: 46px; padding: 0 14px; border: 1px solid #0c6ea6; border-radius: 4px; font-family: 'Libre Franklin', system-ui, sans-serif; font-size: 15px; color: #072b45;">
      </label>
      <button type="button" style="align-self: flex-end; margin: 0; font-family: inherit; cursor: pointer; min-height: 46px; padding: 0 20px; border: 0; border-radius: 999px; background: #072b45; font-size: 14.5px; font-weight: 600; color: #ffffff;">Chercher</button>
    </div>

    <fieldset data-zone="E4-resultats" style="margin: 0; padding: 0; border: 0; display: flex; flex-direction: column; gap: 8px;">
      <legend style="margin-bottom: 8px; font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 10.5px; letter-spacing: .14em; text-transform: uppercase; color: #6d8ba2;">Tous les livres publiés · 3 résultats</legend>
      <label style="display: flex; align-items: center; gap: 14px; padding: 12px 14px; border: 1px solid #d9e9f4; border-radius: 4px;">
        <input type="radio" name="book" style="margin: 0; width: 18px; height: 18px; accent-color: #0c6ea6;">
        <span style="flex: 1 1 auto; display: flex; flex-direction: column; gap: 3px;"><span style="font-family: 'Newsreader', Georgia, serif; font-size: 17.5px; color: #072b45;">Le Petit Prince</span><span style="font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 11.5px; color: #6d8ba2;">Antoine de Saint-Exupéry · Gallimard · 1999</span></span>
      </label>
      <label style="display: flex; align-items: center; gap: 14px; padding: 12px 14px; border: 1.5px solid #0c6ea6; border-radius: 4px; background: #e9f4fb;">
        <input type="radio" name="book" checked style="margin: 0; width: 18px; height: 18px; accent-color: #0c6ea6;">
        <span style="flex: 1 1 auto; display: flex; flex-direction: column; gap: 3px;"><span style="font-family: 'Newsreader', Georgia, serif; font-size: 17.5px; color: #072b45;">Le Petit Prince</span><span style="font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 11.5px; color: #6d8ba2;">Antoine de Saint-Exupéry · Folio · 2007</span></span>
      </label>
      <label style="display: flex; align-items: center; gap: 14px; padding: 12px 14px; border: 1px solid #d9e9f4; border-radius: 4px;">
        <input type="radio" name="book" style="margin: 0; width: 18px; height: 18px; accent-color: #0c6ea6;">
        <span style="flex: 1 1 auto; display: flex; flex-direction: column; gap: 3px;"><span style="font-family: 'Newsreader', Georgia, serif; font-size: 17.5px; color: #072b45;">Le Petit Prince — édition illustrée</span><span style="font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 11.5px; color: #6d8ba2;">Antoine de Saint-Exupéry · Gallimard Jeunesse · 2015</span></span>
      </label>
    </fieldset>

    <fieldset data-zone="E4-portee" style="margin: 0; padding: 0; border: 0; display: flex; flex-direction: column; gap: 8px;">
      <legend style="margin-bottom: 8px; font-size: 14px; font-weight: 600; color: #072b45;">Que cherche-t-elle ?</legend>
      <label style="display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 0 14px; border: 1.5px solid #0c6ea6; border-radius: 4px; background: #e9f4fb; font-size: 14.5px; color: #072b45;"><input type="radio" name="scope" checked style="margin: 0; width: 18px; height: 18px; accent-color: #0c6ea6;"><span><span style="font-weight: 600;">Toutes les éditions de cette œuvre</span> <span style="color: #6d8ba2;">· recommandé</span></span></label>
      <label style="display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 0 14px; border: 1px solid #d9e9f4; border-radius: 4px; font-size: 14.5px; color: #33536e;"><input type="radio" name="scope" style="margin: 0; width: 18px; height: 18px; accent-color: #0c6ea6;"><span>Uniquement cette édition <span style="font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 12.5px; color: #6d8ba2;">ISBN 978-2-07-061275-8</span></span></label>
    </fieldset>

    <div data-zone="E4-encart-deja-en-stock" style="display: flex; align-items: center; gap: 16px; padding: 16px 18px; border: 1px solid #f6c89a; border-radius: 4px; background: #fff6ec;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#dc6412" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none;"><path d="M4 7h16M7 7v12h10V7M9.5 7V4.5h5V7"></path></svg>
      <div style="flex: 1 1 auto; display: flex; flex-direction: column; gap: 3px;">
        <span style="font-size: 15px; font-weight: 600; color: #072b45;">Déjà à la bourse</span>
        <span style="font-size: 14px; color: #33536e;">2 exemplaires disponibles · 1 annoncé pour le 14 mars</span>
      </div>
      <button type="button" data-zone="E4-bouton-prelever" style="flex: none; margin: 0; font-family: inherit; cursor: pointer; min-height: 44px; padding: 0 18px; border: 0; border-radius: 999px; background: #f0801c; font-size: 14px; font-weight: 600; color: #ffffff;">Prélever un exemplaire</button>
    </div>

    <div style="display: flex; justify-content: flex-end; gap: 12px; margin-top: 4px;">
      <button type="button" style="margin: 0; font-family: inherit; cursor: pointer; min-height: 48px; padding: 0 22px; border: 1.5px solid #9dc2da; border-radius: 999px; background: #ffffff; font-size: 15px; font-weight: 600; color: #072b45;">Annuler</button>
      <button type="button" data-zone="E4-bouton-ajouter" style="margin: 0; font-family: inherit; cursor: pointer; min-height: 48px; padding: 0 24px; border: 0; border-radius: 999px; background: #072b45; font-size: 15px; font-weight: 600; color: #ffffff;">Ajouter la demande</button>
    </div>
  </section>
</div>
</body>
</html>
