<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ajouter un livre — mobile</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Libre+Franklin:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&display=swap">
  <style>
    body { margin: 0; background: #f7fbfe; -webkit-font-smoothing: antialiased; }
    a { color: #0c6ea6; text-decoration: none; }
    a:hover { color: #072b45; }
  </style>
</head>
<body>
<div style="position: relative; width: 390px; height: 1300px; overflow: hidden; background: #ffffff; font-family: 'Libre Franklin', system-ui, sans-serif; color: #072b45; display: flex; flex-direction: column;">

  <div style="flex: none; display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-bottom: 1px solid #d9e9f4;">
    <a href="AdminDemandeurMobile.html" aria-label="Fermer" style="display: inline-flex; align-items: center; justify-content: center; width: 44px; height: 44px; border-radius: 999px; background: #e9f4fb;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#072b45" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg></a>
    <div style="display: flex; flex-direction: column; gap: 2px;">
      <span style="font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 10px; letter-spacing: .18em; text-transform: uppercase; color: #dc6412;">Nouvelle demande</span>
      <span style="font-family: 'Newsreader', Georgia, serif; font-size: 19px; color: #072b45;">Pour Jeanne MARTIN</span>
    </div>
  </div>

  <div style="flex: 1 1 auto; display: flex; flex-direction: column; gap: 18px; padding: 18px 16px;">
    <label style="display: flex; flex-direction: column; gap: 7px; font-size: 14px; font-weight: 600;">Rechercher un livre
      <span style="display: flex; gap: 8px;">
        <input type="search" value="petit prince" placeholder="Titre, auteur ou ISBN" style="flex: 1 1 auto; min-width: 0; box-sizing: border-box; height: 46px; padding: 0 12px; border: 1px solid #0c6ea6; border-radius: 4px; font-family: inherit; font-size: 15px; color: #072b45;">
        <button type="button" style="flex: none; margin: 0; font-family: inherit; cursor: pointer; min-height: 46px; padding: 0 16px; border: 0; border-radius: 999px; background: #072b45; font-size: 14px; font-weight: 600; color: #ffffff;">Chercher</button>
      </span>
    </label>

    <fieldset style="margin: 0; padding: 0; border: 0; display: flex; flex-direction: column; gap: 8px;">
      <legend style="margin-bottom: 8px; font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: #6d8ba2;">3 résultats</legend>
      <label style="display: flex; align-items: center; gap: 12px; padding: 12px; border: 1px solid #d9e9f4; border-radius: 4px;"><input type="radio" name="b" style="margin: 0; width: 18px; height: 18px; accent-color: #0c6ea6;"><span style="display: flex; flex-direction: column; gap: 2px;"><span style="font-family: 'Newsreader', Georgia, serif; font-size: 16.5px;">Le Petit Prince</span><span style="font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 11px; color: #6d8ba2;">Gallimard · 1999</span></span></label>
      <label style="display: flex; align-items: center; gap: 12px; padding: 12px; border: 1.5px solid #0c6ea6; border-radius: 4px; background: #e9f4fb;"><input type="radio" name="b" checked style="margin: 0; width: 18px; height: 18px; accent-color: #0c6ea6;"><span style="display: flex; flex-direction: column; gap: 2px;"><span style="font-family: 'Newsreader', Georgia, serif; font-size: 16.5px;">Le Petit Prince</span><span style="font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 11px; color: #6d8ba2;">Folio · 2007</span></span></label>
      <label style="display: flex; align-items: center; gap: 12px; padding: 12px; border: 1px solid #d9e9f4; border-radius: 4px;"><input type="radio" name="b" style="margin: 0; width: 18px; height: 18px; accent-color: #0c6ea6;"><span style="display: flex; flex-direction: column; gap: 2px;"><span style="font-family: 'Newsreader', Georgia, serif; font-size: 16.5px;">Le Petit Prince — illustré</span><span style="font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 11px; color: #6d8ba2;">Gallimard Jeunesse · 2015</span></span></label>
    </fieldset>

    <fieldset style="margin: 0; padding: 0; border: 0; display: flex; flex-direction: column; gap: 8px;">
      <legend style="margin-bottom: 8px; font-size: 14px; font-weight: 600;">Que cherche-t-elle ?</legend>
      <label style="display: flex; align-items: center; gap: 10px; min-height: 46px; padding: 0 12px; border: 1.5px solid #0c6ea6; border-radius: 4px; background: #e9f4fb; font-size: 14px;"><input type="radio" name="s" checked style="margin: 0; width: 18px; height: 18px; accent-color: #0c6ea6;"><span><strong>Toutes les éditions</strong> · recommandé</span></label>
      <label style="display: flex; align-items: center; gap: 10px; min-height: 46px; padding: 0 12px; border: 1px solid #d9e9f4; border-radius: 4px; font-size: 14px; color: #33536e;"><input type="radio" name="s" style="margin: 0; width: 18px; height: 18px; accent-color: #0c6ea6;">Uniquement cette édition</label>
    </fieldset>

    <div style="display: flex; flex-direction: column; gap: 10px; padding: 14px; border: 1px solid #f6c89a; border-radius: 4px; background: #fff6ec;">
      <span style="font-size: 14.5px; font-weight: 600;">Déjà à la bourse</span>
      <span style="font-size: 13.5px; color: #33536e;">2 disponibles · 1 annoncé pour le 14 mars</span>
      <button type="button" style="margin: 0; font-family: inherit; cursor: pointer; min-height: 44px; border: 0; border-radius: 999px; background: #f0801c; font-size: 14px; font-weight: 600; color: #ffffff;">Prélever un exemplaire</button>
    </div>
  </div>

  <div style="flex: none; display: flex; gap: 10px; padding: 14px 16px 22px; border-top: 1px solid #d9e9f4; box-shadow: 0 -18px 30px -26px rgba(7, 43, 69, .55);">
    <a href="AdminDemandeurMobile.html" style="flex: 1 1 0; display: inline-flex; align-items: center; justify-content: center; min-height: 48px; border: 1.5px solid #9dc2da; border-radius: 999px; font-size: 15px; font-weight: 600; color: #072b45;">Annuler</a>
    <button type="button" style="flex: 1.4 1 0; margin: 0; font-family: inherit; cursor: pointer; min-height: 48px; border: 0; border-radius: 999px; background: #072b45; font-size: 15px; font-weight: 600; color: #ffffff;">Ajouter la demande</button>
  </div>
</div>
</body>
</html>
