<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Recherche — rafraîchissement mobile</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&amp;family=Libre+Franklin:wght@400;500;600;700&amp;family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&amp;display=swap">
<style>
body{margin:0;background:#f7fbfe}
a{color:#0c6ea6}a:hover{color:#072b45}
.spin{animation:spin 1s linear infinite;transform-origin:center}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){.spin{animation:none}}
</style>
</helmet>
<div style="width: 390px; min-height: 1240px; box-sizing: border-box; padding: 20px 24px 40px; background: #f7fbfe; font-family: 'Libre Franklin', system-ui, sans-serif; color: #072b45; display: flex; flex-direction: column; gap: 18px;">
  <header style="display: flex; flex-direction: column; gap: 2px; padding-bottom: 14px; border-bottom: 1px solid #d9e9f4;"><span style="font-family: 'Newsreader', Georgia, serif; font-size: 18px;">Vole Papillon d'Amour</span><span style="font-family: 'IBM Plex Mono', monospace; font-size: 9px; letter-spacing: .2em; text-transform: uppercase; color: #4e6c84;">Bourse aux livres · catalogue</span></header>
  <form role="search" style="display: flex; gap: 8px;">
    <label style="flex: 1 1 auto; display: flex;"><span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0);">Rechercher un livre</span><input placeholder="Titre, auteur, ISBN…" style="flex: 1 1 auto; min-width: 0; height: 48px; padding: 0 16px; border: 1px solid #9dc2da; border-radius: 999px; background: #ffffff; font: 15px 'Libre Franklin', sans-serif; color: #072b45;"></label>
    <button type="submit" aria-label="Rechercher" style="flex: none; width: 48px; height: 48px; border: 0; border-radius: 999px; background: #072b45; color: #ffffff;"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"></circle><path d="M16 16l4 4"></path></svg></button>
  </form>
  <button type="button" style="display: flex; align-items: center; justify-content: space-between; height: 48px; padding: 0 16px; border: 1px solid #9dc2da; border-radius: 4px; background: #ffffff; font: 600 14.5px 'Libre Franklin', sans-serif; color: #072b45;">Filtres · Roman<span style="display: inline-flex; align-items: center; justify-content: center; min-width: 22px; height: 22px; border-radius: 999px; background: #072b45; font-size: 11px; color: #ffffff;">1</span></button>
  <div style="display: flex; justify-content: space-between; align-items: center; gap: 10px;">
    <div style="display: flex; flex-direction: column; gap: 4px;"><h1 style="margin: 0; font-family: 'Newsreader', Georgia, serif; font-size: 24px; font-weight: 500;">Tous les livres</h1><span style="font-size: 12.5px; color: #4e6c84;">Plus de 24 éditions</span></div>
    <span role="status" style="display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px; border: 1px solid #d9e9f4; border-radius: 999px; background: #ffffff; font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; color: #4e6c84;"><svg class="spin" aria-hidden="true" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#0c6ea6" stroke-width="2.2" stroke-linecap="round"><path d="M12 3a9 9 0 1 0 9 9"></path></svg>Page 2…</span>
  </div>
  <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; opacity: .45;">
    <article style="display: flex; flex-direction: column; gap: 6px;"><span aria-hidden="true" style="aspect-ratio: 2 / 3; border-radius: 3px; background: #c9dceb;"></span><strong style="font-size: 14px;">L’Étranger</strong><span style="font-size: 12px; color: #4e6c84;">Albert Camus</span></article>
    <article style="display: flex; flex-direction: column; gap: 6px;"><span aria-hidden="true" style="aspect-ratio: 2 / 3; border-radius: 3px; background: #c9dceb;"></span><strong style="font-size: 14px;">Les Misérables</strong><span style="font-size: 12px; color: #4e6c84;">Victor Hugo</span></article>
    <article style="display: flex; flex-direction: column; gap: 6px;"><span aria-hidden="true" style="aspect-ratio: 2 / 3; border-radius: 3px; background: #c9dceb;"></span><strong style="font-size: 14px;">Bel-Ami</strong><span style="font-size: 12px; color: #4e6c84;">Guy de Maupassant</span></article>
    <article style="display: flex; flex-direction: column; gap: 6px;"><span aria-hidden="true" style="aspect-ratio: 2 / 3; border-radius: 3px; background: #c9dceb;"></span><strong style="font-size: 14px;">La Peste</strong><span style="font-size: 12px; color: #4e6c84;">Albert Camus</span></article>
  </div>
  <nav aria-label="Pagination" style="display: flex; align-items: center; justify-content: center; gap: 12px;">
    <button type="button" aria-label="Page précédente" style="width: 44px; height: 44px; border: 1px solid #9dc2da; border-radius: 999px; background: #ffffff; color: #0c6ea6; font-size: 16px;">←</button>
    <span style="font-family: 'IBM Plex Mono', monospace; font-size: 12.5px; color: #4e6c84;">Page 1</span>
    <button type="button" aria-label="Page suivante" style="width: 44px; height: 44px; border: 1px solid #9dc2da; border-radius: 999px; background: #ffffff; color: #0c6ea6; font-size: 16px;">→</button>
  </nav>
  <span style="font-size: 12px; line-height: 1.45; color: #4e6c84;">Ici la page 2 n’était pas encore prête : la page 1 reste visible et estompée jusqu’à son arrivée.</span>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1240}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
