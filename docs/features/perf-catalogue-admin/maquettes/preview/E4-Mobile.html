<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Statistiques — chargement mobile</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&amp;family=Libre+Franklin:wght@400;500;600;700&amp;family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&amp;display=swap">
<style>
body{margin:0;background:#f7fbfe}
a{color:#0c6ea6}a:hover{color:#072b45}
.sk{background:linear-gradient(90deg,#e2eef7 0%,#f1f7fb 45%,#e2eef7 90%);background-size:200% 100%;animation:sk 1.4s ease-in-out infinite;border-radius:4px}
@keyframes sk{0%{background-position:100% 0}100%{background-position:-100% 0}}
@media (prefers-reduced-motion: reduce){.sk{animation:none;background:#e2eef7}}
</style>
</head>
<body>
<div style="width: 390px; min-height: 1160px; box-sizing: border-box; padding: 24px 24px 40px; background: #f7fbfe; font-family: 'Libre Franklin', system-ui, sans-serif; color: #072b45; display: flex; flex-direction: column; gap: 18px;">
  <div style="display: flex; flex-direction: column; gap: 10px;">
    <span style="width: 56px; height: 3px; border-radius: 999px; background: linear-gradient(90deg, #1497d6, #7fd8f5 50%, #f0801c);"></span>
    <span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; font-weight: 500; letter-spacing: .18em; text-transform: uppercase; color: #dc6412;">Pilotage</span>
    <h1 style="margin: 0; font-family: 'Newsreader', Georgia, serif; font-size: 32px; font-weight: 500; line-height: 1.05;">Statistiques.</h1>
  </div>
  <div role="tablist" aria-label="Statistiques" style="display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px;">
    <button role="tab" aria-selected="true" type="button" style="flex: none; height: 40px; padding: 0 14px; border: 1px solid #072b45; border-radius: 999px; background: #072b45; font: 600 13px 'Libre Franklin', sans-serif; color: #ffffff;">Statistiques par bourse</button>
    <button role="tab" aria-selected="false" type="button" style="flex: none; height: 40px; padding: 0 14px; border: 1px solid #d9e9f4; border-radius: 999px; background: #ffffff; font: 13px 'Libre Franklin', sans-serif; color: #4e6c84;">Évolution</button>
    <button role="tab" aria-selected="false" type="button" style="flex: none; height: 40px; padding: 0 14px; border: 1px solid #d9e9f4; border-radius: 999px; background: #ffffff; font: 13px 'Libre Franklin', sans-serif; color: #4e6c84;">Les livres</button>
  </div>
  <label style="display: flex; flex-direction: column; gap: 6px; font-size: 12px; font-weight: 600; color: #4e6c84;">Bourse
    <select style="height: 48px; padding: 0 14px; border: 1px solid #9dc2da; border-radius: 4px; background: #ffffff; font: 15px 'Libre Franklin', sans-serif; color: #072b45;"><option>Bourse de novembre 2026</option></select>
  </label>
  <div aria-busy="true" aria-hidden="true" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px;">
    <div style="display: flex; flex-direction: column; gap: 10px; padding: 16px; border: 1px solid #d9e9f4; border-radius: 4px; background: #ffffff;"><span class="sk" style="width: 56%; height: 28px;"></span><span class="sk" style="width: 80%; height: 10px;"></span></div>
    <div style="display: flex; flex-direction: column; gap: 10px; padding: 16px; border: 1px solid #d9e9f4; border-radius: 4px; background: #ffffff;"><span class="sk" style="width: 46%; height: 28px;"></span><span class="sk" style="width: 70%; height: 10px;"></span></div>
    <div style="display: flex; flex-direction: column; gap: 10px; padding: 16px; border: 1px solid #d9e9f4; border-radius: 4px; background: #ffffff;"><span class="sk" style="width: 50%; height: 28px;"></span><span class="sk" style="width: 76%; height: 10px;"></span></div>
    <div style="display: flex; flex-direction: column; gap: 10px; padding: 16px; border: 1px solid #d9e9f4; border-radius: 4px; background: #ffffff;"><span class="sk" style="width: 40%; height: 28px;"></span><span class="sk" style="width: 64%; height: 10px;"></span></div>
  </div>
  <section aria-hidden="true" style="display: flex; flex-direction: column; gap: 14px; padding: 18px; border: 1px solid #d9e9f4; border-radius: 4px; background: #ffffff;">
    <span class="sk" style="width: 52%; height: 15px;"></span>
    <div style="display: flex; align-items: flex-end; gap: 10px; height: 160px; border-bottom: 1px solid #d9e9f4;">
      <span class="sk" style="flex: 1 1 0; height: 45%;"></span><span class="sk" style="flex: 1 1 0; height: 70%;"></span><span class="sk" style="flex: 1 1 0; height: 55%;"></span><span class="sk" style="flex: 1 1 0; height: 85%;"></span><span class="sk" style="flex: 1 1 0; height: 38%;"></span>
    </div>
  </section>
  <section aria-hidden="true" style="display: flex; flex-direction: column; gap: 12px; padding: 18px; border: 1px solid #d9e9f4; border-radius: 4px; background: #ffffff;">
    <span class="sk" style="width: 48%; height: 15px;"></span><span class="sk" style="width: 100%; height: 34px;"></span><span class="sk" style="width: 100%; height: 34px;"></span><span class="sk" style="width: 100%; height: 34px;"></span>
  </section>
</div>
</body>
</html>
