<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>États de la page Événements</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@400;500;600;700;800&amp;family=Newsreader:ital,opsz,wght@0,6..72,400..600;1,6..72,400..600&amp;display=swap">
<style>
body{margin:0}
.st{font-family:"Libre Franklin",system-ui,sans-serif;color:#041d30}
.ph{width:390px;height:844px;flex-shrink:0;overflow:hidden;border-radius:30px;background:#f7fbfe;box-sizing:border-box;padding:24px 16px;display:flex;flex-direction:column;gap:18px}
.sk{background:#e2eef7;border-radius:12px;animation:pulse 2.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}
.row{display:grid;grid-template-columns:62px minmax(0,1fr);gap:14px;align-items:center}
</style>
</head>
<body>
<div class="st" style="width: 860px; height: 844px; display: flex; gap: 80px; background: #e9f0f5;">
  <section class="ph" role="status" aria-label="Chargement des rendez-vous" data-zone="E6-chargement">
    <span class="sk" style="width: 260px; height: 36px;"></span>
    <span class="sk" style="height: 380px; border-radius: 26px;"></span>
    <span class="sk" style="height: 150px; border-radius: 22px;"></span>
    <span class="sk" style="width: 140px; height: 28px;"></span>
    <div class="row"><span class="sk" style="height: 62px; border-radius: 14px;"></span><span class="sk" style="height: 40px;"></span></div>
    <div class="row"><span class="sk" style="height: 62px; border-radius: 14px;"></span><span class="sk" style="height: 40px;"></span></div>
  </section>
  <section class="ph" data-zone="E6-aucun-rendez-vous">
    <h1 style="margin: 0; font-family: Newsreader, Georgia, serif; font-weight: 500; font-size: 38px; line-height: 1.02; color: #072b45;">Nos prochains rendez-vous</h1>
    <div style="display: flex; flex-direction: column; gap: 14px; padding: 26px 22px; border-radius: 24px; background: #ffffff; box-shadow: inset 0 0 0 1px #e2eef7;">
      <svg viewBox="0 0 48 48" width="52" height="52" fill="none" stroke="#0c6ea6" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><rect x="7" y="10" width="34" height="31" rx="6"></rect><path d="M7 19h34M16 6v8M32 6v8"></path><path d="M19 30h10"></path></svg>
      <p style="margin: 0; font-family: Newsreader, Georgia, serif; font-size: 26px; line-height: 1.15; color: #072b45;">Pas de nouvelle date pour l'instant.</p>
      <p style="margin: 0; font-size: 16px; line-height: 1.55; color: #33536e;">Les prochains rendez-vous apparaîtront ici dès qu'ils seront fixés.</p>
      <a href="#" style="font-size: 15px; font-weight: 700; color: #0c6ea6; padding: 10px 0;">Voir les éditions passées</a>
    </div>
  </section>
</div>
</body>
</html>
