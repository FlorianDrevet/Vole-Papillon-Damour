<helmet>
<style>
body{margin:0}
.pa svg{display:block;width:100%;height:100%;overflow:visible}
.pa .float{transform-origin:80px 60px;animation:pa-float 4.2s ease-in-out infinite}
@keyframes pa-float{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-7px) rotate(3deg)}}
.pa .wings{transform-origin:80px 60px;animation:pa-flap 1.9s ease-in-out infinite}
@keyframes pa-flap{0%{transform:scaleX(1)}16%{transform:scaleX(.26)}32%{transform:scaleX(1)}48%{transform:scaleX(.3)}64%,100%{transform:scaleX(1)}}
.pa .ant{transform-origin:80px 40px;animation:pa-ant 2.6s ease-in-out infinite}
@keyframes pa-ant{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
.pa-pose .wings{animation:none;transform:scaleX(.92)}
.pa .va,.pa .vb,.pa .vc,.pa .vd{display:none}
.pa-a .va,.pa-b .vb,.pa-c .vc,.pa-d .vd{display:inline}
</style>
</helmet>

<script type="text/x-dc" data-dc-script data-props='{"size":{"editor":"int","default":220,"min":24,"max":400},"variant":{"editor":"enum","default":"a","options":["a","b","c","d"]},"mood":{"editor":"enum","default":"vol","options":["vol","pose"]},"$preview":{"width":220,"height":170}}'>
class Component extends DCLogic {
  renderVals() {
    var size = Number(this.props.size ?? 220);
    var v = this.props.variant ?? "a";
    return { cls: "pa pa-" + v + " pa-" + (this.props.mood ?? "vol"), w: size, h: Math.round(size * 124 / 160), ribbon: v === "c" };
  }
}
</script>
