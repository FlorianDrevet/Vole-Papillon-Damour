<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>E2-FormulaireSansIsbn</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Libre+Franklin:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&display=swap">
  <style>
    body { margin: 0; background: #f7fbfe; -webkit-font-smoothing: antialiased; }
    a { color: #0c6ea6; text-decoration: none; }
    a:hover { color: #072b45; }
  </style>
</head>
<body>
<div style="display: flex; flex-direction: column; width: 390px; height: 844px; overflow: hidden; background: #f7fbfe; font-family: 'Libre Franklin', system-ui, sans-serif; color: #072b45;">

  <div style="flex: none; display: flex; align-items: center; gap: 10px; height: 52px; padding: 0 20px; background: #1497d6; color: #ffffff;">
    <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" style="flex: none;">
      <path d="M5 3.5h10l4 4v13H5z"></path>
      <path d="M12 10.5v6M9 13.5h6"></path>
    </svg>
    <span style="font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 12px; font-weight: 600; letter-spacing: .16em; text-transform: uppercase;">Livre sans ISBN</span>
    <span style="margin-left: auto; font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: rgba(255, 255, 255, .9);">Nouvelle fiche</span>
  </div>

  <div style="flex: none; display: flex; align-items: center; height: 36px; padding: 0 20px; background: #ffffff; border-bottom: 1px solid #e2eef7;">
    <span style="font-size: 13px; color: #4e6c84;">Michel</span>
    <span style="margin-left: auto; font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 13px; font-weight: 600; color: #072b45;">131 triés</span>
  </div>

  <div data-zone="E2-bascule-type" style="flex: none; display: flex; gap: 8px; padding: 14px 20px; background: #ffffff; border-bottom: 1px solid #e2eef7;">
    <div style="flex: 1; display: flex; align-items: center; justify-content: center; height: 44px; border-radius: 4px; background: #072b45; color: #ffffff; font-size: 14px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase;">Ordinaire</div>
    <div style="flex: 1; display: flex; align-items: center; justify-content: center; height: 44px; border: 1px solid #5b2d8e; border-radius: 4px; background: #ffffff; color: #5b2d8e; font-size: 14px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase;">Rare</div>
  </div>

  <div style="flex: none; display: flex; align-items: center; gap: 11px; padding: 12px 22px; background: #dcecf7;">
    <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#0c6ea6" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="flex: none;">
      <circle cx="12" cy="12" r="8.5"></circle>
      <path d="M12 7.8v5M12 16.3h.01"></path>
    </svg>
    <span style="font-size: 14px; line-height: 1.4; color: #33536e;">Pas de code-barres. La fiche reçoit un code interne.</span>
  </div>

  <div style="flex: 1 1 auto; display: flex; flex-direction: column; gap: 16px; padding: 18px 22px; overflow: hidden; background: #ffffff;">

    <div data-zone="E2-champ-titre" style="display: flex; flex-direction: column; gap: 6px;">
      <span style="font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 11px; font-weight: 500; letter-spacing: .14em; text-transform: uppercase; color: #6d8ba2;">Titre *</span>
      <div style="display: flex; align-items: center; height: 42px; border-bottom: 2px solid #1497d6; font-size: 17px; color: #6d8ba2;">Titre du livre</div>
    </div>

    <div data-zone="E2-champ-auteur" style="display: flex; flex-direction: column; gap: 6px;">
      <span style="font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 11px; font-weight: 500; letter-spacing: .14em; text-transform: uppercase; color: #6d8ba2;">Auteur</span>
      <div style="display: flex; align-items: center; height: 42px; border-bottom: 1px solid #9bb8cc; font-size: 17px; color: #6d8ba2;">Nom de l'auteur</div>
    </div>

    <div style="display: flex; gap: 14px;">
      <div data-zone="E2-champ-editeur" style="flex: 1; display: flex; flex-direction: column; gap: 6px;">
        <span style="font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 11px; font-weight: 500; letter-spacing: .14em; text-transform: uppercase; color: #6d8ba2;">Éditeur</span>
        <div style="display: flex; align-items: center; height: 42px; border-bottom: 1px solid #9bb8cc; font-size: 17px; color: #6d8ba2;">Éditeur</div>
      </div>
      <div data-zone="E2-champ-annee" style="width: 96px; display: flex; flex-direction: column; gap: 6px;">
        <span style="font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 11px; font-weight: 500; letter-spacing: .14em; text-transform: uppercase; color: #6d8ba2;">Année</span>
        <div style="display: flex; align-items: center; height: 42px; border-bottom: 1px solid #9bb8cc; font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 17px; color: #6d8ba2;">1932</div>
      </div>
    </div>

    <div data-zone="E2-champ-etat" style="display: flex; flex-direction: column; gap: 8px;">
      <span style="font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 11px; font-weight: 500; letter-spacing: .14em; text-transform: uppercase; color: #6d8ba2;">État</span>
      <div style="display: flex; gap: 8px;">
        <span style="padding: 8px 14px; border: 1px solid #0c6ea6; border-radius: 999px; background: #e9f4fb; color: #0c6ea6; font-size: 14px; font-weight: 600;">Bon</span>
        <span style="padding: 8px 14px; border: 1px solid #d9e9f4; border-radius: 999px; color: #4e6c84; font-size: 14px;">Correct</span>
        <span style="padding: 8px 14px; border: 1px solid #d9e9f4; border-radius: 999px; color: #4e6c84; font-size: 14px;">Abîmé</span>
      </div>
    </div>

    <div data-zone="E2-champ-quantite" style="display: flex; align-items: center; justify-content: space-between;">
      <span style="font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 11px; font-weight: 500; letter-spacing: .14em; text-transform: uppercase; color: #6d8ba2;">Quantité</span>
      <div style="display: flex; align-items: center; gap: 0; border: 1px solid #d9e9f4; border-radius: 4px;">
        <span style="width: 44px; height: 40px; display: flex; align-items: center; justify-content: center; font-size: 22px; color: #0c6ea6;">−</span>
        <span style="width: 44px; height: 40px; display: flex; align-items: center; justify-content: center; font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 18px; font-weight: 500; color: #072b45;">3</span>
        <span style="width: 44px; height: 40px; display: flex; align-items: center; justify-content: center; font-size: 22px; color: #0c6ea6;">+</span>
      </div>
    </div>

    <div data-zone="E2-photos" style="display: flex; flex-direction: column; gap: 8px;">
      <span style="font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 11px; font-weight: 500; letter-spacing: .14em; text-transform: uppercase; color: #6d8ba2;">Photos</span>
      <div style="display: flex; gap: 10px;">
        <div style="width: 72px; height: 72px; display: flex; align-items: center; justify-content: center; border: 1px dashed #0c6ea6; border-radius: 4px; background: #f7fbfe;">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#0c6ea6" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 5v14M5 12h14"></path>
          </svg>
        </div>
      </div>
    </div>

  </div>

  <div style="flex: none; display: flex; flex-direction: column; gap: 10px; padding: 12px 20px 24px; background: #f7fbfe;">
    <div data-zone="E2-bouton-creer" style="display: flex; align-items: center; justify-content: center; height: 60px; border-radius: 999px; background: #f0801c;">
      <span style="font-size: 18px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: #ffffff;">Créer la fiche</span>
    </div>
    <div data-zone="E2-message-connexion" style="display: flex; align-items: center; justify-content: center; gap: 9px; height: 44px;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0c6ea6" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3.5 8V5.5a2 2 0 0 1 2-2H8M16 3.5h2.5a2 2 0 0 1 2 2V8M20.5 16v2.5a2 2 0 0 1-2 2H16M8 20.5H5.5a2 2 0 0 1-2-2V16"></path>
        <path d="M7 12h10"></path>
      </svg>
      <span style="font-size: 15px; font-weight: 500; color: #0c6ea6;">Connexion requise · pas de création hors ligne</span>
    </div>
  </div>

</div>
</body>
</html>
