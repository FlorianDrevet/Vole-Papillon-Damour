<!doctype html>
<html>

<body>
<x-dc>

<div style="display: flex; flex-direction: column; width: 390px; height: 844px; overflow: hidden; background: #f7fbfe; font-family: 'Libre Franklin', system-ui, sans-serif; color: #072b45;">

      <circle cx="12" cy="12" r="8.5"></circle>
      <path d="M15.4 8.9a4.3 4.3 0 0 0-6.7 1.3M8.7 13.9a4.3 4.3 0 0 0 6.7 1.2"></path>
      <path d="M7.4 10.9h6.2M7.4 13.4h6.2"></path>
    </svg>
    <span style="font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 12px; font-weight: 600; letter-spacing: .16em; text-transform: uppercase;">Caisse</span>
    <span style="margin-left: auto; font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: rgba(255, 255, 255, .9);">Bourse du 14 mars</span>

  <div style="flex: none; display: flex; flex-direction: column; background: #ffffff; border-bottom: 1px solid #e2eef7;">

    <div style="display: flex; flex-direction: column; justify-content: center; gap: 3px; height: 76px; padding: 0 22px;">
      <span style="font-family: 'Newsreader', Georgia, serif; font-size: 21px; font-weight: 500; line-height: 1.15; color: #072b45;">Astérix chez les Belges</span>
      <span style="font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: .04em; color: #6d8ba2;">Dargaud · 2005</span>
    </div>
  </div>

  <div style="flex: none; display: flex; flex-direction: column; gap: 12px; margin: 16px 20px; padding: 20px 20px 24px; border-radius: 4px; background: #5f3a86; box-shadow: 0 26px 44px -30px rgba(7, 43, 69, .6);">

      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="flex: none;">
        <path d="M6.2 4.5h11.6l3.7 5.3L12 20.4 2.5 9.8z"></path>
        <path d="M2.5 9.8h19M8.6 4.5 12 20.4 15.4 4.5"></path>

      <span style="font-size: 21px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: #ffffff;">Livre rare</span>
    </div>
    <span style="font-family: 'Newsreader', Georgia, serif; font-size: 23px; font-weight: 500; line-height: 1.15; color: #ffffff;">Fables de La Fontaine</span>
    <span style="font-size: 15.5px; line-height: 1.4; color: rgba(255, 255, 255, .92);">Voir le prix indiqué sur le livre.</span>

    <span style="font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 11px; font-weight: 500; letter-spacing: .14em; text-transform: uppercase; color: #6d8ba2;">Dans cette vente</span>
    <span style="margin-left: auto; font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 19px; font-weight: 600; color: #072b45;">3 livres</span>
  </div>

  <div style="flex: 1 1 auto; background: #f7fbfe;"></div>

  <div style="flex: none; display: flex; flex-direction: column; gap: 13px; padding: 15px 20px 24px; background: #ffffff; border-top: 1px solid #d9e9f4; box-shadow: 0 -18px 30px -26px rgba(7, 43, 69, .55);">
    <span style="text-align: center; font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 10px; font-weight: 500; letter-spacing: .12em; text-transform: uppercase; color: #6d8ba2;">Aucun prix, aucun total — l'encaissement reste manuel</span>
    <div style="display: flex; gap: 12px;">
      <div style="flex: 1 1 0; display: flex; align-items: center; justify-content: center; gap: 8px; height: 60px; border: 1.5px solid #9dc2da; border-radius: 999px; background: #ffffff;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0c6ea6" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="flex: none;">
          <path d="M4 9.5h9.5a5.5 5.5 0 1 1 0 11H8"></path>
          <path d="m8 5-4 4.5 4 4.5"></path>
        </svg>
        <span style="font-size: 15px; font-weight: 700; letter-spacing: .03em; color: #0c6ea6;">Annuler dernier</span>
      </div>
      <div style="flex: 1 1 0; display: flex; align-items: center; justify-content: center; height: 60px; border-radius: 999px; background: #f0801c;">
        <span style="font-size: 17px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: #ffffff;">Valider</span>
      </div>
    </div>
  </div>

</div>
