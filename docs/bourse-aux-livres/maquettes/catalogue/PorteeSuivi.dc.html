<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Libre+Franklin:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&display=swap">
  <style>
    body { margin: 0; background: #f7fbfe; -webkit-font-smoothing: antialiased; }
    a { color: #0c6ea6; text-decoration: none; }
    a:hover { color: #072b45; }
  </style>
</helmet>

<div style="display: flex; align-items: center; justify-content: center; width: 760px; height: 640px; background: rgba(4, 29, 48, .55); font-family: 'Libre Franklin', system-ui, sans-serif; color: #072b45;">

  <div style="width: 600px; border-radius: 2px; background: #ffffff; overflow: hidden; box-shadow: 0 40px 70px -34px rgba(4, 29, 48, .85);">
    <div style="height: 3px; background: linear-gradient(90deg, #1497d6, #7fd8f5 50%, #f0801c);"></div>

    <div style="padding: 30px 34px 32px;">
      <span style="font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 10px; font-weight: 500; letter-spacing: .18em; text-transform: uppercase; color: #dc6412;">Ajouter à ma liste</span>
      <div style="margin-top: 12px; padding-bottom: 20px; border-bottom: 1px solid #e2eef7;">
        <span style="display: block; font-family: 'Newsreader', Georgia, serif; font-size: 29px; font-weight: 500; line-height: 1.1; color: #072b45;">Le Petit Prince</span>
        <span style="display: block; margin-top: 6px; font-size: 15px; color: #4e6c84;">Antoine de Saint-Exupéry</span>
      </div>

      <span style="display: block; margin-top: 24px; font-size: 16px; font-weight: 600; color: #072b45;">Que souhaitez-vous suivre ?</span>

      <div style="display: flex; gap: 14px; margin-top: 16px; padding: 18px 20px; border: 1.5px solid #0c6ea6; border-radius: 2px; background: #f7fbfe;">
        <span style="flex: none; margin-top: 2px; display: flex; align-items: center; justify-content: center; width: 18px; height: 18px; border: 1.5px solid #0c6ea6; border-radius: 999px;">
          <span style="width: 9px; height: 9px; border-radius: 999px; background: #0c6ea6;"></span>
        </span>
        <div style="display: flex; flex-direction: column; gap: 5px;">
          <span style="font-size: 16px; font-weight: 600; color: #072b45;">N'importe quelle édition</span>
          <span style="font-size: 14px; line-height: 1.5; color: #4e6c84;">Vous serez prévenu dès qu'un exemplaire arrive, quel que soit l'éditeur.</span>
        </div>
      </div>

      <div style="display: flex; gap: 14px; margin-top: 12px; padding: 18px 20px; border: 1px solid #d9e9f4; border-radius: 2px; background: #ffffff;">
        <span style="flex: none; margin-top: 2px; width: 18px; height: 18px; border: 1.5px solid #9dc2da; border-radius: 999px;"></span>
        <div style="flex: 1 1 auto; display: flex; flex-direction: column; gap: 10px;">
          <span style="font-size: 16px; font-weight: 600; color: #33536e;">Une édition précise</span>
          <div style="display: flex; align-items: center; justify-content: space-between; height: 46px; padding: 0 16px; border: 1px solid #d9e9f4; border-radius: 2px; background: #f7fbfe;">
            <span style="font-size: 14.5px; color: #6d8ba2;">Gallimard, Folio, 1999</span>
            <svg width="12" height="8" viewBox="0 0 10 6" fill="none" stroke="#6d8ba2" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 1l4 4 4-4"></path>
            </svg>
          </div>
        </div>
      </div>

      <div style="display: flex; align-items: center; justify-content: center; height: 54px; margin-top: 26px; border-radius: 999px; background: #f0801c;">
        <span style="font-size: 16px; font-weight: 600; color: #ffffff;">Ajouter à ma liste</span>
      </div>

      <span style="display: block; margin-top: 16px; text-align: center; font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: #6d8ba2;">Retirable en un clic, à tout moment</span>
    </div>
  </div>

</div>
</x-dc>
</body>
</html>
