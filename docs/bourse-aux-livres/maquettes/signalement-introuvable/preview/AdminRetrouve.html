<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Confirmer retrouvé</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Libre+Franklin:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&display=swap">
  <style>
    body { margin: 0; background: #f7fbfe; -webkit-font-smoothing: antialiased; }
    a { color: #0c6ea6; text-decoration: none; }
    a:hover { color: #072b45; }
  </style>
</head>
<body>
<div style="position: relative; width: 560px; height: 420px; overflow: hidden; background: #f7fbfe; font-family: 'Libre Franklin', system-ui, sans-serif; color: #072b45;">
<section role="dialog" aria-modal="true" aria-labelledby="d-title" style="box-sizing: border-box; width: 560px; height: 420px; padding: 30px 32px 28px; background: #ffffff; display: flex; flex-direction: column; gap: 18px;">
    <span style="font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 10.5px; font-weight: 500; letter-spacing: .18em; text-transform: uppercase; color: #dc6412;">Vérification</span>
    <h2 id="d-title" style="margin: 0; font-family: 'Newsreader', Georgia, serif; font-size: 27px; font-weight: 500; line-height: 1.12; color: #072b45;">Le Horla est bien en rayon ?</h2>
    <p style="margin: 0; font-size: 15px; line-height: 1.55; color: #33536e;">Le signalement sera clôturé. Le stock ne change pas, et le membre verra « retrouvé en rayon ».</p>
    <label style="display: flex; flex-direction: column; gap: 8px; font-size: 14px; font-weight: 600; color: #072b45;">Note <span style="margin-top: -6px; font-weight: 400; font-size: 13px; color: #6d8ba2;">Facultative</span>
      <input type="text" value="était rangé en Poésie" style="box-sizing: border-box; width: 100%; height: 46px; padding: 0 14px; border: 1px solid #d9e9f4; border-radius: 4px; font-family: 'Libre Franklin', system-ui, sans-serif; font-size: 15px; color: #072b45;">
    </label>
    <div style="flex: 1 1 auto;"></div>
    <div style="display: flex; justify-content: flex-end; gap: 12px;">
      <button type="button" style="margin: 0; font-family: inherit; cursor: pointer; min-height: 48px; padding: 0 22px; border: 1.5px solid #9dc2da; border-radius: 999px; background: #ffffff; font-size: 15px; font-weight: 600; color: #072b45;">Annuler</button>
      <button type="button" style="margin: 0; font-family: inherit; cursor: pointer; min-height: 48px; padding: 0 24px; border: 0; border-radius: 999px; background: #18703a; font-size: 15px; font-weight: 600; color: #ffffff;">Confirmer : retrouvé</button>
    </div>
  </section>
</div>
</body>
</html>
