<div class="flex justify-center items-center"
     [ngClass]="{
       'rounded-3xl': rounded(),
       'p-4 md:p-5': backgroundColor() !== null,
       'rotate-left': rotation() === RotationEnum.LEFT,
       'rotate-right': rotation() === RotationEnum.RIGHT,
       'bg-primary-color': backgroundColor() === BackgroundColorEnum.BLUE,
       'bg-white': backgroundColor() === BackgroundColorEnum.WHITE
     }">
  <img [src]="src()"
       alt="image"
       [attr.fetchpriority]="highPriorityFetching() ? 'high' : null"
       class="max-w-[250px] sm:max-w-[250px] md:max-w-[250px] lg:max-w-[350px] xl:max-w-[450px] max-h-[250px] sm:max-h-[250px] md:max-h-[250px] lg:max-h-[350px] xl:max-h-[450px] w-auto h-auto">
</div>
