<div class="relative flex w-full flex-col gap-3.5 rounded-sm border border-line bg-white p-4 sm:w-[280px]">
  @if (editable()) {
    <div class="absolute right-3 top-3 z-10 flex gap-2">
      <button
        type="button"
        (click)="onEdit()"
        aria-label="Modifier"
        class="inline-flex h-8 w-8 items-center justify-center rounded-full border border-line bg-white text-slate-2 hover:border-blue-2 hover:text-blue">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M15.7 4.7a1.9 1.9 0 0 1 2.7 2.7L8.5 17.3 4.5 18.4l1.1-4z"/>
        </svg>
      </button>
      <button
        type="button"
        (click)="onDelete()"
        aria-label="Supprimer"
        class="inline-flex h-8 w-8 items-center justify-center rounded-full border border-danger/30 bg-white text-danger hover:bg-danger-soft">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M5 7h14M9.5 7V5a1 1 0 0 1 1-1h3a1 1 0 0 1 1 1v2M7 7l1 12.5A1.5 1.5 0 0 0 9.5 21h5a1.5 1.5 0 0 0 1.5-1.5L17 7"/>
        </svg>
      </button>
    </div>
  }

  <img [src]="actuality().urlPrincipalImage" [alt]="actuality().title" class="h-44 w-full rounded object-cover">
  <span class="font-mono text-[11px] tracking-[.1em] text-slate-3">{{ actuality().date | date:'d MMM yyyy' }}</span>
  <h3 class="font-serif text-xl font-medium leading-tight text-ink-2">{{ actuality().title }}</h3>
  <p #article class="article-box text-sm leading-relaxed text-slate-2">{{ actuality().article }}</p>

  <a [routerLink]="'/actualite/' + actuality().id" class="mt-auto font-mono text-[11px] uppercase tracking-[.12em] text-blue">
    Lire la suite →
  </a>
</div>
