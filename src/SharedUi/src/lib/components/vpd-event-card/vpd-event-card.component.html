<div class="flex flex-col rounded-[40px] bg-white">
  <div class="relative">
    <a [href]="'/evenement/' + event().id">
      <img [src]="event().urlImage" class="w-full h-[220px] rounded-t-3xl" alt="">
    </a>
    @if (editable()) {
      <div class="flex flex-row gap-2 absolute top-2 right-2">
        @if (event().eventType === VpdEventEnum.Bingo) {
          <a [href]="'evenement/' + event().id + '/loto-tableau'">
            <button
              type="button"
              class="rounded-full bg-white border-primary-color border-2 text-primary-color p-2">
              <img class="h-7" fetchpriority="high" src="icons/tableau.png" alt="Tableau">
            </button>
          </a>
        }
        <button
          type="button"
          (click)="onEdit()"
          class="rounded-full bg-white border-primary-color border-2 text-primary-color p-2">
          <img class="h-7" fetchpriority="high" src="icons/crayon.png" alt="Modifier">
        </button>
        <button
          type="button"
          (click)="onDelete()"
          class="rounded-full bg-white border-primary-color border-2 text-primary-color p-2">
          <img class="h-7" fetchpriority="high" src="icons/supprimer.png" alt="Supprimer">
        </button>
      </div>
    }
  </div>
  <a [href]="'/evenement/' + event().id" class="flex flex-row w-full bg-secondary-color justify-between rounded-b-3xl p-3">
    <h3 class="text-3xl ml-2 text-white">{{ event().name }}</h3>
    <div class="flex flex-row justify-between bg-secondary-color mr-2">
      <img class="mr-3" height="35" src="icons/calendar-icon.svg" width="35" alt="">
      <h4 class="text-3xl text-white">{{ event().dateStart | date:'dd/MM' }}</h4>
    </div>
  </a>
</div>
