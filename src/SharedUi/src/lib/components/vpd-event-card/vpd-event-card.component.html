<div class="flex w-[280px] flex-col overflow-hidden rounded-sm border border-line bg-white">
  <div class="relative">
    <a [routerLink]="'/evenement/' + event().id">
      <img [src]="event().urlImage" [alt]="event().name" class="h-[150px] w-full object-cover">
    </a>
    <span class="absolute left-3 top-3 flex flex-col items-center rounded-sm bg-white/95 px-2.5 py-1.5 leading-none shadow-[0_10px_20px_-12px_rgba(7,43,69,0.5)]">
      <span class="font-serif text-lg text-ink-2">{{ event().dateStart | date:'dd':'UTC' }}</span>
      <span class="font-mono text-[9px] uppercase tracking-[.1em] text-blue">{{ event().dateStart | date:'MMM':'UTC' }}</span>
    </span>

    @if (editable()) {
      <div class="absolute right-3 top-3 flex gap-2">
        @if (event().eventType === VpdEventEnum.Bingo) {
          <a [href]="'evenement/' + event().id + '/loto-tableau'" aria-label="Ouvrir le tableau">
            <span class="inline-flex h-8 w-8 items-center justify-center rounded-full border border-line bg-white text-slate-2 hover:border-blue-2 hover:text-blue">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <rect x="3.5" y="4.5" width="17" height="15" rx="1.5"/>
                <path d="M3.5 9.5h17M8.5 4.5v15M14 4.5v15"/>
              </svg>
            </span>
          </a>
        }
        <button
          type="button"
          (click)="onEdit()"
          aria-label="Modifier"
          class="inline-flex h-8 w-8 items-center justify-center rounded-full border border-line bg-white text-slate-2 hover:border-blue-2 hover:text-blue">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M15.7 4.7a1.9 1.9 0 0 1 2.7 2.7L8.5 17.3 4.5 18.4l1.1-4z"/>
          </svg>
        </button>
        <button
          type="button"
          (click)="onDelete()"
          aria-label="Supprimer"
          class="inline-flex h-8 w-8 items-center justify-center rounded-full border border-danger/30 bg-white text-danger hover:bg-danger-soft">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M5 7h14M9.5 7V5a1 1 0 0 1 1-1h3a1 1 0 0 1 1 1v2M7 7l1 12.5A1.5 1.5 0 0 0 9.5 21h5a1.5 1.5 0 0 0 1.5-1.5L17 7"/>
          </svg>
        </button>
      </div>
    }
  </div>
  <a [routerLink]="'/evenement/' + event().id" class="flex flex-col gap-1 p-4">
    <strong class="font-serif text-lg leading-tight text-ink-2">{{ event().name }}</strong>
    <span class="font-mono text-[11px] uppercase tracking-[.1em] text-slate-3">{{ event().city }}</span>
  </a>
</div>
