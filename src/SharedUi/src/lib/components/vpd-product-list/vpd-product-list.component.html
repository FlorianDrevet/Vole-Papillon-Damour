<div class="vpd-container-products">
  @for (p of products(); track p.id) {
    <vpd-product-card
      [product]="p"
      [editable]="editable()"
      [showPromotions]="showPromotions()"
      (editRequested)="productEditRequested.emit($event)"
      (deleteRequested)="productDeleteRequested.emit($event)"></vpd-product-card>
  }
</div>
