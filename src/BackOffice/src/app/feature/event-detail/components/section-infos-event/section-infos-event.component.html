<div class="flex min-w-[220px] flex-1 flex-col gap-2.5 rounded-sm border border-line bg-white px-5 py-4">
  <div class="flex items-center gap-2.5">
    <img [src]="UrlIcon()" class="h-5 w-5" alt="">
    <span class="font-mono text-[11px] uppercase tracking-[.12em] text-slate-3">{{ Title() }}</span>
  </div>
  <p [innerHTML]="Value()" class="text-[15px] leading-snug text-ink-2"></p>
  <ng-content select="value"></ng-content>
  <div class="content-isempty">
    <ng-content></ng-content>
  </div>
</div>
