<div class="flex-row flex-wrap justify-between md:flex-col flex w-full">
  <div class="mr-5 lg:mr-0">
    <div class="flex-row flex w-fit">
      <img [src]="UrlIcon()" class="h-[35px] lg:h-[50px] mr-3 mb-1">
      <h2 class="title-section">{{ Title() }}</h2>
    </div>
    <div class="underline-title mb-2 lg:mb-0"></div>
  </div>
  <p [innerHTML]="Value()" class="mt-1 lg:mt-5 lg:ml-0"></p>
  <ng-content select="value"></ng-content>
</div>

<div class="mt-5 w-fit ml-auto mr-auto content-isempty">
  <ng-content></ng-content>
</div>
