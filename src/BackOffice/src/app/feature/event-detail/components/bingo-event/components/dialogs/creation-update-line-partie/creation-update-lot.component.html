<mat-dialog-content class="h-fit w-[420px] max-w-full !flex flex-col gap-5 lg:!max-h-[80vh]">
  <div class="flex flex-col gap-2">
    <h1 class="font-serif text-2xl font-medium text-ink-2">
      {{ updateLot() !== null ? "Modifier un lot" : "Nouveau lot" }}
    </h1>
    <div class="h-px w-full bg-line-2"></div>
  </div>

  <form [formGroup]="newLotForm" class="flex w-full flex-col gap-4">
    <div class="w-full">
      <h2 class="mb-1 font-mono text-[11px] font-medium uppercase tracking-[.1em] text-slate-3">Titre</h2>
      <mat-form-field appearance="fill" class="w-full">
        <mat-label>Titre</mat-label>
        <input class="w-full" formControlName="name" matInput placeholder="Titre">
      </mat-form-field>
    </div>

    <div class="flex flex-col gap-3">
      <div class="flex items-center gap-3">
        <h2 class="font-mono text-[11px] font-medium uppercase tracking-[.1em] text-slate-3">Image</h2>
        <input #fileInput (change)="ImageUtils.onFileSelected(document.getElementById('file-lot'), principalImage)"
               [required]="true"
               formControlName="image"
               hidden id="file-lot" required type="file"
        >
        <button
          (click)="fileInput.click()"
          type="button"
          class="rounded-full border border-mist px-4 py-1.5 text-xs font-semibold text-blue hover:bg-blue/5">
          Choisir une image
        </button>
      </div>
      @if (this.principalImage().fileContent !== '') {
        <div class="preview-img-container">
          <img [src]="this.principalImage().fileContent" alt="Image du lot">
        </div>
      }
    </div>
  </form>
</mat-dialog-content>
<mat-dialog-actions>
  @if (isLoading()) {
    <mat-spinner class="ml-5 mr-5" diameter="30"></mat-spinner>
  } @else {
    <button (click)="onNoClick()" cdkFocusInitial mat-button>Annuler</button>
    <button (click)="onYesClick()" mat-button>{{ updateLot() !== null ? "Modifier" : "Créer" }}</button>
  }
</mat-dialog-actions>
