<div class="flex w-full items-center gap-2 rounded-sm border border-line-2 bg-paper-2 p-3">
  @if (LinePartie().lots.length > 1) {
    <button type="button" (click)="previousLot()" aria-label="Lot précédent" class="shrink-0 text-slate-3 hover:text-blue">
      <app-icon name="chevron-right" [size]="14" class="rotate-180 block"></app-icon>
    </button>
  }

  <div class="flex w-full items-center gap-4 rounded-sm bg-white p-3">
    <div class="flex h-[64px] w-[64px] shrink-0 items-center justify-center rounded-sm bg-paper-2 p-1.5">
      <img [src]="currentLot().urlImage" class="h-full w-full object-contain" alt="">
    </div>

    <div class="flex w-full flex-col gap-2">
      <div class="flex w-full items-center justify-between gap-2">
        <span class="font-mono text-[11px] uppercase tracking-[.08em] text-blue">{{ LinePartie().numberLine | lineNumberTitle }}</span>
        <div class="flex gap-1.5">
          <app-icon-button icon="add" ariaLabel="Ajouter un lot alternatif" [small]="true" (click)="openDialogAddPartieLine(LinePartie().numberLine)"></app-icon-button>
          <app-icon-button icon="edit" ariaLabel="Modifier ce lot" [small]="true" (click)="openDialogUpdate(LinePartie().numberLine)"></app-icon-button>
          <app-icon-button icon="delete" ariaLabel="Supprimer ce lot" variant="danger" [small]="true" (click)="openDialogDeletion()"></app-icon-button>
        </div>
        @if (LinePartie().lots.length > 1) {
          <span class="font-mono text-[11px] uppercase tracking-[.08em] text-slate-3">ou</span>
        }
      </div>
      <span class="text-[15px] font-medium leading-snug text-ink-2">{{ currentLot().name }}</span>
    </div>
  </div>

  @if (LinePartie().lots.length > 1) {
    <button type="button" (click)="nextLot()" aria-label="Lot suivant" class="shrink-0 text-slate-3 hover:text-blue">
      <app-icon name="chevron-right" [size]="14"></app-icon>
    </button>
  }
</div>
