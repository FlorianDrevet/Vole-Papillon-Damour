@if (vpdEvent() === null) {
  <div class="flex justify-center px-shell py-24">
    <mat-spinner></mat-spinner>
  </div>
} @else {
  <div class="mx-auto flex w-full max-w-shell flex-col gap-10 px-shell py-10 lg:py-14">
    <a routerLink="/evenements" class="inline-flex w-fit items-center gap-2 font-mono text-[11px] uppercase tracking-[.14em] text-blue">
      <app-icon name="back" [size]="13"></app-icon>
      Tous les évènements
    </a>

    <h1 class="font-serif text-[34px] font-medium leading-[1.02] text-ink-2 lg:text-[46px]">{{ vpdEvent()?.name }}</h1>

    @if (vpdEvent()!.eventType === VpdEventEnum.Bingo) {
      <app-bingo-event [vpdEvent]="vpdEvent()!"></app-bingo-event>
    } @else if (vpdEvent()!.eventType === VpdEventEnum.Books) {
      <app-books-event [vpdEvent]="vpdEvent()!"></app-books-event>
    } @else {
      <app-other-event [vpdEvent]="vpdEvent()!"></app-other-event>
    }
  </div>
}
