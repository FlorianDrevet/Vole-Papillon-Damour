<div class="flex w-full flex-col gap-8 px-shell pb-16">
  <app-page-header eyebrow="Vole Papillon d'Amour · Espace bénévoles" title="La Caisse">
    <div class="flex gap-2">
      <app-icon-button icon="download" ariaLabel="Télécharger l'application caisse" (click)="downloadCaisseApp()"></app-icon-button>
      <app-pill-button (click)="openDialogCreation()" type="button" [small]="true">
        <app-icon name="add" [size]="15"></app-icon>
        Nouveau produit
      </app-pill-button>
    </div>
  </app-page-header>

  <div class="flex flex-wrap gap-2">
    <button
      type="button"
      (click)="changeFilter(ProductSectionEnum.Bar)"
      class="inline-flex items-center gap-2 rounded-full border px-5 py-2.5 text-sm font-semibold transition"
      [class]="filter() === ProductSectionEnum.Bar ? 'border-orange bg-orange text-white' : 'border-line bg-white text-slate-2 hover:border-mist'">
      Buvette
    </button>
    <button
      type="button"
      (click)="changeFilter(ProductSectionEnum.Bingo)"
      class="inline-flex items-center gap-2 rounded-full border px-5 py-2.5 text-sm font-semibold transition"
      [class]="filter() === ProductSectionEnum.Bingo ? 'border-orange bg-orange text-white' : 'border-line bg-white text-slate-2 hover:border-mist'">
      Loto
    </button>
    <button
      type="button"
      (click)="changeFilter(ProductSectionEnum.Book)"
      class="inline-flex items-center gap-2 rounded-full border px-5 py-2.5 text-sm font-semibold transition"
      [class]="filter() === ProductSectionEnum.Book ? 'border-orange bg-orange text-white' : 'border-line bg-white text-slate-2 hover:border-mist'">
      Livres
    </button>
  </div>

  @if (filter() === ProductSectionEnum.Bar) {
    <div class="flex flex-wrap gap-2 border-b border-line-2 pb-6">
      <button
        type="button"
        (click)="changeFilterBar(ProductCategoryEnum.Salt)"
        class="rounded-full px-4 py-2 font-mono text-[11px] uppercase tracking-[.1em] transition"
        [class]="filterBar() === ProductCategoryEnum.Salt ? 'bg-blue text-white' : 'bg-paper-2 text-slate-2 hover:bg-mist-2'">
        Salé
      </button>
      <button
        type="button"
        (click)="changeFilterBar(ProductCategoryEnum.Sugar)"
        class="rounded-full px-4 py-2 font-mono text-[11px] uppercase tracking-[.1em] transition"
        [class]="filterBar() === ProductCategoryEnum.Sugar ? 'bg-blue text-white' : 'bg-paper-2 text-slate-2 hover:bg-mist-2'">
        Sucré
      </button>
      <button
        type="button"
        (click)="changeFilterBar(ProductCategoryEnum.ColdDrink)"
        class="rounded-full px-4 py-2 font-mono text-[11px] uppercase tracking-[.1em] transition"
        [class]="filterBar() === ProductCategoryEnum.ColdDrink ? 'bg-blue text-white' : 'bg-paper-2 text-slate-2 hover:bg-mist-2'">
        Boisson froide
      </button>
      <button
        type="button"
        (click)="changeFilterBar(ProductCategoryEnum.HotDrink)"
        class="rounded-full px-4 py-2 font-mono text-[11px] uppercase tracking-[.1em] transition"
        [class]="filterBar() === ProductCategoryEnum.HotDrink ? 'bg-blue text-white' : 'bg-paper-2 text-slate-2 hover:bg-mist-2'">
        Boisson chaude
      </button>
    </div>
  }

  <app-prices [category]="filterBar()" [newProduct]="eventUpdated()" [section]="filter()"></app-prices>
</div>
