<div class="flex w-full flex-col gap-8 px-shell pb-16">
  <app-page-header eyebrow="Vole Papillon d'Amour · Espace bénévoles" title="La Caisse">
    <div class="flex gap-2">
      <app-icon-button icon="download" ariaLabel="Télécharger l'application caisse" (click)="downloadCaisseApp()"></app-icon-button>
      <app-pill-button (click)="openDialogCreation()" type="button" [small]="true">
        <app-icon name="add" [size]="15"></app-icon>
        Nouveau produit
      </app-pill-button>
    </div>
  </app-page-header>

  <div class="flex flex-wrap gap-2" role="group" aria-label="Section de vente">
    @for (section of sections; track section.value) {
      <app-filter-chip
        (click)="changeFilter(section.value)"
        [active]="filter() === section.value">{{ section.label }}</app-filter-chip>
    }
  </div>

  @if (filter() === ProductSectionEnum.Bar) {
    <div class="flex flex-wrap gap-2 border-b border-line-2 pb-6" role="group" aria-label="Catégorie de buvette">
      @for (category of barCategories; track category.value) {
        <app-filter-chip
          (click)="changeFilterBar(category.value)"
          [active]="filterBar() === category.value"
          variant="chip">{{ category.label }}</app-filter-chip>
      }
    </div>
  }

  <app-prices [category]="filterBar()" [newProduct]="createdProduct()" [section]="filter()"></app-prices>
</div>
