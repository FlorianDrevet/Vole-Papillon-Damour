<div class="flex w-full flex-col gap-10 px-shell pb-16">
  <app-page-header eyebrow="Vole Papillon d'Amour · Espace bénévoles" title="Toute l'actualité">
    <app-pill-button (click)="openDialogCreation()" type="button" [small]="true">
      <app-icon name="add" [size]="15"></app-icon>
      Nouvelle actualité
    </app-pill-button>
  </app-page-header>

  @if (isLoading()) {
    <mat-spinner class="ml-auto mr-auto mt-10"></mat-spinner>
  } @else if (groupedActualities().length === 0) {
    <p class="mt-4 text-[15px] text-slate-2">Aucune actualité pour le moment.</p>
  } @else {
    <div class="flex flex-col gap-14">
      @for (month of groupedActualities(); track month) {
        <app-actuality-by-month
          (actualityDeleted)="actualityDeleted($event)"
          (actualityUpdated)="actualityUpdated($event)"
          Title="{{month.month | capitalize}} {{month.year}}"
          [Actualities]="month.actualities"></app-actuality-by-month>
      }
    </div>
  }
</div>
