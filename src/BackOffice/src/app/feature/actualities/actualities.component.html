<div class="flex w-full flex-col gap-10 px-shell pb-16">
  <app-page-header eyebrow="Vole Papillon d'Amour · Espace bénévoles" title="Toute l'actualité">
    <app-pill-button (click)="openDialogCreation()" type="button" [small]="true">
      <app-icon name="add" [size]="15"></app-icon>
      Nouvelle actualité
    </app-pill-button>
  </app-page-header>

  @if (isLoading()) {
    <app-loading-placeholder variant="rows" [count]="3"></app-loading-placeholder>
  } @else if (hasFailed()) {
    <app-state-panel
      icon="undo"
      tone="danger"
      title="Les actualités n'ont pas pu être chargées"
      description="Le serveur n'a pas répondu. Vérifiez votre connexion, puis réessayez.">
      <app-pill-button (click)="load()" type="button" variant="danger" [small]="true">
        Réessayer
      </app-pill-button>
    </app-state-panel>
  } @else if (groupedActualities().length === 0) {
    <app-state-panel
      icon="add"
      title="Aucune actualité publiée"
      description="Les actualités publiées ici apparaissent sur le site de l'association.">
      <app-pill-button (click)="openDialogCreation()" type="button" [small]="true">
        Écrire la première actualité
      </app-pill-button>
    </app-state-panel>
  } @else {
    <div class="flex flex-col gap-14">
      @for (month of groupedActualities(); track month.month + month.year) {
        <app-actuality-by-month
          (actualityDeleted)="actualityDeleted($event)"
          (actualityUpdated)="actualityUpdated($event)"
          Title="{{month.month | capitalize}} {{month.year}}"
          [Actualities]="month.actualities"></app-actuality-by-month>
      }
    </div>
  }
</div>
