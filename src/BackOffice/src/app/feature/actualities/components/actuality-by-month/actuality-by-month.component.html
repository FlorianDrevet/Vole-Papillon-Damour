<div class="flex flex-col gap-6">
  <app-group-heading [title]="Title()"></app-group-heading>

  <div class="flex flex-row flex-wrap gap-6">
    @for (actu of Actualities(); track actu.id) {
      <app-actuality-card
        (actualityUpdated)="updateActuality($event)"
        (actualityDeleted)="deleteActuality($event)"
        [ActualityModel]="actu"></app-actuality-card>
    }
  </div>
</div>
