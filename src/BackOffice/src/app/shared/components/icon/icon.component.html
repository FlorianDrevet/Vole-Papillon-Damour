<svg
  [attr.width]="size()"
  [attr.height]="size()"
  viewBox="0 0 24 24"
  fill="none"
  stroke="currentColor"
  stroke-width="1.6"
  stroke-linecap="round"
  stroke-linejoin="round"
  aria-hidden="true">
  @switch (name()) {
    @case ('add') {
      <path d="M12 5v14M5 12h14"/>
    }
    @case ('back') {
      <path d="M15 5l-7 7 7 7"/>
    }
    @case ('calendar') {
      <rect x="3.5" y="5" width="17" height="15" rx="1.5"/>
      <path d="M3.5 9.5h17M8 3v4M16 3v4"/>
    }
    @case ('check') {
      <path d="M5 12.5l4.5 4.5L19 7"/>
    }
    @case ('chevron-right') {
      <path d="M9 5.5l6.5 6.5-6.5 6.5"/>
    }
    @case ('close') {
      <path d="M6 6l12 12M18 6L6 18"/>
    }
    @case ('delete') {
      <path d="M5 7h14M9.5 7V5a1 1 0 0 1 1-1h3a1 1 0 0 1 1 1v2M7 7l1 12.5A1.5 1.5 0 0 0 9.5 21h5a1.5 1.5 0 0 0 1.5-1.5L17 7"/>
      <path d="M10.5 11v6M13.5 11v6"/>
    }
    @case ('download') {
      <path d="M12 3.5v11M8 11l4 4 4-4"/>
      <path d="M5 17.5v1.5A1.5 1.5 0 0 0 6.5 20.5h11a1.5 1.5 0 0 0 1.5-1.5v-1.5"/>
    }
    @case ('edit') {
      <path d="M15.7 4.7a1.9 1.9 0 0 1 2.7 2.7L8.5 17.3 4.5 18.4l1.1-4z"/>
    }
    @case ('menu') {
      <path d="M4 6.5h16M4 12h16M4 17.5h16"/>
    }
    @case ('trophy') {
      <path d="M8 5.5h8v5a4 4 0 0 1-8 0Z"/>
      <path d="M8 6.5H5.5a2 2 0 0 0 0 4H7M16 6.5h2.5a2 2 0 0 1 0 4H17M11 15.5v2.3M8.5 20.5h7l-.9-2.2a1 1 0 0 0-.9-.5H10.3a1 1 0 0 0-.9.5Z"/>
    }
    @case ('undo') {
      <path d="M7 8.5H4V5.5"/>
      <path d="M4 8.5a8 8 0 1 1-1.5 5.7"/>
    }
  }
</svg>
