<div class="bg-secondary-color p-5">
  <div class="border-2 border-black grid">
    @for (i of [].constructor(27); track i; let idx = $index) {
      <div class="border-black border-2 cell">
        @if (getNumberFromBingoCard(idx) !== null) {
          {{ getNumberFromBingoCard(idx) }}
        }
      </div>
    }
  </div>
</div>
