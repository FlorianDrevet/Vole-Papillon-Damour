<div aria-hidden="true">
  @switch (variant()) {
    <!-- Cartes d'évènement : 280 px de large, visuel de 150 px, comme vpd-event-card. -->
    @case ('cards') {
      <div class="flex flex-row flex-wrap gap-6">
        @for (item of items(); track item) {
          <div class="flex w-[280px] flex-col overflow-hidden rounded-sm border border-line bg-white">
            <span class="skeleton block h-[150px] w-full"></span>
            <span class="flex flex-col gap-2 p-4">
              <span class="skeleton block h-[18px] w-4/5 rounded"></span>
              <span class="skeleton block h-[11px] w-2/5 rounded"></span>
            </span>
          </div>
        }
      </div>
    }

    <!-- Cartes d'actualité : 280 px de large, visuel de 176 px. -->
    @case ('rows') {
      <div class="flex flex-row flex-wrap gap-6">
        @for (item of items(); track item) {
          <div class="flex w-full flex-col gap-3.5 rounded-sm border border-line bg-white p-4 sm:w-[280px]">
            <span class="skeleton block h-44 w-full rounded"></span>
            <span class="skeleton block h-[11px] w-1/3 rounded"></span>
            <span class="skeleton block h-[20px] w-4/5 rounded"></span>
            <span class="skeleton block h-[13px] w-full rounded"></span>
            <span class="skeleton block h-[13px] w-2/3 rounded"></span>
          </div>
        }
      </div>
    }

    <!-- Vignettes produit : 150 × 190, comme vpd-product-card. -->
    @case ('tiles') {
      <div class="grid gap-5" style="grid-template-columns: repeat(auto-fill, minmax(140px, 1fr))">
        @for (item of items(); track item) {
          <div class="flex h-[190px] w-[150px] flex-col overflow-hidden rounded-sm border border-line bg-white">
            <span class="skeleton block flex-1"></span>
            <span class="flex flex-col gap-2 border-t border-line-2 px-3 py-2.5">
              <span class="skeleton block h-[13px] w-4/5 rounded"></span>
              <span class="skeleton block h-[17px] w-1/2 rounded"></span>
            </span>
          </div>
        }
      </div>
    }
  }
</div>

<span class="sr-only" role="status">Chargement en cours…</span>
