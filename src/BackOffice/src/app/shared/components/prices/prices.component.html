@if (isLoading()) {
  <app-loading-placeholder variant="tiles" [count]="8"></app-loading-placeholder>
} @else if (hasFailed()) {
  <app-state-panel
    icon="undo"
    tone="danger"
    title="Les produits n'ont pas pu être chargés"
    description="Le serveur n'a pas répondu. Vérifiez votre connexion, puis réessayez.">
    <app-pill-button (click)="load()" type="button" variant="danger" [small]="true">
      Réessayer
    </app-pill-button>
  </app-state-panel>
} @else if (filteredProducts().length === 0) {
  <app-state-panel
    icon="add"
    title="Aucun produit dans cette catégorie"
    description="Les produits ajoutés ici alimentent l'application de caisse utilisée le jour de l'évènement.">
  </app-state-panel>
} @else {
  @if (isBookSection()) {
    <p class="mb-4 rounded-sm border border-line bg-paper-2 px-4 py-3 text-sm text-ink-2">
      Réglez l'ordre des prix avec les flèches. L'application Android affichera les livres dans le même ordre.
      @if (isSavingOrder()) {
        <span class="ml-2 font-medium" role="status">Enregistrement…</span>
      }
    </p>
  }
  <vpd-product-list
    [products]="filteredProducts()"
    [editable]="!isSavingOrder()"
    [showPromotions]="false"
    [reorderable]="isBookSection()"
    [reorderDisabled]="isSavingOrder()"
    (productEditRequested)="onEditRequested($event)"
    (productDeleteRequested)="onDeleteRequested($event)"
    (productOrderChangeRequested)="onBookProductOrderChanged($event)"></vpd-product-list>
}
