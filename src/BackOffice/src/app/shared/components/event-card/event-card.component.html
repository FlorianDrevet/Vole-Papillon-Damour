<div class="flex flex-col rounded-[40px] bg-white">
  <div class="relative">
    <a  [href]="'/evenement/' + VpdEvent().id" >
      <img [src]="VpdEvent().urlImage" class="w-full h-[220px] rounded-t-3xl">
    </a>
    <div class="flex flex-row gap-2 absolute top-2 right-2">
      @if (VpdEvent().eventType === VpdEventEnum.Bingo) {
        <a [href]="'evenement/' + VpdEvent().id + '/loto-tableau'">
          <button
            class="rounded-full bg-white border-primary-color border-2 text-primary-color p-2">
            <img class="h-7" fetchpriority="high" src="icons/tableau.png">
          </button>
        </a>
      }
      <button
        (click)="openDialogUpdate()"
        class="rounded-full bg-white border-primary-color border-2 text-primary-color p-2">
        <img class="h-7" fetchpriority="high" src="icons/crayon.png">
      </button>
      <button
        (click)="openDialogDeletion()"
        class="rounded-full bg-white border-primary-color border-2 text-primary-color p-2">
        <img class="h-7" fetchpriority="high" src="icons/supprimer.png">
      </button>
    </div>

  </div>
  <a [href]="'/evenement/' + VpdEvent().id" class="flex flex-row w-full bg-secondary-color justify-between rounded-b-3xl p-3">
    <h3 class="text-3xl ml-2 text-white">{{ VpdEvent().name }}</h3>
    <div class="flex flex-row justify-between bg-secondary-color mr-2">
      <img class="mr-3" height="35" src="icons/calendar-icon.svg" width="35">
      <h4 class="text-3xl text-white">{{ VpdEvent().dateStart | date:'dd/MM' }}</h4>
    </div>
  </a>
</div>
