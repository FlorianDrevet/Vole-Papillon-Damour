<mat-dialog-content class="h-fit !flex flex-col lg:!max-h-[80vh]">
  <h1 class="font-caveatbrush text-4xl lg:text-6xl text-primary-color ml-auto mr-auto">
    Scannez vos cartons de loto
  </h1>
  <div class="h-1 bg-primary-color w-full"></div>
  <form [formGroup]="newEventForm" class="flex flex-col w-full mt-5">
    <div class="flex w-full">
      <div class="mt-auto mb-auto flex flex-col">
        <div class="flex flex-col lg:flex-row">
          <p class="font-caveatbrush text-3xl lg:text-4xl text-primary-color mb-3">Image :</p>
          <div class="ml-5 mt-2 mb-5 lg:mb-0">
            <input #fileInput
                   (change)="ImageUtils.onFileSelected(document.getElementById('file-event'), bingoCardImage)"
                   [required]="true"
                   formControlName="image"
                   hidden id="file-event" required type="file"
            >
            <button (click)="fileInput.click()" mat-raised-button
                    type="button">Choisir une image
            </button>
          </div>
        </div>
        @if (this.bingoCardImage().fileContent !== '') {
          <div class="preview-img-container ml-auto mr-auto">
            <img [src]="this.bingoCardImage().fileContent" alt="Image de l'event">
          </div>
        }
      </div>
    </div>
  </form>
  <div>
    @for (bingoCard of this.bingoCards(); track bingoCard) {

      <div class="flex flex-col">
        <app-bingo-card [bingoCard]="bingoCard"></app-bingo-card>
      </div>
    }
  </div>
</mat-dialog-content>
<mat-dialog-actions>
  @if (isLoading()) {
    <mat-spinner class="ml-5 mr-5" diameter="30"></mat-spinner>
  } @else {
    <button (click)="onNoClick()" cdkFocusInitial mat-button>Annuler</button>
    <button (click)="onYesClick()" mat-button>Scanner</button>
  }
</mat-dialog-actions>
