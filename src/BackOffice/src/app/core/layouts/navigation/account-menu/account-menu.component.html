@if (isAuthenticated()) {
  <div class="relative">
    <button
      type="button"
      (click)="toggle()"
      [attr.aria-expanded]="isOpen()"
      aria-haspopup="menu"
      class="flex items-center gap-2.5 rounded-full border py-1 pl-1 pr-3 transition"
      [class]="isOpen() ? 'border-blue-2 bg-white' : 'border-line bg-white hover:border-mist'">
      <span class="flex h-8 w-8 shrink-0 items-center justify-center rounded-full bg-paper-2 font-mono text-[11px] font-medium text-blue">
        {{ initials() }}
      </span>
      <span class="max-w-[13ch] truncate text-sm text-slate-2">{{ displayName() }}</span>
      <app-icon
        name="chevron-right"
        [size]="13"
        class="shrink-0 text-slate-3 transition-transform"
        [class.rotate-90]="isOpen()"></app-icon>
    </button>

    @if (isOpen()) {
      <div
        role="menu"
        class="absolute right-0 top-[calc(100%+10px)] z-50 flex w-[260px] flex-col gap-4 rounded-sm border border-line bg-white p-4 shadow-[0_26px_48px_-28px_rgba(7,43,69,.55)]">
        <span class="flex flex-col gap-0.5">
          <span class="truncate text-[15px] font-medium text-ink-2">{{ displayName() }}</span>
          <span class="truncate text-[13px] text-slate-3">{{ email() }}</span>
        </span>

        <button
          type="button"
          role="menuitem"
          (click)="logout()"
          class="flex w-full items-center justify-between gap-3 rounded-sm border-t border-line-2 pt-3 text-left text-sm font-semibold text-danger">
          Se déconnecter
          <app-icon name="chevron-right" [size]="14"></app-icon>
        </button>
      </div>
    }
  </div>
}
