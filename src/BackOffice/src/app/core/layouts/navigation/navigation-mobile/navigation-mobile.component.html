<nav class="flex flex-row w-full items-center justify-between border-b border-line bg-paper px-shell py-4">
  <a class="flex items-center gap-2.5" routerLink="/actualites" aria-label="Retour à l'accueil">
    <img
      alt="Vole Papillon d'Amour"
      fetchpriority="high"
      height="30"
      src="logos/papillon_without_back.png"
      width="30">
    <span class="font-serif text-base leading-none text-ink-2">Vole Papillon d'Amour</span>
  </a>

  <button
    (click)="OnMobileNavigationClick()"
    type="button"
    [attr.aria-label]="isMobileNavigationOpen() ? 'Fermer le menu' : 'Ouvrir le menu'"
    class="inline-flex h-10 w-10 shrink-0 items-center justify-center rounded-full border border-line text-ink-2">
    <app-icon [name]="isMobileNavigationOpen() ? 'close' : 'menu'" [size]="18"></app-icon>
  </button>
</nav>

@if (isMobileNavigationOpen()) {
  <div class="mobile-navigation-dialog absolute flex overflow-auto bg-paper">
    <div class="sub-container-mobile-nav flex h-full w-full overflow-auto">
      <nav class="flex w-full flex-col p-shell">
        @if (subNavigation() !== null) {
          <button
            (click)="onBackNavigationClick()"
            type="button"
            class="mb-6 flex w-fit items-center gap-2 font-mono text-[11px] uppercase tracking-[.14em] text-blue">
            <app-icon name="back" [size]="13"></app-icon>
            Retour
          </button>
          <h2 class="mb-4 font-serif text-2xl text-ink-2">{{ titleSubNav() }}</h2>
        }
        <ul class="flex flex-col divide-y divide-line-2">
          @for (navigation of (subNavigation() === null ? NavigationItems() : subNavigation()); track navigation.url) {
            <li>
              <button
                (click)="OnSubNavigationClick(navigation)"
                type="button"
                class="flex w-full items-center justify-between py-4 text-left">
                <span class="font-serif text-xl text-ink-2">{{ navigation.title }}</span>
                <app-icon name="chevron-right" [size]="16" class="text-slate-3"></app-icon>
              </button>
            </li>
          }
        </ul>
      </nav>
    </div>
  </div>
}
