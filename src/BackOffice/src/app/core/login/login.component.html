<div class="flex min-h-screen flex-col lg:flex-row">
  <div class="relative flex items-center justify-center overflow-hidden bg-vpd-hero px-shell py-16 lg:w-1/2 lg:py-0">
    <div class="absolute -right-10 top-10 h-[220px] w-[220px] rounded-full border border-cyan/30 opacity-40"></div>
    <div class="absolute -left-16 bottom-10 h-[280px] w-[280px] rounded-full border border-cyan/20 opacity-30"></div>
    <div class="relative flex max-w-[26ch] flex-col items-center gap-6 text-center">
      <img class="h-16 w-16 object-contain" src="logos/papillon_without_back.png" alt="">
      <span class="font-mono text-[11px] uppercase tracking-[.2em] text-cyan">Espace bénévoles</span>
      <h1 class="font-serif text-[36px] font-medium leading-[1.05] text-white lg:text-[42px]">
        Vole Papillon d'Amour <span class="italic text-mist-2">&amp;</span> Bulle de Poils
      </h1>
    </div>
  </div>

  <div class="flex flex-1 items-center justify-center px-shell py-16">
    <div class="flex w-full max-w-[380px] flex-col gap-3">
      <span class="h-[3px] w-16 rounded-full bg-vpd-brand"></span>
      <h2 class="font-serif text-[30px] font-medium text-ink-2">Connexion</h2>
      <p class="mb-4 text-[15px] text-slate-2">Réservé aux bénévoles de l'association.</p>
      <p class="text-sm text-slate-2">Connectez-vous avec votre compte Microsoft de l'association.</p>
      <app-button-login (click)="onLoginClick()" class="mt-4">Se connecter avec Microsoft</app-button-login>
    </div>
  </div>
</div>
