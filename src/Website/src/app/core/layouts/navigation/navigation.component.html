@if (!url().includes('/tableau')) {
  <header class="bg-paper font-sans text-ink-2">
    <div class="hidden items-center justify-between border-b border-line px-shell py-5 lg:flex">
      <a routerLink="/accueil" class="flex items-center gap-3" aria-label="Retour à l'accueil">
        <img
          priority
          ngSrc="images/papillon_without_back.png"
          alt="Vole Papillon d'Amour"
          width="42" height="42"
          class="h-[42px] w-[42px] object-contain">
        <span class="flex flex-col gap-0.5">
          <span class="font-serif text-lg leading-none tracking-[-.01em]">Vole Papillon d'Amour</span>
          <span class="font-mono text-[9px] uppercase tracking-[.2em] text-slate-3">Association familiale · depuis 2010</span>
        </span>
      </a>

      <nav class="flex items-center gap-6 text-sm" aria-label="Navigation principale">
        @for (item of navItems; track item.url) {
          <a
            [routerLink]="item.url"
            class="border-b-2 pb-[3px]"
            [class]="activeUrl() === item.url
              ? 'border-orange font-semibold text-ink-2'
              : 'border-transparent font-normal text-slate-2 hover:text-ink-2'">{{ item.label }}</a>
        }
        <app-pill-button routerLink="/association/comment-aider" [small]="true">Nous aider</app-pill-button>
      </nav>
    </div>

    <app-navigation-mobile [navItems]="navItems" [activeUrl]="activeUrl()" [crumb]="crumb()" class="lg:hidden"></app-navigation-mobile>
  </header>
}
