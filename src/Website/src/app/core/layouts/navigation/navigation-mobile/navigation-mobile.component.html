<div class="bg-ink px-[18px] py-2 font-mono text-[10.5px] text-mist-2">
  <span class="flex items-center gap-2">
    <span class="h-1.5 w-1.5 shrink-0 rounded-full bg-orange-2"></span>
    <span class="truncate">Suivez nos prochains évènements solidaires</span>
  </span>
</div>

<div class="flex items-center justify-between border-b border-line px-[18px] py-3">
  <a routerLink="/accueil" (click)="close()" class="flex items-center gap-[9px]" aria-label="Retour à l'accueil">
    <img priority ngSrc="images/papillon_without_back.png" alt="" width="32" height="32" class="h-8 w-8 object-contain">
    <span class="flex flex-col gap-0.5">
      <span class="font-serif text-[15px] leading-none">Vole Papillon d'Amour</span>
      <span class="font-mono text-[8px] uppercase tracking-[.18em] text-slate-3">Depuis 2010</span>
    </span>
  </a>
  <span class="flex items-center gap-2.5">
    <app-pill-button routerLink="/association/comment-aider" [small]="true" (click)="close()">Nous aider</app-pill-button>
    <button
      type="button"
      (click)="toggle()"
      class="flex flex-col gap-1 p-1"
      [attr.aria-expanded]="isOpen()"
      [attr.aria-label]="isOpen() ? 'Fermer le menu' : 'Ouvrir le menu'">
      <span class="h-[1.5px] w-[19px] bg-ink-2"></span>
      <span class="h-[1.5px] w-[19px] bg-ink-2"></span>
      <span class="h-[1.5px] w-[13px] bg-ink-2"></span>
    </button>
  </span>
</div>

<div class="flex items-center gap-2 border-b border-line-2 bg-white px-[18px] py-[9px] font-mono text-[10px] uppercase tracking-[.14em] text-blue">
  <span class="h-px w-3.5 bg-orange"></span>{{ crumb() }}
</div>

@if (isOpen()) {
  <div class="fixed inset-0 z-50 flex flex-col bg-ink/95 px-6 py-8 text-paper">
    <button type="button" (click)="close()" class="ml-auto flex h-9 w-9 items-center justify-center rounded-full bg-white/10" aria-label="Fermer le menu">✕</button>
    <nav class="mt-8 flex flex-col gap-1" aria-label="Navigation mobile">
      @for (item of navItems(); track item.url; let i = $index) {
        <a
          [routerLink]="item.url"
          (click)="close()"
          class="flex items-center gap-4 border-b border-white/10 py-4"
          [class]="activeUrl() === item.url ? 'text-orange-2' : 'text-paper'">
          <span class="font-mono text-xs text-mist">{{ i + 1 < 10 ? '0' + (i + 1) : i + 1 }}</span>
          <span class="font-serif text-2xl">{{ item.label }}</span>
        </a>
      }
    </nav>
    <div class="mt-auto flex gap-4 pt-8">
      <a href="https://www.facebook.com/melvin.drevet.1" target="_blank" rel="noopener noreferrer" class="flex h-10 w-10 items-center justify-center rounded-full bg-cyan/[.14]" aria-label="Facebook">
        <img priority ngSrc="images/facebook.svg" alt="" width="16" height="16">
      </a>
      <a href="https://www.instagram.com/vole_papillon_damour" target="_blank" rel="noopener noreferrer" class="flex h-10 w-10 items-center justify-center rounded-full bg-cyan/[.14]" aria-label="Instagram">
        <img priority ngSrc="images/instagram.svg" alt="" width="16" height="16">
      </a>
    </div>
  </div>
}
