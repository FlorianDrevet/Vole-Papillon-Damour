<nav aria-label="Sections consacrées à Maxence" class="flex flex-wrap items-center gap-2 border-b border-line bg-paper-2 px-shell py-3.5">
  @for (item of items; track item.url) {
    <a
      [routerLink]="item.url"
      class="rounded-full px-4 py-2 text-[13px] font-medium transition"
      [class]="isActive(item) ? 'bg-ink-2 text-paper' : 'text-slate-2 hover:bg-white hover:text-ink-2'">
      {{ item.label }}
    </a>
  }
</nav>
