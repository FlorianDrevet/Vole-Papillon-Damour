<blockquote
  class="flex gap-6 rounded-sm py-6 pl-6 pr-6"
  [class]="tone() === 'dark' ? 'bg-white/[.04]' : 'bg-paper-2'">
  <span class="w-1 shrink-0 rounded-full bg-vpd-brand"></span>
  <div class="flex flex-col gap-3">
    <p
      class="font-serif text-[28px] italic leading-snug"
      [class]="tone() === 'dark' ? 'text-white' : 'text-ink-2'">{{ quote() }}</p>
    @if (attribution()) {
      <cite class="font-mono text-[11px] not-italic uppercase tracking-[.14em]" [class]="tone() === 'dark' ? 'text-mist' : 'text-slate-3'">- {{ attribution() }}</cite>
    }
  </div>
</blockquote>
