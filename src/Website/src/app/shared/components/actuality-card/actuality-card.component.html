<a [routerLink]="['/actualite', ActualityModel().id]" class="group flex flex-col gap-3.5">
  <img appImageFadeIn [src]="ActualityModel().urlPrincipalImage" [alt]="ActualityModel().title" class="h-48 w-full rounded object-cover transition-transform duration-[var(--vpd-motion-base)] group-hover:scale-[1.02] group-focus-visible:scale-[1.02]">
  <span class="font-mono text-[11px] tracking-[.1em] text-slate-3">{{ ActualityModel().date | date:'d MMM yyyy' }}</span>
  <h3 class="font-serif text-xl font-medium leading-tight text-ink-2 transition-colors group-hover:text-blue group-focus-visible:text-blue">{{ ActualityModel().title }}</h3>
  <p class="text-sm leading-relaxed text-slate-2">{{ excerpt(ActualityModel().article) }}</p>
</a>
