@if (vpdEvent() === null) {
  <div class="flex justify-center py-24"><mat-spinner></mat-spinner></div>
} @else {
  <section class="flex flex-col gap-4 bg-ink px-6 py-14 text-mist-2 lg:px-11 lg:py-16">
    <a routerLink="/evenement" class="font-mono text-xs tracking-[.1em] text-cyan">← TOUS LES ÉVÈNEMENTS</a>
    <h1 class="max-w-[24ch] font-serif text-[34px] font-medium leading-tight text-white lg:text-[46px]">{{ vpdEvent()!.name }}</h1>
  </section>

  <div class="mx-auto flex max-w-[860px] flex-col gap-10 px-6 py-12 lg:px-11 lg:py-14">
    @if (vpdEvent()!.eventType === VpdEventEnum.Bingo) {
      <app-bingo-event [vpdEvent]="vpdEvent()!"></app-bingo-event>
    } @else if (vpdEvent()!.eventType === VpdEventEnum.Books) {
      <app-books-event [vpdEvent]="vpdEvent()!"></app-books-event>
    } @else {
      <app-other-event [vpdEvent]="vpdEvent()!"></app-other-event>
    }

    <a routerLink="/evenement" class="self-start font-mono text-xs tracking-[.1em] text-blue">← Retour aux évènements</a>
  </div>
}
