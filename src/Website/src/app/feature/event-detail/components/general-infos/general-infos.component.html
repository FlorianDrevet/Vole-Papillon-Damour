<section class="grid grid-cols-1 gap-10 bg-paper px-shell py-14 lg:grid-cols-[minmax(0,1fr)_400px] lg:gap-14 lg:py-[70px]">
  <div class="flex flex-col gap-5">
    <app-section-eyebrow label="Le rendez-vous">
      <h2 class="max-w-[16ch] font-serif text-[28px] font-medium leading-[1.06] text-ink-2 lg:text-[38px]">
        Ce qui vous attend.
      </h2>
    </app-section-eyebrow>
    <p class="max-w-[58ch] text-[16px] leading-relaxed text-slate-2" style="text-wrap: pretty">
      {{ vpdEvent().description }}
    </p>
  </div>

  <!-- La carte reprend le langage visuel des cartes de lieux de la page Événements. -->
  <aside class="event-location-card group flex h-fit flex-col overflow-hidden rounded-xl border border-line bg-white shadow-[0_26px_50px_-38px_rgba(7,43,69,0.55)] lg:sticky lg:top-24">
    <div class="relative overflow-hidden bg-white">
      <iframe
        [src]="mapsEmbedUrl()"
        [title]="'Carte du lieu de ' + vpdEvent().name"
        loading="lazy"
        referrerpolicy="no-referrer-when-downgrade"
        class="event-location-map h-56 w-full border-0 sm:h-64"></iframe>
      <a
        [href]="mapsUrl()"
        target="_blank"
        rel="noopener noreferrer"
        class="absolute left-4 top-4 inline-flex items-center gap-2 rounded-full bg-white px-3.5 py-2 font-mono text-[10px] font-medium uppercase tracking-[.1em] text-blue shadow-[0_8px_20px_-12px_rgba(7,43,69,.75)] transition hover:bg-orange-2 hover:text-ink-2">
        Ouvrir dans Maps <span aria-hidden="true" class="text-sm leading-none">↗</span>
      </a>
    </div>

    <div class="flex flex-1 flex-col gap-2 px-6 py-6 lg:px-7">
      <span class="font-mono text-[10px] uppercase tracking-[.16em] text-blue">Lieu du rendez-vous</span>
      <h3 class="event-location-address font-serif text-[24px] font-medium leading-tight text-ink-2">{{ address() }}</h3>
      <p class="max-w-[38ch] text-[13px] leading-relaxed text-slate-2">
        Retrouvez ici les horaires et les informations pratiques de cette édition.
      </p>

      <div class="mt-3 flex flex-col divide-y divide-line border-t border-line">
        <ng-content></ng-content>
      </div>

      <a
        [href]="mapsUrl()"
        target="_blank"
        rel="noopener noreferrer"
        class="mt-auto pt-4 font-mono text-[11px] tracking-[.12em] text-blue transition hover:text-blue-2">
        ITINÉRAIRE <span aria-hidden="true">→</span>
      </a>
    </div>
  </aside>
</section>
