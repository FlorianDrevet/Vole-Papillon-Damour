<section class="grid grid-cols-1 gap-10 bg-paper px-shell py-14 lg:grid-cols-[minmax(0,1fr)_400px] lg:gap-14 lg:py-[70px]">
  <div class="flex flex-col gap-5">
    <app-section-eyebrow label="Le rendez-vous">
      <h2 class="max-w-[16ch] font-serif text-[28px] font-medium leading-[1.06] text-ink-2 lg:text-[38px]">
        Ce qui vous attend.
      </h2>
    </app-section-eyebrow>
    <p class="max-w-[58ch] text-[16px] leading-relaxed text-slate-2" style="text-wrap: pretty">
      {{ vpdEvent().description }}
    </p>
  </div>

  <div class="event-photo-gallery" role="group" aria-label="Photos du rendez-vous">
    @if (eventPhotos().length > 1) {
      <div class="grid h-[300px] grid-cols-3 grid-rows-2 gap-1 overflow-hidden rounded-xl border border-line-2 bg-line-2 p-1 sm:h-[360px]">
        <figure class="group relative col-span-2 row-span-2 overflow-hidden rounded-lg">
          <img
            [src]="eventPhotos()[0]"
            [alt]="vpdEvent().name"
            loading="lazy"
            decoding="async"
            class="h-full w-full object-cover transition duration-500 group-hover:scale-105">
          <span class="pointer-events-none absolute inset-x-0 bottom-0 h-28 bg-gradient-to-t from-ink/75 to-transparent"></span>
          <figcaption class="absolute bottom-4 left-5 font-mono text-[10px] uppercase tracking-[.16em] text-white/90">
            L'édition en images
          </figcaption>
        </figure>

        @for (photo of eventPhotos().slice(1, 3); track photo) {
          <figure class="relative overflow-hidden rounded-lg">
            <img
              [src]="photo"
              alt=""
              aria-hidden="true"
              loading="lazy"
              decoding="async"
              class="h-full w-full object-cover transition duration-500 hover:scale-105">
          </figure>
        }
      </div>
    } @else {
      <figure class="relative h-[300px] overflow-hidden rounded-xl border border-line-2 bg-line-2 p-1 sm:h-[360px]">
        <img
          [src]="eventPhotos()[0]"
          [alt]="vpdEvent().name"
          loading="lazy"
          decoding="async"
          class="h-full w-full rounded-lg object-cover">
      </figure>
    }
  </div>
</section>
