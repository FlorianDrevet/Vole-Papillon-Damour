<div
  class="flex w-full flex-col gap-4 rounded-sm border px-5 py-5"
  [class]="Partie().partieType === PartieTypeEnum.STANDARD ? 'border-line-2' : 'border-orange/40 bg-orange/[.04]'">
  <h4 class="font-serif text-xl font-medium" [class]="Partie().partieType === PartieTypeEnum.STANDARD ? 'text-ink-2' : 'text-orange-3'">{{ Partie().name }}</h4>
  <div class="flex flex-col gap-3">
    @for (linePartie of lineParties(); track linePartie.id) {
      <app-lot-card [LinePartie]="linePartie"></app-lot-card>
    }
  </div>
</div>
