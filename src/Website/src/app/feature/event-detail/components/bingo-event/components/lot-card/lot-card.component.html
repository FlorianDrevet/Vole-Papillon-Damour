<div class="flex items-center gap-4 rounded-md border border-line-2 bg-paper px-3.5 py-3">
  <span class="flex h-14 w-14 shrink-0 items-center justify-center overflow-hidden rounded-md bg-white">
    <img [src]="currentLot().urlImage" alt="" class="h-full w-full object-contain p-1.5">
  </span>

  <span class="flex min-w-0 flex-1 flex-col gap-0.5">
    <span class="font-mono text-[10px] uppercase tracking-[.14em] text-blue">{{ LinePartie().numberLine | lineNumberTitle }}</span>
    <span class="text-[15px] font-medium leading-snug text-ink-2">{{ currentLot().name }}</span>
  </span>

  <!-- Plusieurs lots pour une même ligne : ils sont au choix du gagnant, on les fait
       défiler sur place plutôt que d'allonger la carte. -->
  @if (hasSeveralLots()) {
    <span class="flex shrink-0 items-center gap-1.5">
      <button
        type="button"
        (click)="previousLot()"
        aria-label="Lot précédent"
        class="flex h-7 w-7 items-center justify-center rounded-full border border-line transition hover:border-blue-2 hover:bg-white">
        <img class="h-2.5" src="icons/arrow-left-triangle.svg" alt="">
      </button>
      <span class="w-8 text-center font-mono text-[10px] tracking-[.08em] text-slate-3">
        {{ currentLotIndex() + 1 }}/{{ LinePartie().lots.length }}
      </span>
      <button
        type="button"
        (click)="nextLot()"
        aria-label="Lot suivant"
        class="flex h-7 w-7 items-center justify-center rounded-full border border-line transition hover:border-blue-2 hover:bg-white">
        <img class="h-2.5" src="icons/arrow-right-triangle.svg" alt="">
      </button>
    </span>
  }
</div>
