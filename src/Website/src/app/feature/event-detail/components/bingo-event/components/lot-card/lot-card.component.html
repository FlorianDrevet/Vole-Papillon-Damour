<div class="flex w-full items-center gap-3 py-1">
  @if (LinePartie().lots.length > 1) {
    <button type="button" (click)="previousLot()" aria-label="Lot précédent">
      <img class="h-4" src="icons/arrow-left-triangle.svg" alt="">
    </button>
  }
  <div class="flex w-full items-center gap-4 rounded-sm bg-paper-2 px-4 py-3">
    <div class="flex h-16 w-16 shrink-0 items-center justify-center rounded-sm bg-white p-2">
      <img [src]="currentLot().urlImage" alt="" class="h-full w-full object-contain">
    </div>
    <div class="flex flex-col gap-1">
      <span class="font-mono text-[11px] uppercase tracking-[.1em] text-blue">
        {{ LinePartie().numberLine | lineNumberTitle }}
        @if (LinePartie().lots.length > 1) { <span class="text-slate-3">· ou</span> }
      </span>
      <span class="text-sm font-medium text-ink-2">{{ currentLot().name }}</span>
    </div>
  </div>
  @if (LinePartie().lots.length > 1) {
    <button type="button" (click)="nextLot()" aria-label="Lot suivant">
      <img class="h-4" src="icons/arrow-right-triangle.svg" alt="">
    </button>
  }
</div>
