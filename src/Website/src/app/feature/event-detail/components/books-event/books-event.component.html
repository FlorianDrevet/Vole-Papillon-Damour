<app-general-infos [vpdEvent]="vpdEvent()">
  <app-section-infos-event
    Title="Dates"
    UrlIcon="icons/calendar-icon.svg"
    [Value]="'Du ' + (vpdEvent().dateStart | date: 'EEEE d MMMM') + '<br>au ' + (vpdEvent().dateEnd | date: 'EEEE d MMMM yyyy')">
  </app-section-infos-event>
  <app-section-infos-event
    Title="Horaires"
    UrlIcon="icons/clock-icon.svg"
    [Value]="'De ' + (vpdEvent().hourOpenDoors | date: 'HH:mm':'UTC') + ' à ' + (vpdEvent().hourCloseDoors | date: 'HH:mm':'UTC')">
  </app-section-infos-event>
</app-general-infos>

<section class="relative flex flex-col gap-8 overflow-hidden bg-white px-shell py-14 lg:gap-9 lg:py-[76px]">
  <div class="flex flex-col items-start justify-between gap-4 border-b border-line-2 pb-5 sm:flex-row sm:items-end">
    <app-section-eyebrow label="Sur place" orientation="left">
      <h2 class="font-serif text-[26px] font-medium leading-none text-ink-2 lg:text-[34px]">Les tarifs.</h2>
    </app-section-eyebrow>
    <p class="max-w-[42ch] text-[14px] leading-relaxed text-slate-2 sm:text-right">
      Des ouvrages classés par univers, avec des prix simples affichés clairement sur place.
    </p>
  </div>
  <app-prices [section]="ProductSectionEnum.Book"></app-prices>
</section>
