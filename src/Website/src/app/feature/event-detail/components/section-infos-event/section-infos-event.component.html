<div class="flex flex-col gap-1.5">
  <span class="flex items-center gap-2.5">
    <img [src]="UrlIcon()" alt="" class="h-4 w-4 opacity-70">
    <span class="font-mono text-[11px] uppercase tracking-[.12em] text-slate-3">{{ Title() }}</span>
  </span>
  @if (Value()) {
    <p class="pl-6 text-[15px] text-ink-2" [innerHTML]="Value()"></p>
  }
  <div class="pl-6">
    <ng-content select="value"></ng-content>
    <ng-content></ng-content>
  </div>
</div>
