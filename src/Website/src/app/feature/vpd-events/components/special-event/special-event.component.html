<div class="flex flex-col">
  <div class="flex flex-col mb-5 lg:mb-16">
    <div class="flex flex-row justify-between">
      <h2 class="text-primary-color text-4xl lg:text-6xl">{{Title()}}</h2>
      @if (Date() !== null) {
        <div class="flex flex-row items-center lg:mb-2">
          <img src="icons/calendar-icon.svg" class="hidden lg:block lg:h-50 w-auto" fetchpriority="high">
          <p class="text-text-color text-2xl lg:text-4xl pl-1 " style="margin-bottom: -5px">{{Date() | date: 'dd/MM/yyyy'}}{{(DateEnd() !== null && DateEnd() !== undefined) ?  ' - ' + (DateEnd() | date: 'dd/MM/yyyy'): ''}}</p>
        </div>
      }
    </div>
    <div class="h-2 w-full bg-primary-color"></div>
  </div>

  <div class="flex flex-col lg:flex-row justify-evenly items-center">
      <app-vpd-image [src]="UrlImage()"
                     [backgroundColor]="BackgroundColorEnum.WHITE"></app-vpd-image>
    <p class="w-full lg:w-3/5 text-primary-color text-justify text-2xl lg:text-4xl mt-5 lg:mt-0">
      <ng-content></ng-content>
    </p>
  </div>
  @if(IdEvent() !== null) {
    <div class="mt-10 flex flex-col lg:flex-row items-center gap-5 lg:gap-5">
      <a [href]="UrlMoreDetail()">
        <app-button class="hidden lg:block">Plus d’informations sur la prochaine édition ></app-button>
        <app-button class="lg:hidden">Prochaine édition ></app-button>
      </a>
      <a href="evenement/all" >
        <app-button class="w-full lg:w-fit">Prochaines dates ></app-button>
      </a>
    </div>
  }
</div>
