<article class="flex h-full flex-col overflow-hidden rounded-lg border border-line bg-white shadow-[0_26px_50px_-38px_rgba(7,43,69,0.55)]">
  <div class="grid h-[170px] grid-cols-3 grid-rows-2 gap-1 bg-line-2 lg:h-[230px]">
    <div class="relative col-span-2 row-span-2 overflow-hidden">
      <img [src]="mainPhoto()" [alt]="Title()" loading="lazy" decoding="async" class="h-full w-full object-cover">
      <span class="pointer-events-none absolute inset-x-0 bottom-0 h-24 bg-gradient-to-t from-ink/75 to-transparent"></span>
      <span class="absolute bottom-4 left-5 text-[13px] font-medium text-white">{{ Kicker() }}</span>
    </div>

    @for (photo of thumbnails(); track photo) {
      <div class="relative overflow-hidden">
        <img [src]="photo" alt="" aria-hidden="true" loading="lazy" decoding="async" class="h-full w-full object-cover">
      </div>
    }
  </div>

  <div class="flex flex-1 flex-col gap-5 px-6 py-7 lg:px-8">
    <div class="flex flex-col gap-3">
      <h2 class="font-serif text-[28px] font-medium leading-[1.08] text-ink-2 lg:text-[32px]">{{ Title() }}</h2>
      <div class="text-[15px] leading-relaxed text-slate-2 [&>p+p]:mt-3">
        <ng-content select="[lead]"></ng-content>
        @if (HasMore()) {
          <div [id]="detailsId" [hidden]="!isExpanded()" class="mt-3 flex flex-col gap-3">
            <ng-content select="[details]"></ng-content>
          </div>
          <button
            type="button"
            class="mt-3 inline-flex min-h-11 items-center rounded-sm font-semibold text-blue underline underline-offset-4"
            [attr.aria-expanded]="isExpanded()"
            [attr.aria-controls]="detailsId"
            (click)="toggleDetails()">
            {{ isExpanded() ? 'Lire moins' : 'Lire la suite' }}
          </button>
        }
      </div>
    </div>

    @if (Highlights().length) {
      <ul class="flex flex-col gap-2.5">
        @for (highlight of Highlights(); track highlight) {
          <li class="flex gap-3 text-[14px] leading-snug text-slate-2">
            <span class="mt-[7px] h-1.5 w-1.5 shrink-0 rounded-full" [ngClass]="bulletClass()"></span>{{ highlight }}
          </li>
        }
      </ul>
    }
  </div>
</article>
