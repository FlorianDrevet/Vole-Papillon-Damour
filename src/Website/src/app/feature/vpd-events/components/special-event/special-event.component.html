<div class="grid grid-cols-1 gap-6 overflow-hidden rounded lg:grid-cols-[1fr_360px]">
  <div class="relative flex flex-col justify-between gap-6 px-8 py-9 text-white" style="background: linear-gradient(205deg, #7fd8f5 0%, #1497d6 26%, #0c6ea6 52%, #062a44 100%)">
    <img ngSrc="images/papillon_without_back.png" alt="" width="220" height="220" class="absolute -bottom-10 -right-8 w-[220px] opacity-[.16]">
    <div class="relative flex flex-col gap-3">
      <span class="font-mono text-[11px] uppercase tracking-[.16em] text-white/80">Prochain évènement</span>
      <h2 class="font-serif text-3xl font-medium">{{ Title() }}</h2>
      @if (Date(); as date) {
        <span class="font-mono text-sm text-white/90">
          {{ date | date:'d MMMM yyyy' }}{{ DateEnd() ? ' → ' + (DateEnd() | date:'d MMMM yyyy') : '' }}
        </span>
      }
      <p class="max-w-[54ch] text-[15px] leading-relaxed text-white/90"><ng-content></ng-content></p>
    </div>
    @if (IdEvent()) {
      <div class="relative flex flex-wrap gap-3">
        <app-pill-button [routerLink]="UrlMoreDetail()" variant="secondary-dark">Plus d'informations</app-pill-button>
        <app-pill-button routerLink="/evenement/all" variant="ghost-dark">Prochaines dates</app-pill-button>
      </div>
    }
  </div>
  <img [src]="UrlImage()" [alt]="Title()" class="h-56 w-full object-cover lg:h-full">
</div>
