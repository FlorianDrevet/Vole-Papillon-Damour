<div class="flex flex-col p-5 lg:p-10 mb-10" >
  <div class="w-full flex">
    <div class="mb-10 lg:mt-5 flex flex-row ml-auto mr-auto items-center">
      <h1 class="text-primary-color text-6xl lg:text-8xl text-center">Toute l'actualité</h1>
      <img class="hidden lg:block h-[100px] ml-5" src="icons/newspaper-icon.svg">
    </div>
  </div>

  @if(isLoading()) {
    <mat-spinner class="ml-auto mr-auto"></mat-spinner>
  }
  @else {
    <div class="flex flex-col gap-10">
      @for(month of groupedActualities(); track month) {
        <app-actuality-by-month Title="{{month.month | capitalize}} {{month.year}}" [Actualities]="month.actualities"></app-actuality-by-month>
      }
    </div>
  }
</div>
