<section
  [id]="'date-' + Year()"
  class="scroll-mt-24 px-shell py-14 lg:py-20"
  [class]="ContainerBackgroundContainer() === BackgroundColorEnum.BLUE ? 'bg-paper-2' : 'bg-paper'">
  <div class="mx-auto flex max-w-[760px] flex-col gap-8">
    <div class="flex items-center gap-4">
      <span class="h-px w-10 bg-vpd-brand"></span>
      <span class="font-mono text-[11px] uppercase tracking-[.18em] text-blue">Chapitre · {{ Year() }}–{{ Year() + 1 }}</span>
    </div>
    <h3 class="font-serif text-[32px] font-medium leading-tight text-ink-2 lg:text-[42px]">{{ Title() }}</h3>
    <div class="content-history flex flex-col gap-8 text-[17px] leading-[1.78] text-slate">
      <ng-content></ng-content>
    </div>
  </div>
</section>
