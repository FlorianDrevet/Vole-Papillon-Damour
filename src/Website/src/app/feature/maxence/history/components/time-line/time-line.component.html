<nav aria-label="Sommaire du récit" class="flex flex-col gap-1">
  @for (chapter of chapters; track chapter.year; let i = $index) {
    <a
      routerLink="/maxence/histoire"
      [fragment]="'date-' + chapter.year"
      class="flex items-baseline gap-2.5 border-b border-line-2 py-2 text-sm text-slate-2 hover:text-blue">
      <span class="font-mono text-[11px] text-slate-3">{{ i + 1 < 10 ? '0' + (i + 1) : i + 1 }}</span>
      <span>{{ chapter.title }}</span>
    </a>
  }
  <a routerLink="/maxence/maladies" class="mt-3 font-mono text-xs tracking-[.1em] text-orange">SES MALADIES EN DÉTAIL →</a>
</nav>
