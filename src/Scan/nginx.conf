server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain application/manifest+json;

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 'ok';
    }

    location = /index.html {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    location = /ngsw-worker.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location = /ngsw.json {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }

    # Fichiers à empreinte Angular (ex. main-OUKAWBEM.js) : cache immuable.
    location ~* "-[a-z0-9]{8}\.(?:js|css|woff2?)$" {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Autres assets (svg, png, ico…) non hashés : cache court.
    location ~* \.(?:css|js|woff2|png|jpg|jpeg|svg|webp|ico)$ {
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }
}
