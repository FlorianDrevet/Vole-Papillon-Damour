<main class="rare-management-screen" aria-labelledby="rare-list-title">
  <header class="rare-flow-header">
    <button type="button" class="rare-flow-back" routerLink="/accueil" aria-label="Retour à l’accueil">
      <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M19 12H5"></path>
        <path d="m11 6-6 6 6 6"></path>
      </svg>
    </button>
    <p id="rare-list-title" class="rare-flow-title">LIVRES RARES</p>
  </header>

  <scan-status-bar
    [offline]="false"
    [actionRequired]="pendingPhotoCount > 0"
    [pendingRarePhotos]="pendingPhotoCount"
    detail="Les fiches et photos restent conservées sur cet appareil."
    (statusRequested)="reload()"></scan-status-bar>

  <section class="rare-list-toolbar" aria-label="Recherche et filtres">
    <label class="rare-search">
      <span class="visually-hidden">Rechercher une fiche</span>
      <span class="rare-search-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
          <circle cx="10.7" cy="10.7" r="6.2"></circle>
          <path d="m15.3 15.3 4.4 4.4"></path>
        </svg>
      </span>
      <input type="search" [(ngModel)]="search" placeholder="Chercher un titre, un auteur">
    </label>

    <div *ngIf="!loading" class="rare-filter-tabs" role="tablist" aria-label="Filtrer les fiches">
      <button
        type="button"
        role="tab"
        class="rare-filter-tab"
        [class.rare-filter-tab-active]="listFilter === 'all'"
        [attr.aria-selected]="listFilter === 'all'"
        (click)="listFilter = 'all'">
        Toutes · {{ books.length }}
      </button>
      <button
        type="button"
        role="tab"
        class="rare-filter-tab"
        [class.rare-filter-tab-active]="listFilter === 'drafts'"
        [attr.aria-selected]="listFilter === 'drafts'"
        (click)="listFilter = 'drafts'">
        Brouillons · {{ draftCount }}
      </button>
    </div>
  </section>

  <div *ngIf="loading" class="rare-loading">
    <vpd-loader
      variant="butterflies"
      logoSrc="assets/papillon_without_back.png"
      label="Chargement des fiches rares"
      detail="Récupération des fiches…"></vpd-loader>
  </div>
  <div *ngIf="error" class="rare-error" role="alert">
    <p>{{ error }}</p>
    <button type="button" class="rare-retry" (click)="reload()">Réessayer</button>
  </div>

  <section *ngIf="!loading && !error" class="rare-list" aria-label="Fiches rares">
    <button
      *ngFor="let book of filteredBooks"
      type="button"
      class="rare-card"
      [class.rare-card-sold]="book.isSold"
      (click)="open(book)">
      <span class="rare-card-photo">
        <img *ngIf="book.thumbnail" [src]="book.thumbnail" [alt]="'Vignette de ' + book.title">
        <span *ngIf="!book.thumbnail" class="rare-card-photo-placeholder">PHOTO</span>
      </span>
      <span class="rare-card-copy">
        <span class="rare-card-status">{{ statusLabel(book) }}</span>
        <strong>{{ book.title || 'Titre à renseigner' }}</strong>
        <span *ngIf="book.authorMention" class="rare-card-author">{{ book.authorMention }}</span>
        <span class="rare-card-meta">{{ book.publicationYear || 'année à préciser' }}</span>
        <span class="rare-card-price">{{ priceLabel(book) }} · {{ photoLabel(book) }}</span>
        <span *ngIf="book.syncStatus !== 'Synced'" class="rare-card-pending">À synchroniser</span>
      </span>
      <span class="rare-card-arrow" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M5 12h14"></path>
          <path d="m13 6 6 6-6 6"></path>
        </svg>
      </span>
    </button>
    <p *ngIf="books.length === 0" class="rare-empty">Aucune fiche rare pour le moment.</p>
    <p *ngIf="books.length > 0 && filteredBooks.length === 0" class="rare-empty">
      Aucune fiche ne correspond à la recherche ou au filtre sélectionné.
    </p>
  </section>

  <footer *ngIf="!error" class="rare-list-footer">
    <button type="button" class="rare-add" (click)="openNew()">
      <span aria-hidden="true">＋</span> Ajouter un livre rare
    </button>
  </footer>
</main>
