<section
  *ngIf="confirmation.request() as request"
  class="scan-confirmation-backdrop"
  role="presentation">
  <div
    class="scan-confirmation-dialog"
    role="alertdialog"
    aria-modal="true"
    aria-labelledby="scan-confirmation-title"
    aria-describedby="scan-confirmation-message">
    <h2 id="scan-confirmation-title">{{ request.title }}</h2>
    <p id="scan-confirmation-message">{{ request.message }}</p>
    <div class="scan-confirmation-actions">
      <button type="button" class="scan-confirmation-cancel" (click)="confirmation.resolve(false)">
        {{ request.cancelLabel }}
      </button>
      <button type="button" class="scan-confirmation-confirm" (click)="confirmation.resolve(true)">
        {{ request.confirmLabel }}
      </button>
    </div>
  </div>
</section>
