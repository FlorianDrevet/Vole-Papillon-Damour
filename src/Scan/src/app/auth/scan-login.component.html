<main class="login-screen" aria-labelledby="login-title">
  <section class="login-card">
    <p class="login-kicker">Bourse aux livres</p>
    <div class="login-mark" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 6.5C10.5 5.2 8.6 4.5 6 4.5H3.5v13H6c2.6 0 4.5.7 6 2 1.5-1.3 3.4-2 6-2h2.5v-13H18c-2.6 0-4.5.7-6 2Z"></path>
        <path d="M12 6.5v13"></path>
      </svg>
    </div>
    <h1 id="login-title">Accès bénévole</h1>

    <ng-container *ngIf="authState$ | async as authState">
      <p *ngIf="authState.status === 'checking'" class="login-message">Vérification de votre session…</p>
      <p *ngIf="authState.status === 'unauthenticated'" class="login-message">
        Connectez-vous pour accéder au scan et au catalogue de la bourse.
      </p>
      <p *ngIf="authState.status === 'unauthorized'" class="login-message login-message-error" role="alert">
        Ce compte est connecté, mais il ne possède pas le rôle {{ authState.requiredRole }} requis pour cette application.
      </p>

      <button
        type="button"
        class="login-primary"
        [disabled]="authState.status === 'checking'"
        (click)="login()">
        Se connecter
      </button>
      <button
        *ngIf="authState.status === 'unauthorized'"
        type="button"
        class="login-secondary"
        (click)="logout()">
        Changer de compte
      </button>
    </ng-container>

    <p class="login-footnote">Accès réservé aux bénévoles habilités au tri.</p>
  </section>
</main>
