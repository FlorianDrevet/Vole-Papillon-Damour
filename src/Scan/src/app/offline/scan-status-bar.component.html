<button
  *ngIf="isVisible"
  type="button"
  class="status-strip"
  [class.status-strip-offline]="offline"
  [class.status-strip-action]="actionRequired"
  aria-label="Afficher les actions liées à l’état de l’application"
  (click)="statusRequested.emit()">
  <span class="status-strip-indicator" aria-hidden="true"></span>
  <span class="status-strip-copy">
    <span class="status-strip-tags">
      <span *ngIf="offline" class="status-tag status-tag-offline">(hors connexion)</span>
      <span *ngIf="actionRequired" class="status-tag status-tag-action">(action à faire)</span>
    </span>
    <span class="status-strip-detail">{{ detail }}</span>
  </span>
  <svg class="status-strip-chevron" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
    <path d="m9 5 7 7-7 7"></path>
  </svg>
</button>
