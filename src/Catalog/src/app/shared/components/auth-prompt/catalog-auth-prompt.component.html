@if (open) {
  <div class="auth-prompt-overlay" role="presentation" (click)="requestClose()">
    <section
      class="auth-prompt-dialog"
      data-testid="auth-prompt-dialog"
      role="dialog"
      aria-modal="true"
      aria-labelledby="auth-prompt-title"
      aria-describedby="auth-prompt-description"
      (click)="$event.stopPropagation()">
      <button type="button" class="auth-prompt-close" aria-label="Fermer" (click)="requestClose()">×</button>

      <div class="auth-prompt-brand">
        <span class="auth-prompt-mark" aria-hidden="true">
          <img src="images/papillon_without_back.png" alt="" width="30" height="30">
        </span>
        <p class="eyebrow">{{ eyebrow }}</p>
      </div>

      <h2 id="auth-prompt-title">{{ title }}</h2>
      <p id="auth-prompt-description" class="auth-prompt-lead">
        {{ description }}
      </p>

      @if (benefits.length > 0) {
        <ul class="auth-prompt-benefits">
          @for (benefit of benefits; track benefit) {
            <li>{{ benefit }}</li>
          }
        </ul>
      }

      <div class="auth-prompt-actions">
        <button type="button" class="auth-prompt-button" data-testid="auth-prompt-login" (click)="requestLogin()">
          {{ primaryLabel }} <span aria-hidden="true">→</span>
        </button>
        <button type="button" class="auth-prompt-button secondary" data-testid="auth-prompt-register" (click)="requestSecondaryAction()">
          {{ secondaryLabel }} <span aria-hidden="true">{{ secondaryAsClose ? '×' : '↗' }}</span>
        </button>
      </div>

      <p class="auth-prompt-hint">{{ hint }}</p>
    </section>
  </div>
}
